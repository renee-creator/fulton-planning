<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fulton Family Handbook</title>
<link rel="icon" href="tree-icons/favicon-32.png" type="image/png">
<style>
@font-face{font-family:Andika;src:url(fonts/Andika-Regular.ttf)}
@font-face{font-family:Andika;font-weight:700;src:url(fonts/Andika-Bold.ttf)}
:root{--bg:#fbf8f0;--paper:#fff;--ink:#1b2920;--muted:#46564c;--line:#d8dccf;--moss:#2b5a40;--moss-soft:#dce9de;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121814;--paper:#1d2620;--ink:#edf2ed;--muted:#aebdb3;--line:#3a4a41;--moss:#93ccaa;--moss-soft:#24382c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121814;--paper:#1d2620;--ink:#edf2ed;--muted:#aebdb3;--line:#3a4a41;--moss:#93ccaa;--moss-soft:#24382c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Andika,"Segoe UI",system-ui,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:0;color:var(--moss)}h2{font-size:21px;margin:0 0 8px;color:var(--moss)}h3{font-size:17px;margin:16px 0 4px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
.muted{color:var(--muted)}.small{font-size:14px}
a{color:var(--moss)}
.toc a{display:block;padding:6px 0;border-top:1px solid var(--line)}.toc a:first-child{border-top:0}
.pmd h4{font-size:16px;margin:14px 0 4px}.pmd h5{font-size:15px;margin:12px 0 4px}.pmd p{margin:6px 0}.pmd ul,.pmd ol{margin:6px 0;padding-left:22px}.pmd li{margin:3px 0}.pmd li.pmnest{list-style:none}
.pmd blockquote{margin:6px 0;padding-left:12px;border-left:3px solid var(--line)}.pmd img{max-width:100%;height:auto;display:block;margin:8px auto}
.pmd table{border-collapse:collapse;width:100%;font-size:14px}.pmd td,.pmd th{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}.pmd .tw{overflow-x:auto}
.cover{display:block;max-width:220px;margin:12px auto 0}
details.part>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}details.part>summary::-webkit-details-marker{display:none}
details.part>summary h2{margin:0}details.part>summary::after{content:"Open";font-size:14px;color:var(--moss);text-decoration:underline}details.part[open]>summary::after{content:"Close"}details.part[open]>summary{margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
<div class="eyebrow">Fulton Community School &amp; Farm</div>
<h1 id="title">Family Handbook</h1>
<div id="out" class="muted" style="margin-top:12px">Opening the Family Handbook.</div>
</div>
<script src="policy-md.js"></script>
<script>
/* The Family Handbook for prospective families and the school's website, read only and with no sign-in. The server sends
   it only once the director has read the list of names and private details in it and turned the public link on. */
(function(){
  const qs=new URLSearchParams(location.search);
  const want=(qs.get("server")||"").replace(/\/+$/,"");
  const local=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(want);
  const SERVER=local?want:"https://fulton-planning.onrender.com";
  const esc=window.PolicyMd.esc;
  const post=(p,b)=>fetch(SERVER+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});
  async function pic(p){const r=await post("/public/handbook/img",{path:p});if(!r.ok)throw new Error("");return URL.createObjectURL(await r.blob())}
  const slug=s=>"s-"+String(s).replace(/[^a-z0-9-]/gi,"");
  async function load(){const r=await post("/public/handbook");let j={};try{j=await r.json()}catch(e){}
    if(!r.ok)throw new Error(r.status===403?"The Family Handbook is not open to read here yet. Please contact the school.":(j.error||"The Family Handbook could not be opened. Try again in a moment."));return j}
  function render(h){document.getElementById("title").textContent=`${h.title||"Family Handbook"}, ${h.edition}`;document.title=`Fulton Family Handbook ${h.edition}`;
    const im=(src,alt)=>`<img data-img="${esc(src)}" alt="${esc(alt||"A picture from the Family Handbook")}">`;
    let out=`${h.image?`<img class="cover" data-img="${esc(h.image)}" alt="A child on a swing in a tree, the cover of the Family Handbook">`:""}<section class="card"><h2>Contents</h2><nav class="toc">${h.parts.map(p=>`<a href="#${slug(p.id)}">${esc(p.title)}</a>`).join("")}</nav></section>`;
    // each part folds closed under its title, so a phone shows the whole handbook in a few screens. Contents opens a part.
    for(const p of h.parts)out+=`<details class="card part" id="${slug(p.id)}"><summary><h2>${esc(p.title)}</h2></summary>${p.sections.map(s=>`${s.title!==p.title||p.sections.length>1?`<h3 id="${slug(s.id)}">${esc(s.title)}</h3>`:""}${window.PolicyMd.html(s.body,im)}`).join("")}</details>`;
    out+=`<p class="small muted">${esc(h.footer||"")}</p>`;
    const el=document.getElementById("out");el.className="";el.innerHTML=out;
    // a picture is fetched when its part first opens
    const show=root=>root.querySelectorAll("img[data-img]:not([src])").forEach(async i=>{try{i.src=await pic(i.dataset.img)}catch(e){i.remove()}});
    const cover=el.querySelector("img.cover");if(cover)show({querySelectorAll:()=>[cover]});
    el.querySelectorAll("details.part").forEach(d=>d.addEventListener("toggle",()=>{if(d.open)show(d)}));
    const go=()=>{const t=location.hash&&document.getElementById(location.hash.slice(1));const d=t&&(t.closest("details.part"));if(d){d.open=true;t.scrollIntoView()}};
    window.addEventListener("hashchange",go);go()}
  load().then(render).catch(e=>{document.getElementById("out").textContent=e.message});
})();
</script>
</body>
</html>

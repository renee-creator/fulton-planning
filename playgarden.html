<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Play Garden application</title>
<link rel="icon" href="tree-icons/favicon-32.png" type="image/png">
<style>
@font-face{font-family:Andika;src:url(fonts/Andika-Regular.ttf)}
@font-face{font-family:Andika;font-weight:700;src:url(fonts/Andika-Bold.ttf)}
:root{--bg:#fbf8f0;--paper:#fff;--ink:#1b2920;--muted:#46564c;--line:#d8dccf;--moss:#2b5a40;--moss-soft:#dce9de;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121814;--paper:#1d2620;--ink:#edf2ed;--muted:#aebdb3;--line:#3a4a41;--moss:#93ccaa;--moss-soft:#24382c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121814;--paper:#1d2620;--ink:#edf2ed;--muted:#aebdb3;--line:#3a4a41;--moss:#93ccaa;--moss-soft:#24382c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Andika,"Segoe UI",system-ui,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:0;color:var(--moss)}h2{font-size:21px;margin:0 0 8px;color:var(--moss)}h3{font-size:17px;margin:16px 0 4px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
.muted{color:var(--muted)}.small{font-size:14px}
a{color:var(--moss)}
.toc a{display:block;padding:6px 0;border-top:1px solid var(--line)}.toc a:first-child{border-top:0}
.pmd h4{font-size:16px;margin:14px 0 4px}.pmd h5{font-size:15px;margin:12px 0 4px}.pmd p{margin:6px 0}.pmd ul,.pmd ol{margin:6px 0;padding-left:22px}.pmd li{margin:3px 0}.pmd li.pmnest{list-style:none}
.pmd blockquote{margin:6px 0;padding-left:12px;border-left:3px solid var(--line)}.pmd img{max-width:100%;height:auto;display:block;margin:8px auto}
.pmd table{border-collapse:collapse;width:100%;font-size:14px}.pmd td,.pmd th{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}.pmd .tw{overflow-x:auto}
.cover{display:block;max-width:220px;margin:12px auto 0}
details.part>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}details.part>summary::-webkit-details-marker{display:none}
details.part>summary h2{margin:0}details.part>summary::after{content:"Open";font-size:14px;color:var(--moss);text-decoration:underline}details.part[open]>summary::after{content:"Close"}details.part[open]>summary{margin-bottom:8px}
label{display:grid;gap:4px;margin:10px 0;font-weight:600}input[type=text],input[type=email],input[type=tel],textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}.check input{margin-top:5px;width:22px;height:22px}
.btn{font:inherit;font-weight:700;background:var(--moss);color:#fff;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;min-height:44px}.err{color:#a3402b;min-height:1.2em}
</style>
</head>
<body>
<!-- Play Garden's public application. It shows only the application and our garden family agreements, and only while
     the director has it turned on. The questions come from the school's records through the server. -->
<main class="wrap" id="app"><div class="card"><p class="muted">Opening</p></div></main>
<script>
(function(){
  const qs=new URLSearchParams(location.search);const want=qs.get("server")||"";const local=/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(want);
  const SERVER=local?want:"https://fulton-planning.onrender.com";
  const post=(p,b)=>fetch(SERVER+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const $=s=>document.querySelector(s),app=$("#app");
  function agreementsHtml(a){if(!a)return "";const f=a.families||{};return `<div class="card"><h2>${esc(f.title||"Our garden agreements")}</h2>${f.intro?`<p>${esc(f.intro)}</p>`:""}
    ${(a.guiding||[]).length?`<p class="small muted">Our guiding agreements</p><ul>${a.guiding.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}<ul>${(f.items||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`}
  async function load(){let d;try{const r=await post("/public/playgarden",{});d=await r.json();if(!r.ok)throw new Error(d.error||"")}catch(e){app.innerHTML=`<div class="card"><p>The application could not open. Please try again later.</p></div>`;return}
    if(!d.open){app.innerHTML=`<div class="card"><span class="eyebrow">Fulton Community School</span><h1>Play Garden</h1><p>The Play Garden application is not open just now. Please check back soon.</p></div>`;return}
    app.innerHTML=`<div class="card"><span class="eyebrow">Fulton Community School</span><h1>${esc(d.title)}</h1>${d.lead?`<p>${esc(d.lead)}</p>`:""}</div>${agreementsHtml(d.agreements)}
      <form class="card" id="pgf"><h2>The application</h2>${d.questions.map(q=>q.agree?`<label class="check"><input type="checkbox" name="${esc(q.key)}"><span>${esc(q.label)}</span></label>`
        :`<label>${esc(q.label)}${q.optional?` <span class="small muted">(if you like)</span>`:""}${q.note?`<span class="small muted">${esc(q.note)}</span>`:""}${q.long?`<textarea name="${esc(q.key)}" rows="3"></textarea>`:`<input type="${/email/.test(q.key)?"email":/phone/.test(q.key)?"tel":"text"}" name="${esc(q.key)}">`}</label>`).join("")}
        <p class="err" id="err" aria-live="polite"></p><button class="btn">Send the application</button></form>`;
    $("#pgf").onsubmit=async e=>{e.preventDefault();const f=e.target,answers={};for(const q of d.questions){const el=f.elements[q.key];answers[q.key]=q.agree?!!(el&&el.checked):(el?el.value:"")}
      $("#err").textContent="";try{const r=await post("/public/playgarden/apply",{answers});const j=await r.json();if(!r.ok)throw new Error(j.error||"It did not send.");app.innerHTML=`<div class="card"><h1>Thank you</h1><p>Your application is with us, and we will be in touch about dates.</p></div>`}catch(er){$("#err").textContent=er.message}}}
  load();
})();
</script>
</body>
</html>

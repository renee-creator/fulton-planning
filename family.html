<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Fulton Community School Family Page</title>
<link rel="icon" href="tree-icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="tree-icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Family Page">
<style>
@font-face{font-family:Andika;src:url(fonts/Andika-Regular.ttf)}
@font-face{font-family:Andika;font-weight:700;src:url(fonts/Andika-Bold.ttf)}
:root{--bg:#edf0e8;--paper:#fff;--ink:#1b2920;--muted:#46564c;--line:#c6d0c3;--moss:#2b5a40;--moss-soft:#dce9de;--marigold:#9a5b07;--marigold-soft:#f9e9cc;--clay:#984331;--focus:#c47a06;--r:12px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121814;--paper:#1d2620;--ink:#edf2ed;--muted:#aebdb3;--line:#3a4a41;--moss:#93ccaa;--moss-soft:#24382c;--marigold:#f2b955;--marigold-soft:#3b2f18;--clay:#eba189;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121814;--paper:#1d2620;--ink:#edf2ed;--muted:#aebdb3;--line:#3a4a41;--moss:#93ccaa;--moss-soft:#24382c;--marigold:#f2b955;--marigold-soft:#3b2f18;--clay:#eba189;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Andika,"Segoe UI",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px}
header{padding:8px 0 14px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-size:28px;margin:2px 0 0;color:var(--moss)}
h2{font-size:19px;margin:0 0 8px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.muted{color:var(--muted)}.small{font-size:14px}
.btn{font:inherit;font-weight:700;border-radius:999px;padding:9px 16px;border:1px solid var(--moss);background:var(--moss);color:var(--paper);cursor:pointer}
.btn.ghost{background:none;color:var(--moss)}.btn:disabled{opacity:.55;cursor:default}
.btn.sm{padding:6px 12px;font-size:14px}
.link{font:inherit;background:none;border:0;color:var(--moss);text-decoration:underline;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--moss)}.nphotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}.nphotos figure{margin:0}.nphotos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}.news h3{font-size:17px}label{display:grid;gap:4px;font-size:14px;font-weight:700}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stack{display:grid;gap:12px}
.banner{background:var(--marigold-soft);border:1px solid var(--marigold);border-radius:var(--r);padding:10px 14px;margin:0 0 14px;font-size:14px}
.err{color:var(--clay);font-size:14px;min-height:1.2em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.agt{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}.agbox{min-height:36px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;font:inherit;font-weight:700;color:var(--moss);cursor:pointer}.agbox[aria-pressed="true"]{background:var(--moss-soft)}.agdoc h3{font-size:15px;margin:14px 0 6px}.agdoc .agstate{font-size:14px;line-height:1.5}.chkbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.packi{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:15px;font-weight:400}.packi input{margin-top:4px;width:auto;flex:none}
.aamph{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.aamimg{display:grid;gap:2px;justify-items:center}.aamimg img{width:96px;height:96px;object-fit:cover;border-radius:8px}.aamadd{align-self:center}
.miss input,.miss select,.miss textarea,input.miss,select.miss,textarea.miss{border-color:var(--clay)!important;background:#fdf1ee}
.kid{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}.kid:first-of-type{border-top:0;padding-top:0}
.kid .top{display:flex;justify-content:space-between;gap:10px}
.bar{height:10px;border-radius:999px;background:var(--moss-soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--moss)}
.item{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:0;padding-top:0}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--moss-soft);color:var(--moss)}
.tag.ev{background:var(--marigold-soft);color:var(--marigold)}
.entry{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}.entry:first-of-type{border-top:0}
.code{font-size:26px;font-weight:700;letter-spacing:.2em;color:var(--moss)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}.tabs button{font:inherit;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}.tabs button[aria-current]{background:var(--moss);border-color:var(--moss);color:var(--paper)}
.sub{padding:10px 0;border-top:1px solid var(--line)}.sub:first-of-type{border-top:0;padding-top:0}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}
textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.slotday{margin-top:8px}.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.slot{font:inherit;font-size:14px;border:1px solid var(--moss);background:var(--paper);color:var(--moss);border-radius:999px;padding:5px 12px;cursor:pointer}.slot.on{background:var(--moss);color:var(--paper)}
.step{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.step:first-of-type{border-top:0}.tick{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--paper)}.tick.on{background:var(--moss);border-color:var(--moss)}
.md h3{font-size:16px;margin:14px 0 4px;color:var(--moss)}.md p{margin:6px 0}.md ul{margin:6px 0;padding-left:20px}.md li{margin:3px 0}
details>summary{cursor:pointer;font-weight:700}.shared{margin-top:8px}.shared h3{font-size:15px;margin:10px 0 2px}
.mweek{display:grid;gap:8px}.mday{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px}.mday.today{border-color:var(--moss);background:var(--moss-soft)}.mday.closed{color:var(--muted)}.mday .k{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.esec{border-top:1px solid var(--line);padding:10px 0}.esec>summary{font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:8px}.grid .wide{grid-column:1/-1}
.chk{display:flex;gap:8px;align-items:center;font-weight:700;grid-column:1/-1}.chk input{width:auto}.ills{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:6px}.ill{font-weight:400}
.pmd h4{font-size:17px;margin:14px 0 4px;color:var(--moss)}.pmd h5{font-size:15px;margin:12px 0 4px}.pmd p{margin:6px 0}.pmd ul,.pmd ol{margin:6px 0;padding-left:22px}.pmd li{margin:3px 0}.pmd li.pmnest{list-style:none}.pmd blockquote{margin:6px 0;padding-left:12px;border-left:3px solid var(--line)}.pmd img{max-width:100%;height:auto;display:block;margin:8px auto}.pmd table{border-collapse:collapse;width:100%;font-size:14px}.pmd td,.pmd th{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}.pmd .tw{overflow-x:auto}
.hbpart{border-top:1px solid var(--line);padding:10px 0}.hbpart>summary{font-size:17px}.hbsec{margin:10px 0 0}.hbsec h3{font-size:16px;margin:12px 0 2px}
[hidden]{display:none!important}
/* computer, two columns of cards across a wider page. Forms and a single card stay one readable column */
@media (min-width:900px){.wrap{max-width:1100px}.cols{column-count:2;column-gap:16px}.cols>section{break-inside:avoid;-webkit-column-break-inside:avoid;display:inline-block;width:100%;vertical-align:top}.cols>.span{column-span:all;display:block}.one{max-width:720px;margin:0 auto}}
/* phone, the tabs slide sideways in one row and every button is easy to tap */
@media (max-width:699px){.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px 2px}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:none;min-height:44px}.btn,.slot{min-height:44px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="eyebrow">Fulton Community School</div><h1>Family page</h1></header>

<section class="card" id="gate" hidden>
  <form id="f1" class="stack">
    <p style="margin:0">Sign in with the email address the school has for you. We'll send you a six-digit code.</p>
    <label>Your email<input type="email" id="email" autocomplete="email" required></label>
    <div class="err" id="e1" aria-live="polite"></div>
    <div><button class="btn" id="b1">Send my code</button></div>
  </form>
  <form id="f2" class="stack" hidden>
    <p style="margin:0" id="sent">Check your email for a six-digit code.</p>
    <div id="testcode" hidden><div class="small muted">Test mode. No email is sent, so here is the code.</div><div class="code" id="tc"></div></div>
    <label>The code<input inputmode="numeric" autocomplete="one-time-code" id="code" maxlength="6" required></label>
    <div class="err" id="e2" aria-live="polite"></div>
    <div><button class="btn" id="b2">Sign in</button> <button type="button" class="link" id="again">Use a different email</button></div>
  </form>
</section>

<main id="main" hidden></main>
</div>
<script src="print-kit.js"></script>
<script src="enroll-rules.js"></script>
<script src="wording.js"></script>
<script src="agreement.js"></script>
<script src="policy-md.js"></script>
<script src="sitemap.js"></script>
<script src="community.js"></script>
<script>
(function(){
  const qs=new URLSearchParams(location.search);
  const DEFAULT_SERVER="https://fulton-planning.onrender.com";
  const want=(qs.get("server")||"").replace(/\/+$/,"");
  const local=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(want);
  const SERVER=local?want:DEFAULT_SERVER;
  const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
  let token=LS.get("fam-token"), D=null, logFor=null, signFor=null, strOpen=false, packOpen=null, jobFor=null, visitOpen=false;
  const $=s=>document.querySelector(s);
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  // the Family page's own words, which the director writes, with each family's names and numbers filled in
  const T=(k,v)=>String(((typeof D!=="undefined"&&D&&D.texts)||{})[k]||"").replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?String(v[n]):m);
  const Tp=(k,v,cls)=>T(k,v).split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).map(x=>`<p class="${cls||"small"}" style="margin:4px 0">${esc(x)}</p>`).join("");
  async function api(path,body){
    const r=await fetch(SERVER+path,{method:"POST",headers:Object.assign({"Content-Type":"application/json"},token?{Authorization:"Bearer "+token}:{}),body:JSON.stringify(body||{})});
    let j={};try{j=await r.json()}catch(e){}
    if(r.status===401&&path!=="/family/login"){token=null;LS.set("fam-token",null);showGate();throw new Error("")}
    if(!r.ok)throw new Error(j.error||"Something went wrong. Try again.");return j;
  }
  const day=d=>{if(!d)return"";const t=new Date(d+"T12:00:00");return t.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})};
  function clockTime(t){if(t==null||t==="")return "";let h,m;if(typeof t==="number"){h=Math.floor(t/60);m=t%60}else{const x=String(t).match(/(\d{1,2}):(\d{2})/);if(!x)return String(t);h=+x[1];m=+x[2]}
  // a time is a plain clock time, 1:15 pm or 9:00 am, the same on every page, print and reminder
  h=((h%24)+24)%24;return (h%12||12)+":"+String(m).padStart(2,"0")+(h<12?" am":" pm")}
  const time=t=>t?clockTime(t):"";
  const hrs=n=>n+" hour"+(n==1?"":"s");
  const many=(n,w)=>n+" "+w+(n==1?"":(w==="child"?"ren":"s"));
  const whoLine=(m,counts)=>[m.who,counts?many(m.adults||0,"adult")+", "+many(m.children||0,"child"):""].filter(Boolean).join(" · ");
  // a short sign-up form, filled in with what the family gave before
  const signForm=it=>{const m=it.my||{};return `<div class="stack" style="margin-top:8px">
    <label>${it.type==="wish"?"Who is bringing it":"Who is coming"}<input type="text" id="sw" maxlength="120" value="${esc(m.who||D.me||"")}" placeholder="Ex. Maya and Sam"></label>
    ${it.counts?`<div class="row2"><label>Adults<input type="number" id="sa" min="1" max="30" value="${esc(m.adults||1)}"></label><label>Children<input type="number" id="sc" min="0" max="30" value="${esc(m.children!=null?m.children:(D.kidCount||1))}"></label></div>`:""}
    ${it.question?`<label>${esc(it.question)}<input type="text" id="sq" maxlength="300" value="${esc(m.answer||"")}"></label>`:""}
    <div class="small err" id="es"></div>
    <div><button class="btn sm" data-signsave="${esc(it.id)}">${it.mine?"Save":"Sign up"}</button> <button class="link" data-signcancel="1">Cancel</button></div></div>`};
  const today=()=>{const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")};

  function showGate(){$("#main").hidden=true;$("#gate").hidden=false;$("#f1").hidden=false;$("#f2").hidden=true;$("#email").value=LS.get("fam-email")||""}
  $("#f1").onsubmit=async e=>{e.preventDefault();const b=$("#b1");b.disabled=true;$("#e1").textContent="";
    try{const em=$("#email").value.trim();const j=await api("/family/code",{email:em});LS.set("fam-email",em);
      $("#f1").hidden=true;$("#f2").hidden=false;$("#testcode").hidden=!j.code;$("#tc").textContent=j.code||"";$("#sent").textContent=j.code?"Type the code below to sign in.":"If that email is on file, a six-digit code is on its way. It works for 15 minutes.";$("#code").focus()}
    catch(er){$("#e1").textContent=er.message}finally{b.disabled=false}};
  $("#f2").onsubmit=async e=>{e.preventDefault();const b=$("#b2");b.disabled=true;$("#e2").textContent="";
    try{const j=await api("/family/login",{email:LS.get("fam-email"),code:$("#code").value.trim()});token=j.token;LS.set("fam-token",token);$("#code").value="";await load()}
    catch(er){$("#e2").textContent=er.message}finally{b.disabled=false}};
  document.addEventListener("toggle",e=>{if(e.target.classList&&e.target.classList.contains("letter")&&!e.target.open)LS.set("fam-letter","1")},true);
  $("#again").onclick=()=>{$("#f1").hidden=false;$("#f2").hidden=true};

  async function load(){const j=await api("/family/data");D=j;$("#gate").hidden=true;$("#main").hidden=false;render()}
  let tab=LS.get("fam-tab")||"", form=null, openRefl="";
  const md=t=>{const lines=String(t||"").split("\n");let out="",list=false;const inl=s=>esc(s).replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,(m,a,u)=>`<a href="${u}" target="_blank" rel="noopener">${a}</a>`).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
    for(const l of lines){if(/^\s*-\s+/.test(l)){if(!list){out+="<ul>";list=true}out+="<li>"+inl(l.replace(/^\s*-\s+/,""))+"</li>";continue}if(list){out+="</ul>";list=false}
      if(/^###\s+/.test(l))out+="<h3>"+inl(l.replace(/^###\s+/,""))+"</h3>";else if(l.trim())out+="<p>"+inl(l)+"</p>"}if(list)out+="</ul>";return out};
  function kidPick(id){const ks=D.children;if(ks.length===1)return `<input type="hidden" id="${id}" value="${esc(ks[0].id)}">`;
    return `<label>Which child it counts for<select id="${id}">${ks.map(k=>`<option value="${esc(k.id)}">${esc(k.first)}</option>`).join("")}</select></label>`}
  /* six tabs, each with one job. Welcome is for every family, with a new family's first steps below. Learning holds the
     pieces for families, Ideas to try at home and the places to visit. Our school holds the garden and our site, the map last */
  const hasLearn=()=>!!((D.pieces||[]).length||(D.learning||[]).length||D.ideasOn||(D.community&&D.community.places));
  const hasSchool=()=>{const G=D.gardenInfo||{};return !!((G.agreements||(G.guide||[]).length)||G.season||(G.recipes||[]).length||(G.seedLibrary||[]).length||(D.community&&D.community.plants)||D.siteMap)};
  const tabs=()=>{const t=[["welcome","Welcome"],["kids",D.children.length>1?"Our children":D.children[0].first],["part","Taking part"]];if(hasLearn())t.push(["learn","Learning"]);t.push(["food",(D.menu.news||[]).length?"News, menu and calendar":"Menu and calendar"]);if(hasSchool())t.push(["school","Our school"]);return t};
  // the museums and the plants on our site, drawn by community.js, the same as the public page
  const cmState=window.TREE_COMMUNITY?window.TREE_COMMUNITY.state():null;let cmBound=false;
  function placesHtml(part){const C=window.TREE_COMMUNITY;if(!C||!D.community||!D.community[part])return "";if(!document.getElementById("cm-css")){const st=document.createElement("style");st.id="cm-css";st.textContent=C.CSS;document.head.appendChild(st)}
    if(!cmBound){cmBound=true;C.bind($("#main"),cmState,()=>{if(tab==="learn"||tab==="school")render()})}return C.html({[part]:D.community[part]},cmState,SERVER)}
  /* Ideas to try at home. The home side of every Idea bank card, by group and by search, with the director's highlights
     first under Happening at school now. Only the home side reaches this page. Each prints as one page, PDF or Word. */
  const ID_GROUPS=["Paint","Drawing","Color and print","Shaping","Building","Paper and joining","Textiles","Elements and mixing","Light and looking","Sound and movement","Story and play","Living things","Movement and risky play","Indoor spaces","Shared spaces","Outdoor spaces","Children's interests","Across the year on our site"];
  let IDEAS=null,ideaSel="",ideaQ="",ideaBusy=false;
  async function ideasLoad(){if(IDEAS||ideaBusy)return;ideaBusy=true;try{IDEAS=await api("/family/ideas")}catch(e){IDEAS={cards:[],highlights:[],error:e.message}}ideaBusy=false;if(tab==="learn")render()}
  const ideaCard=id=>((IDEAS&&IDEAS.cards)||[]).find(c=>c.id===id);
  function ideaSecHtml(x){return `<h3>${esc(x.h)}</h3>${x.style==="text"?`<p>${esc(x.text)}</p>`:x.style==="lines"?(x.items||[]).map(t=>`<p style="margin:2px 0">${esc(t)}</p>`).join(""):`<${x.style==="numbered"?"ol":"ul"}>${(x.items||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</${x.style==="numbered"?"ol":"ul"}>`}`}
  function ideasHtml(){if(!IDEAS){ideasLoad();return `<section class="card"><p class="muted">Opening the ideas.</p></section>`}
    const all=IDEAS.cards||[],q=ideaQ.trim().toLowerCase(),c=ideaCard(ideaSel);
    const hay=x=>(x.title+" "+x.group+" "+x.sections.map(s=>s.h+" "+(s.text||"")+" "+(s.items||[]).join(" ")).join(" ")).toLowerCase();
    const shown=q?all.filter(x=>q.split(/\s+/).every(w=>hay(x).includes(w))):all;const hi=(IDEAS.highlights||[]).map(ideaCard).filter(Boolean);
    const btn=x=>`<button class="link" data-idea="${esc(x.id)}" style="display:block;margin:4px 0;text-align:left">${esc(x.title)}</button>`;
    if(c)return `<section class="card"><button class="link" data-idea="">Back to all the ideas</button><h2 style="margin-top:8px">${esc(c.title)}</h2>${c.sections.map(ideaSecHtml).join("")}
      <p><button class="btn sm" data-ideaprint="pdf">Print this page</button> <button class="link" data-ideaprint="word">Word</button></p></section>`;
    return `<section class="card"><h2>Ideas to try at home</h2><p>Simple ways to keep exploring with your child, using things you already have. Browse anything you like. The ideas under Happening at school now are what we are exploring at school right now.</p>
      ${hi.length?`<h3>Happening at school now</h3>${hi.map(btn).join("")}`:""}
      <label class="small" for="ideaq">Search ideas</label><input type="search" id="ideaq" value="${esc(ideaQ)}" placeholder="playdough, rain, bugs">
      ${q?`<p class="small muted">${shown.length} ${shown.length===1?"idea":"ideas"}</p>${shown.map(btn).join("")}`
        :ID_GROUPS.filter(g=>all.some(x=>x.group===g)).map(g=>`<details><summary><b>${esc(g)}</b> <span class="small muted">${all.filter(x=>x.group===g).length}</span></summary>${all.filter(x=>x.group===g).map(btn).join("")}</details>`).join("")}
      ${IDEAS.error?`<p class="small muted">${esc(IDEAS.error)}</p>`:""}</section>`}
  // one page, the school's name, the title and each part, set as large as the page allows, then a preview before saving
  async function ideaPdf(c){const K=window.TREE_KIT;await K.loadScript(K.LIB.jspdf,"jspdf");await K.fonts();const W=612,H=792,M=50,TW=W-2*M;
    const lay=fs=>{const d=K.pdf({format:"letter"});const ops=[];let y=0;const line=(t,size,bold,gap)=>{d.setFont(bold?"pfB":"pfR","normal");d.setFontSize(size);for(const l of d.splitTextToSize(String(t),TW)){ops.push([l,size,bold,y]);y+=size*1.3}y+=gap||0};
      line("Fulton Community School",fs*.75,false,6);line(c.title,fs*1.8,true,fs*.6);
      for(const x of c.sections){line(x.h.toUpperCase(),fs*.72,true,2);if(x.style==="text")line(x.text,fs,false,fs*.6);else{(x.items||[]).forEach((t,i)=>line((x.style==="numbered"?(i+1)+". ":x.style==="lines"?"":"• ")+t,fs,false,2));y+=fs*.5}}
      return {d,ops,h:y}};
    let L=null;for(let fs=14;fs>=8;fs-=.5){L=lay(fs);if(L.h<=H-2*M)break}
    const top=Math.max(M,(H-L.h)/2);for(const [t,size,bold,y] of L.ops){L.d.setFont(bold?"pfB":"pfR","normal");L.d.setFontSize(size);L.d.text(t,M,top+y+size,{baseline:"alphabetic"})}
    return L.d.output("blob")}

  // the book's words are read from the page before any save, and photos go up made smaller first
  function aamText(k){document.querySelectorAll("[data-aamt]").forEach(t=>{k.aboutMe.pages[+t.dataset.aamt].text=t.value});document.querySelectorAll("[data-aamtitle]").forEach(t=>{k.aboutMe.pages[+t.dataset.aamtitle].title=t.value})}
  async function aamSave(k,done){D=await api("/family/aboutme",{childId:k.id,done,pages:k.aboutMe.pages.map(p=>({title:p.title,text:p.text,photos:p.photos.map(x=>x.id)}))})}
  async function shrink(file){const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)});const m=1800,sc=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.86).split(",")[1]}
  document.addEventListener("input",e=>{if(e.target.id!=="agi")return;const v=e.target.value.trim().toUpperCase();document.querySelectorAll('[data-agt][aria-pressed="true"]').forEach(x=>x.textContent=v)});
  document.addEventListener("change",async e=>{const t=e.target;if(!t.dataset||!t.dataset.pack)return;const [id,key]=t.dataset.pack.split("|");try{D=await api("/family/check",{childId:id,key,on:t.checked});render()}catch(er){t.checked=!t.checked}});
  document.addEventListener("change",async e=>{const t=e.target;if(!t.dataset||t.dataset.aamadd==null||!t.files||!t.files[0])return;const i=+t.dataset.aamadd;const k=D.children.find(x=>x.id===form.split("|")[1]);if(!k)return;
    const lab=t.closest("label");if(lab)lab.firstChild.textContent="Adding";try{aamText(k);const j=await api("/family/photo",{childId:k.id,data:await shrink(t.files[0])});k.aboutMe.pages[i].photos.push({id:j.id,src:j.src});await aamSave(k,false);render()}catch(er){$("#ea").textContent=er.message||"That photo could not be added."}});
  const readEnroll=()=>{const o={};document.querySelectorAll("[data-ef]").forEach(x=>{o[x.dataset.ef]=x.type==="checkbox"?x.checked:x.value});return o};
  function enrollStatus(){const sp=document.querySelectorAll("[data-estat]");if(!sp.length||!window.enrollMissing)return;const miss=new Set(window.enrollMissing(readEnroll(),D.enrollForm).map(f=>f.k));
    sp.forEach(x=>{const sec=D.enrollForm[+x.dataset.estat];const n=sec.fields.filter(f=>miss.has(f.k)).length;x.textContent=n?`, ${n} to complete`:", complete";x.style.color=n?"var(--marigold)":"var(--moss)"})}
  let eTimer=null;document.addEventListener("input",e=>{if(e.target.dataset&&e.target.dataset.ef)enrollStatus()});document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.ef)enrollStatus()});document.addEventListener("input",e=>{if(!form||!form.startsWith("enroll")||!e.target.dataset.ef)return;clearTimeout(eTimer);const id=form.split("|")[1];eTimer=setTimeout(()=>api("/family/enroll",{childId:id,data:readEnroll(),done:false}).then(j=>{D=j}).catch(()=>{}),1200)});
  // posting a gathering, taking it down, the contact list and leaving it
  document.addEventListener("click",async e=>{const b=e.target.closest("[data-gnew],[data-gcancel],[data-gedit],[data-gdel],[data-contacts],[data-contactout]");if(!b||!D)return;e.preventDefault();const d=b.dataset;
    try{if(d.gnew){gForm={};render();const t=$("#gt");if(t)t.focus()}
      else if(d.gcancel){gForm=null;render()}
      else if(d.gedit){const it=D.open.find(x=>x.id===d.gedit);if(it){gForm=Object.assign({},it);render();const f=$("#gform");if(f)f.scrollIntoView({block:"center"})}}
      else if(d.gdel){if(!confirm("Take this gathering down? Families will no longer see it."))return;D=await api("/family/ungather",{id:d.gdel});render()}
      else if(d.contactout){D=await api("/family/contactpref",{out:d.contactout==="1"});render()}
      else if(d.contacts){b.disabled=true;const L=await api("/family/contacts",{});ideaPreview(await contactsPdf(L),"Family Contact List.pdf");b.disabled=false}}
    catch(er){b.disabled=false;alert(er.message||"That did not work. Check the connection and try again.")}});
  document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b||!D)return;const d=b.dataset;
    try{
      if(d.signup){signFor=d.signup;render();const w=$("#sw");if(w)w.focus()}
      else if(d.signcancel){signFor=null;render()}
      else if(d.signsave){try{D=await api("/family/signup",{itemId:d.signsave,on:true,who:$("#sw").value,adults:$("#sa")?$("#sa").value:0,children:$("#sc")?$("#sc").value:0,answer:$("#sq")?$("#sq").value:""});signFor=null;render()}catch(er){$("#es").textContent=er.message}}
      else if(d.signoff){D=await api("/family/signup",{itemId:d.signoff,on:false});render()}
      else if(d.logit){logFor=logFor===d.logit?null:d.logit;render()}
      else if(d.logcancel){logFor=null;render()}
      else if(d.jobdid){jobFor=jobFor===d.jobdid?null:d.jobdid;render()}
      else if(d.jobcancel){jobFor=null;render()}
      else if(d.jobsave){const id=d.jobsave;try{D=await api("/family/log",{jobId:id,childId:$("#jk-"+id).value,date:$("#jd-"+id).value,minutes:Math.round((Number($("#jh-"+id).value)||0)*60)});jobFor=null;render()}catch(er){const x=$("#je-"+id);if(x)x.textContent=er.message}}
      else if(d.logsave){const id=d.logsave;D=await api("/family/log",{itemId:id,childId:$("#lk-"+id).value,minutes:Math.round((Number($("#lh-"+id).value)||0)*60)});logFor=null;render()}
      else if(d.unlog){D=await api("/family/unlog",{id:d.unlog});render()}
      else if(d.tab){tab=d.tab;LS.set("fam-tab",tab);render();window.scrollTo(0,0)}
      else if(d.book){const on=!b.classList.contains("on");D=await api("/family/book",{slotId:d.book,childId:d.kid,on});render()}
      else if(d.refl){openRefl=openRefl===d.refl?"":d.refl;render()}
      else if(d.reflsave){const ans={};document.querySelectorAll("[data-rq]").forEach(x=>ans[x.dataset.rq]=x.value);D=await api("/family/reflect",{childId:d.reflsave,answers:ans});openRefl="";render()}
      else if(d.form){form=d.form;render();window.scrollTo(0,0)}
      else if(d.formclose){form=null;render();window.scrollTo(0,0)}
      else if(d.qsave){const a=[...document.querySelectorAll("[data-qa]")].map(x=>x.value);try{D=await api("/family/questionnaire",{childId:d.qsave,answers:a});form=null;render();window.scrollTo(0,0)}catch(er){$("#eq").textContent=er.message}}
      else if(d.esave&&d.esave.endsWith("|done")&&window.enrollMissing){const miss=window.enrollMissing(readEnroll(),D.enrollForm);document.querySelectorAll(".miss").forEach(x=>x.classList.remove("miss"));
        if(miss.length){miss.forEach(f=>{const el=document.querySelector(`[data-ef="${f.k}"]`);if(el){el.classList.add("miss");const dt=el.closest("details");if(dt)dt.open=true}});$("#ee").textContent=`${miss.length} box${miss.length===1?" is":"es are"} still empty, marked in red. Write None when something does not apply.`;const first=document.querySelector(".miss");if(first)first.scrollIntoView({block:"center"});return}
        const [id]=d.esave.split("|");clearTimeout(eTimer);try{D=await api("/family/enroll",{childId:id,data:readEnroll(),done:true});form=null;render();window.scrollTo(0,0)}catch(er){$("#ee").textContent=er.message}}
      else if(d.eview){const w=window.open("","_blank");try{if(!window.fillEnrollForms)await new Promise((ok,no)=>{const sc=document.createElement("script");sc.src="enroll-forms.js";sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
          const kk=D.children.find(x=>x.id===d.eview)||{};const bytes=await window.fillEnrollForms(readEnroll(),{agreementWords:D.agreementWords||null,agreement:kk.agreement||null,aa:D.aa||{},email:D.email||"",schedule:kk.schedule||"",classroom:kk.classroom||""});const url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));if(w)w.location=url;else location.href=url}catch(er){if(w)w.close();$("#ee").textContent="The forms could not be shown just now."}}
      else if(d.agt!=null&&!d.agsave){const ini=($("#agi").value||"").trim();if(!ini){$("#eg").textContent="Type your initials first.";$("#agi").focus();return}const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on?"true":"false");b.textContent=on?ini.toUpperCase():"";$("#eg").textContent=""}
      else if(d.agsave){const [cid,sub]=d.agsave.split("|");const ag=readAgree();if(sub){const miss=window.FultonAgreement.missing(ag);if(miss.length){$("#eg").textContent="Please complete "+miss.slice(0,5).join(", ")+(miss.length>5?", and "+(miss.length-5)+" more":"")+".";return}}
        try{D=await api("/family/agree",{childId:cid,agreement:ag,submit:!!sub});if(!sub){render();$("#eg").textContent="Saved. The agreement is not signed yet.";return}form=null;render();window.scrollTo(0,0)}catch(er){$("#eg").textContent=er.message}}
      else if(d.readok){D=await api("/family/check",{childId:d.readok,key:"notices",on:true});form=null;render();window.scrollTo(0,0)}
      else if(d.hbackall){for(const k of hbNew())D=await api("/family/check",{childId:k.id,key:"handbook",on:true});render()}
      else if(d.chk){const [id,key]=d.chk.split("|");const k=D.children.find(x=>x.id===id);D=await api("/family/check",{childId:id,key,on:key==="handbook"&&k?!hbRead(k):!(k&&k.checks&&k.checks[key])});render()}
      else if(d.hbread!=null){form="hb|"+d.hbread;render();window.scrollTo(0,0)}
      else if(d.packopen){packOpen=packOpen===d.packopen?null:d.packopen;render()}
      else if(d.aamnew){const k=D.children.find(x=>x.id===d.aamnew);if(k){aamText(k);k.aboutMe.pages.push({title:"",custom:true,text:"",photos:[]});render();const ts=document.querySelectorAll("[data-aamtitle]");if(ts.length)ts[ts.length-1].focus()}}
      else if(d.aamdel){const [id,i]=d.aamdel.split("|");const k=D.children.find(x=>x.id===id);if(k){aamText(k);k.aboutMe.pages.splice(+i,1);await aamSave(k,false);render()}}
      else if(d.aamrm){const [i,j]=d.aamrm.split("|").map(Number);const k=D.children.find(x=>x.id===form.split("|")[1]);if(k){aamText(k);k.aboutMe.pages[i].photos.splice(j,1);await aamSave(k,false);render()}}
      else if(d.aamsave){const [id,done]=d.aamsave.split("|");const k=D.children.find(x=>x.id===id);if(k){aamText(k);try{await aamSave(k,!!done);if(done){form=null;window.scrollTo(0,0)}render()}catch(er){$("#ea").textContent=er.message}}}
      else if(d.esave){const [id,done]=d.esave.split("|");clearTimeout(eTimer);try{D=await api("/family/enroll",{childId:id,data:readEnroll(),done:!!done});form=null;render();window.scrollTo(0,0)}catch(er){$("#ee").textContent=er.message}}
      else if(d.file){const w=window.open("","_blank");const j=await api("/family/file",{id:d.file});if(w)w.location=SERVER+j.path;else location.href=SERVER+j.path}
    }catch(er){if(er.message)alert(er.message);b.disabled=false}});
  if(token)load().catch(er=>{showGate();if(er.message)$("#e1").textContent=er.message});else showGate();
})();
</script>
</body>

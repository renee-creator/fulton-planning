<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5a43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planning">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Fulton Planning Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout. A garden-shed clipboard. Sidebar of the week's plans, a working form on the right, paper-like field cards. */
:root{
  --bg:#f3f5ef; --paper:#fffffb; --ink:#22332a; --muted:#5d6e63; --line:#d5ddd2;
  --moss:#2f5a43; --moss-soft:#e3ece4; --marigold:#c47a06; --marigold-soft:#fbefd8;
  --clay:#a24f35; --clay-soft:#f6e3dc; --sky:#2f6a86; --sky-soft:#e0edf3;
  --focus:#c47a06;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a16; --paper:#1c241f; --ink:#e6ece6; --muted:#9fb0a5; --line:#33413a;
  --moss:#8cc4a2; --moss-soft:#24352b; --marigold:#f0b44a; --marigold-soft:#3a2e17;
  --clay:#e59a80; --clay-soft:#3b2620; --sky:#86c1dc; --sky-soft:#1d3039; --focus:#f0b44a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a16; --paper:#1c241f; --ink:#e6ece6; --muted:#9fb0a5; --line:#33413a;
  --moss:#8cc4a2; --moss-soft:#24352b; --marigold:#f0b44a; --marigold-soft:#3a2e17;
  --clay:#e59a80; --clay-soft:#3b2620; --sky:#86c1dc; --sky-soft:#1d3039; --focus:#f0b44a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:14px 60px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:6px 16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{display:flex;flex-direction:column;gap:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{font-size:26px;font-weight:700;color:var(--moss);line-height:1.1}
.top .spacer{flex:1}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who label{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
@media (max-width:900px){.side{position:static}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:600;margin-bottom:10px}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav .wk{flex:1;text-align:center;font-family:var(--display);font-weight:500;font-size:16px}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:8px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{background:var(--moss-soft)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:var(--paper)}
.newbtns{display:grid;gap:8px}
.newbtn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;cursor:pointer}
.newbtn:hover{border-color:var(--moss)}
.newbtn b{font-weight:600}
.newbtn span{font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:4px}
.group-h{font-size:12px;color:var(--muted);font-weight:600;margin-top:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid transparent;background:transparent;text-align:left;border-radius:8px;padding:7px 8px;cursor:pointer;width:100%}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--moss-soft);border-color:var(--line)}
.item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 6px}
.tag.classroom{background:var(--moss-soft);color:var(--moss)}
.tag.individual{background:var(--sky-soft);color:var(--sky)}
.tag.smallgroup{background:var(--marigold-soft);color:var(--marigold)}
.status{font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.status.ready{border-color:var(--marigold);color:var(--marigold)}
.status.reviewed{border-color:var(--moss);color:var(--moss)}
.empty{color:var(--muted);font-size:13.5px;padding:6px 2px}
.linkbtn{background:none;border:none;padding:0;color:var(--moss);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13.5px}
.btn{border:1px solid var(--moss);background:var(--moss);color:var(--paper);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--moss)}
.btn.warn{background:transparent;color:var(--clay);border-color:var(--clay)}
.btn:disabled{opacity:.5;cursor:default}
.btn.small{padding:5px 10px;font-size:13px}
input[type=text],input[type=date],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
textarea{resize:vertical;line-height:1.55;min-height:84px}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.head{display:flex;flex-direction:column;gap:12px}
.head-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between}
.head h2{font-size:30px;font-weight:700;line-height:1.1}
.head .sub{color:var(--muted);font-size:14px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.meta label,.fld-label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:transparent;padding:6px 12px;cursor:pointer;font-size:13.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--moss);color:var(--paper)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.savestate{font-size:12.5px;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .lbl{font-family:var(--display);font-weight:500;font-size:18px}
.card .hint{color:var(--muted);font-size:13.5px;max-width:72ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--line);background:var(--bg);border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--moss);border-style:solid}
.chip.on{background:var(--moss-soft);border-style:solid;border-color:var(--moss);color:var(--moss)}
.chiprow-label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.cardfoot{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.nudge{font-size:13px;color:var(--clay);background:var(--clay-soft);border-radius:6px;padding:3px 9px}
.nudge.ok{color:var(--moss);background:var(--moss-soft)}
.ex{font-size:13.5px;border-left:3px solid var(--moss);background:var(--bg);padding:8px 12px;border-radius:0 6px 6px 0;display:grid;gap:4px}
.ex .weak{color:var(--clay)}
.ex b{font-weight:600}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.two{grid-template-columns:minmax(0,1fr)}}
.ai{background:var(--marigold-soft);border:1px solid color-mix(in srgb,var(--marigold) 40%,transparent);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ai .lbl{font-family:var(--display);font-weight:500;font-size:18px}
.ai p{margin:0;font-size:13.5px;color:var(--muted)}
.ref{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--sky-soft);font-size:14px;display:grid;gap:4px}
.ref b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sky)}
.webwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px}
@media (max-width:1100px){.webwrap{grid-template-columns:minmax(0,1fr)}}
.branch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)}
.branch textarea{min-height:52px}
.svgbox{border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow-x:auto}
.svgbox svg{display:block;width:100%;min-width:420px;height:auto}
.conn{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.conn select{width:auto;flex:1;min-width:120px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;background:var(--clay-soft);border-radius:8px;padding:6px 10px;font-size:13.5px;flex-wrap:wrap}
.welcome{display:grid;gap:14px}
.welcome .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.welcome .step{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.welcome .step h3{font-size:17px;margin-bottom:4px}
.welcome .step p{margin:0;color:var(--muted);font-size:14px}
.review{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.muted{color:var(--muted)}

.nav{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--paper)}
.nav button{border:none;background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.nav button[aria-pressed="true"]{background:var(--moss);color:var(--paper)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:700;color:var(--moss);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.main section,.main>div{min-width:0}
.tablewrap{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table.grid2{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
.grid2 th,.grid2 td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.grid2 th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.grid2 tr:last-child td{border-bottom:none}
.cellbtn{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border:none;background:transparent;padding:2px;cursor:pointer;text-align:left}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);display:inline-block}
.dot.draft{border-color:var(--muted);background:transparent}
.dot.ready{border-color:var(--marigold);background:var(--marigold)}
.dot.reviewed{border-color:var(--moss);background:var(--moss)}
.cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.thread{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;min-width:0}
.thread h3{font-size:19px;font-weight:500}
.thread .q{font-size:15px;color:var(--ink)}
.tl{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.tl i{width:12px;height:12px;border-radius:3px;background:var(--bg);border:1px solid var(--line);display:inline-block}
.tl i.on{background:var(--moss);border-color:var(--moss)}
.evid{font-size:13.5px;display:grid;gap:8px;border-left:3px solid var(--line);padding-left:10px}
.evid .src{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.evid .src button{font-size:12px}
.origin{display:grid;gap:3px;font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px}
.origin b{font-weight:600;margin-right:4px}
.stopped{display:grid;gap:10px;margin-top:8px}
.stopped .thread{background:transparent}
.st-emerging{border-color:var(--sky);color:var(--sky)}
.st-growing{border-color:var(--marigold);color:var(--marigold)}
.st-deepening{border-color:var(--moss);color:var(--moss)}
.st-resting,.st-closed{border-color:var(--line);color:var(--muted)}
.threads{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px}
.terms{display:flex;flex-wrap:wrap;gap:6px}
.term{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.term small{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.result{display:grid;gap:2px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:9px 12px;text-align:left;cursor:pointer;width:100%}
.result:hover{border-color:var(--moss)}
.result mark{background:var(--marigold-soft);color:inherit;border-radius:2px}
.secthead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between}
.secthead h2{font-size:22px;font-weight:500}
.story{display:grid;gap:8px}
.drop{border:2px dashed var(--line);border-radius:var(--r);background:var(--paper);padding:22px 16px;display:grid;gap:8px;justify-items:center;text-align:center}
.drop.over{border-color:var(--moss);background:var(--moss-soft)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumb{position:relative;width:120px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:6px;display:grid;gap:4px;font-size:12px}
.thumb img{width:100%;height:120px;object-fit:cover;border-radius:4px;background:var(--bg)}
.thumb .doc{height:120px;display:grid;place-items:center;background:var(--bg);border-radius:4px;color:var(--muted);font-weight:600}
.thumb button{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer}
.thumb button.thumbact{position:static;width:auto;height:auto;border-radius:6px;padding:5px 6px;font-size:12px;font-weight:600;color:var(--ink)}
.sugg{border:1px solid color-mix(in srgb,var(--marigold) 45%,transparent);background:var(--marigold-soft);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.sugg b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--marigold)}
.sugg .err{color:var(--clay)}
.due{display:grid;gap:4px}
.due .item{grid-template-columns:minmax(0,1fr) auto}
.roster{display:grid;gap:6px}
.rname{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px;background:var(--bg)}
.rname button{border:none;background:transparent;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 4px}
.radio{display:flex;gap:8px;align-items:flex-start;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="eyebrow">Fulton Community School &amp; Farm</span><h1>Planning Studio</h1></div>
    <div class="nav" role="group" aria-label="View"><button data-view="plans">Plans</button><button data-view="all">All plans</button><button data-view="threads">Threads and overview</button></div>
    <div class="spacer"></div>
    <div class="who">
      <label for="me">Educator</label>
      <input id="me" type="text" list="educators" placeholder="Your name" style="width:170px">
      <span class="savestate" id="conn">Connecting</span>
    </div>
  </header>

  <div class="grid">
    <aside class="side">
      <section class="panel">
        <h3>Week of</h3>
        <div class="weeknav">
          <button class="iconbtn" id="prevwk" aria-label="Previous week">&#8249;</button>
          <div class="wk" id="wklabel"></div>
          <button class="iconbtn" id="nextwk" aria-label="Next week">&#8250;</button>
        </div>
        <div class="filters" id="filters"></div>
      </section>
      <section class="panel">
        <h3>Start a plan</h3>
        <div class="newbtns">
          <button class="newbtn" data-new="classroom"><b>Classroom Curriculum Plan</b><span>Together as a team, weekly, with the curriculum web</span></button>
          <button class="newbtn" data-new="individual"><b>Individual Curriculum Plan</b><span>Your small group or an area of the classroom</span></button>
          <button class="newbtn" id="importbtn" style="border-style:dashed"><b>Upload a plan or photo</b><span>Transcribe a paper, PDF, or Word plan into the app</span></button>
        </div>
      </section>
      <section class="panel" id="duepanel" hidden>
        <h3 style="color:var(--clay)">Final remarks due</h3>
        <div class="due" id="due"></div>
      </section>
      <section class="panel">
        <h3>This week's plans</h3>
        <div class="list" id="list"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
          <button class="btn small ghost" id="packet">Week packet PDF</button>
          <button class="btn small ghost" id="packetw">Week packet Word</button>
          <button class="btn small ghost" id="blanks">Blank forms PDF</button>
          <button class="btn small ghost" id="blanksw">Blank forms Word</button>
        </div>
      </section>
      <section class="panel">
        <h3>Program</h3>
        <button class="btn small ghost" data-view="settings">Program settings</button>
        <div class="cnt" style="margin-top:6px">Small groups, educators, spaces, materials, and seasonal concepts</div>
      </section>
    </aside>
    <main class="main" id="main"></main>
  </div>
</div>
<datalist id="educators"></datalist><datalist id="placelist"></datalist>
<div class="toast" id="toast" hidden></div>

<style>
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px}
#gate .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:28px 24px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
#gate h1{font-family:var(--display);font-size:1.7rem;color:var(--moss)}
#gate input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;font-size:1rem;width:100%}
#gate .msg{font-size:.9rem;min-height:1.2em;color:var(--muted)}
#gate .msg.bad{color:var(--clay)}
.who-chip{font-size:.85rem;color:var(--muted);display:flex;gap:8px;align-items:center}
</style>
<div id="gate" hidden>
  <form class="card" id="gate-form" autocomplete="off">

<script>
"use strict";
/* Connects Planning Studio to its server on Render.
   Plans live in a private GitHub repository behind that server. */
(function(){
  const qs=new URLSearchParams(location.search);
  // only the school's own server, or a local test server when the page itself is opened locally
  const DEFAULT_SERVER="https://fulton-planning.onrender.com";
  const want=(qs.get("server")||"").replace(/\/+$/,"");
  const local=/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(want);
  const SERVER= local? want : DEFAULT_SERVER;
  const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
  const Auth={token:LS.get("fp-token"), name:LS.get("fp-name"), director:LS.get("fp-director")==="1"};
  const Store={data:{plans:{},threads:{},scans:{},settings:{}}, rev:0, bootId:"", listeners:new Set(), ready:null, fileKey:"", wroteAt:{}};
  window.FP_HOSTED=true;
  window.FP_NAME=()=>Auth.name||"";
  window.FP_DIRECTOR=()=>!!Auth.director;

  function gateMsg(t,bad){ const m=document.getElementById("gate-msg"); if(m){ m.textContent=t||""; m.className="msg "+(bad?"bad":"muted"); } }
  function signOut(){ Auth.token=null; Auth.name=null; LS.set("fp-token",null); LS.set("fp-name",null); LS.set("fp-director",null); location.reload(); }
  window.FP_SIGN_OUT=signOut;

  async function api(path, body, signal){
    let r;
    const payload=JSON.stringify(body||{});
    // while the page is closing, let the last save finish in the background
    const keepalive=document.visibilityState==="hidden" && payload.length<60000;
    try{ r=await fetch(SERVER+path,{method:"POST",signal,keepalive,headers:{"Content-Type":"application/json",...(Auth.token?{Authorization:"Bearer "+Auth.token}:{})},body:payload}); }
    catch(e){ if(e&&e.name==="AbortError") throw {code:"cancelled"}; throw {code:"unavailable", message:"The Planning Studio server could not be reached. Check your internet connection and try again."}; }
    let j={}; try{ j=await r.json(); }catch(e){}
    if(r.status===401 && path!=="/login"){ signOut(); throw {code:"session_expired", message:j.error}; }
    if(r.status===429) throw {code:"rate_limited", message:j.error};
    if(r.status===403) throw {code:"not_allowed", status:403, message:j.error};
    if(r.status===413) throw {code:"too_big", status:413, message:j.error};
    if(!r.ok) throw {code:r.status>=500?"server_error":"bad_request", status:r.status, message:j.error||("The server answered "+r.status+".")};
    return j;
  }
  function notify(){ for(const l of [...Store.listeners]) try{ l(); }catch(e){ console.error(e); } }
  function saveBanner(msg, warn){ let b=document.getElementById("save-banner"); if(!msg){ if(b) b.remove(); return; } if(!b){ b=document.createElement("div"); b.id="save-banner"; b.setAttribute("role","alert"); b.style.cssText=(warn?"background:#8a5a00;":"background:var(--danger);")+"color:#fff;padding:10px 16px;font-weight:600;text-align:center"; document.body.prepend(b); } b.textContent=warn? msg : msg+" Plans can still be read, but nothing new is saved until this is fixed."; b.style.background=warn?"#8a5a00":"var(--danger)"; }
  async function loadAll(){ const j=await api("/api/data"); saveBanner(j.saveError||j.saveWarn, !j.saveError); if(j.fileKey) Store.fileKey=j.fileKey; Store.data={plans:{},threads:{},scans:{},settings:{},...j.data}; Store.rev=j.rev; Store.bootId=j.bootId; if(typeof j.director==="boolean"){ Auth.director=j.director; LS.set("fp-director",j.director?"1":null); } notify(); }
  let polling=false;
  /* stop checking for changes after 10 quiet minutes, so a forgotten open tab lets the free server sleep */
  const IDLE_MS=10*60*1000; let lastActive=Date.now(), idle=false;
  function noteActive(){ lastActive=Date.now(); if(idle){ idle=false; poll(); } }
  ["pointerdown","keydown","input","wheel","touchstart"].forEach(ev=>window.addEventListener(ev,noteActive,{passive:true,capture:true}));
  async function poll(){
    if(Date.now()-lastActive>IDLE_MS){ idle=true; return; }
    if(document.hidden || !Auth.token || polling) return;
    polling=true; const sent=Date.now();
    try{
      const j=await api("/api/changes",{since:Store.rev, bootId:Store.bootId});
      if(j.reload){ await loadAll(); return; }
      let any=false;
      for(const [kind,docs] of Object.entries(j.changes||{})) for(const [id,doc] of Object.entries(docs)){
        if((Store.wroteAt[kind+"/"+id]||0)>=sent) continue;   // this browser saved it after the check left, so its copy is newer
        any=true; Store.data[kind]=Store.data[kind]||{}; if(doc) Store.data[kind][id]=doc; else delete Store.data[kind][id]; }
      if(j.rev>Store.rev) Store.rev=j.rev; if(j.fileKey) Store.fileKey=j.fileKey; saveBanner(j.saveError||j.saveWarn, !j.saveError); if(any) notify();
    }catch(e){} finally{ polling=false; }
  }

  /* wake the server, which sleeps after 15 quiet minutes on Render's free plan */
  async function wake(){
    const t0=Date.now(); let tries=0;
    while(Date.now()-t0<150000){
      try{ const r=await fetch(SERVER+"/health",{cache:"no-store"}); if(r.ok){ const j=await r.json(); if(j.ready) return true; if(j.error){ gateMsg(j.error,true); return false; } } }catch(e){}
      tries++; gateMsg(tries<2? "Connecting…" : "Waking the server. The first visit after a quiet stretch takes about a minute.");
      await new Promise(r=>setTimeout(r, tries<3?2000:4000));
    }
    gateMsg("The server did not wake up. Try again in a minute.",true); return false;
  }
  // used by the app to wake the server quietly before retrying a Claude request
  window.FP_WAKE=async function(){ const t0=Date.now(); while(Date.now()-t0<120000){ try{ const r=await fetch(SERVER+"/health",{cache:"no-store"}); if(r.ok){ const j=await r.json(); if(j.ready) return true; } }catch(e){} await new Promise(r=>setTimeout(r,4000)); } return false; };
  function showGate(){
    const g=document.getElementById("gate"); g.hidden=false;
    const f=document.getElementById("gate-form"), b=document.getElementById("gate-btn"), c=document.getElementById("gate-code");
    setTimeout(()=>c.focus(),50);
    return new Promise(resolve=>{
      f.onsubmit=async e=>{ e.preventDefault(); b.disabled=true; b.textContent="Signing in…";
        try{ if(!(await wake())) throw {message:""}; const j=await api("/login",{passcode:c.value}); Auth.token=j.token; Auth.name=j.name; Auth.director=!!j.director; LS.set("fp-token",j.token); LS.set("fp-name",j.name); LS.set("fp-director",j.director?"1":null); g.hidden=true; resolve(); }
        catch(err){ if(err.message) gateMsg(err.message,true); b.disabled=false; b.textContent="Sign in"; c.select(); } };
    });
  }
  async function start(){
    if(!Auth.token) await showGate();
    else { const g=document.getElementById("gate"); g.hidden=false; document.getElementById("gate-form").style.display="none"; const note=document.createElement("p"); note.className="muted"; note.id="gate-wait"; g.append(note);
      const t=setTimeout(()=>{ note.textContent="Waking the server. The first visit after a quiet stretch takes about a minute."; },2500);
      const ok=await wake(); clearTimeout(t); if(!ok){ note.textContent="The Planning Studio server could not be reached. Reload the page to try again."; note.style.color="var(--danger)"; throw new Error("down"); }
      g.hidden=true; document.getElementById("gate-form").style.display=""; note.remove(); }
    await loadAll();
    setInterval(poll, 15000);
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) noteActive(); });
    const top=document.querySelector(".who");
    if(top){ const w=document.createElement("div"); w.className="who-chip"; w.innerHTML=`<span></span><button class="btn small ghost" type="button">Sign out</button>`; w.firstChild.textContent=(Auth.name||"")+(Auth.director?", director":""); w.lastChild.onclick=signOut; top.append(w); }
  }
  Store.ready=start();

  function snap(id,d){ return {id, exists:!!d, data:()=>d?JSON.parse(JSON.stringify(d)):undefined, metadata:{fromCache:false,hasPendingWrites:false}}; }
  function query(kind){
    const q={ limit(){return q}, where(){return q}, orderBy(){return q},
      onSnapshot(next){ const fire=()=>{ const docs=Object.entries(Store.data[kind]||{}).map(([id,d])=>snap(id,d)); next({docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}}); }; Store.listeners.add(fire); setTimeout(fire,0); return ()=>Store.listeners.delete(fire); },
      async get(){ const docs=Object.entries(Store.data[kind]||{}).map(([id,d])=>snap(id,d)); return {docs,size:docs.length,empty:!docs.length}; },
      doc(id){ return docRef(kind+"/"+id); } };
    return q;
  }
  function docRef(path){
    const [kind,id]=path.split("/");
    const write=async(op,extra)=>{ const r=await api("/api/write",{op,kind,id,...extra}); Store.wroteAt[kind+"/"+id]=Date.now(); Store.data[kind]=Store.data[kind]||{}; if(r.doc) Store.data[kind][id]=r.doc; else delete Store.data[kind][id]; notify(); return r.doc; };
    return { id, path,
      async get(){ return snap(id, Store.data[kind]?.[id]); },
      onSnapshot(next){ const fire=()=>next(snap(id, Store.data[kind]?.[id])); Store.listeners.add(fire); setTimeout(fire,0); return ()=>Store.listeners.delete(fire); },
      set:(data)=>write("set",{data}), create:(data)=>write("create",{data}), update:(patch)=>write("update",{patch}), delete:()=>write("delete",{}) };
  }
  const db={ collection:query, doc:docRef };
  const user={ id:async()=>Auth.name, can:async()=>true, canEdit:()=>!!Auth.director, isOwner:()=>!!Auth.director, profiles:async(ids)=>Object.fromEntries((ids||[]).map(i=>[i,{name:i}])) };

  function blobToJpegB64(blob, max=1800){
    return new Promise(async(resolve,reject)=>{
      try{ const bmp=await createImageBitmap(blob); const s=Math.min(1,max/Math.max(bmp.width,bmp.height)); const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*s); cv.height=Math.round(bmp.height*s);
        const c=cv.getContext("2d"); c.fillStyle="#fff"; c.fillRect(0,0,cv.width,cv.height); c.drawImage(bmp,0,0,cv.width,cv.height);
        cv.toBlob(b=>{ const fr=new FileReader(); fr.onload=()=>resolve(String(fr.result).split(",")[1]); fr.onerror=reject; fr.readAsDataURL(b); },"image/jpeg",.85); }
      catch(e){ reject({code:"image_rejected"}); }
    });
  }
  function blobToB64(blob){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]); fr.onerror=rej; fr.readAsDataURL(blob); }); }
  function looseJson(t){ t=String(t||"").trim(); try{ return JSON.parse(t); }catch(e){} const f=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(f){ try{ return JSON.parse(f[1]); }catch(e){} } const a=t.indexOf("{"), b=t.lastIndexOf("}"); if(a>=0&&b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e){} } return undefined; }
  async function ask(input, opts={}){
    if(opts.signal?.aborted) throw {code:"cancelled"};
    const content=[]; const imgs=opts.images? (Array.isArray(opts.images)?opts.images:[...(opts.images.length!=null&&!(opts.images instanceof Blob)?opts.images:[opts.images])]) : [];
    for(const b of imgs) content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:await blobToJpegB64(b, opts.maxSide||1800)}});
    const text=typeof input==="string"? input : (input||[]).map(t=>t.content).join("\n\n");
    content.push({type:"text",text});
    const j=await api("/api/read",{content, careful:!!opts.careful||opts.modelTier==="complex", purpose:opts.purpose||""}, opts.signal);
    return j;
  }
  const sample=Object.assign(async(input,opts)=>{ const j=await ask(input,opts); return {text:j.text, truncated:!!j.truncated, modelTierApplied:"default"}; }, {
    limits:async()=>({maxPromptBytes:262144, images:{maxCount:5, maxInputBytes:20e6, mediaTypes:["image/jpeg","image/png","image/webp","image/gif"]}}),
    json:async(input,opts)=>{ const j=await ask(input,opts); const v=looseJson(j.text); if(v===undefined) throw {code:j.truncated?"truncated":"invalid_json", text:j.text}; return v; }
  });
  const downloads={ async save({filename,data}){ const blob=data instanceof Blob? data : new Blob([data]); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); return {status:"saved"}; } };
  const caps={db,user,sample,downloads};
  window.claude={ use:async(name)=>{ await Store.ready; return caps[name]||null; } };
  window.addEventListener("pagehide",()=>{ try{ if(Auth.token) navigator.sendBeacon && fetch(SERVER+"/api/save-now",{method:"POST",keepalive:true,headers:{"Content-Type":"application/json",Authorization:"Bearer "+Auth.token},body:"{}"}); }catch(e){} });
})();
</script>

function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return iso(x)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseIso(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parseIso(s);d.setDate(d.getDate()+n);return iso(d)}
function fmtDate(s){if(!s)return"";return parseIso(s).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}

  const [d,s,dl]=await Promise.all([claude.use("db").catch(()=>null),claude.use("sample").catch(()=>null),claude.use("downloads").catch(()=>null)]);

      const next=new Map();serverIds=new Set(snap.docs.map(d=>d.id));
      snap.docs.forEach(doc=>{const v=doc.data();if(!v||deletedIds.has(doc.id))return;const loc=plans.get(doc.id);
        next.set(doc.id,(loc&&(pendingSaves.has(doc.id)||((loc.updatedAt||0)>=(v.updatedAt||0)&&Date.now()-(loc.updatedAt||0)<60000)))?loc:v)});
      for(const [id,loc] of plans)if(!next.has(id)&&!deletedIds.has(id)&&id!=="example"&&(id===currentId||pendingSaves.has(id)||Date.now()-(loc.updatedAt||0)<30000))next.set(id,loc);
      const before=currentId&&plans.get(currentId),after=currentId&&next.get(currentId);

    },()=>setConn("Offline. Changes stay on this device"));

    db.collection("scans").onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>{const v=d.data();if(v)m.set(d.id,v)});scans=m;if(view==="threads"&&!scanBusy&&!document.activeElement?.closest?.("#main"))renderMain()},()=>{});
  }else setConn("Saving on this device");
  renderAll();
}
const pendingSaves=new Set(),deletedIds=new Set();let serverIds=new Set();
function isEmptyPlan(p){
  if(Object.values(p.fields||{}).some(v=>String(v||"").trim()))return false;
  const w=p.web;if(w&&(String(w.focus||"").trim()||(w.branches||[]).some(b=>(b.name||"").trim()||(b.materials||"").trim())||String(w.questions||"").trim()||String(w.environment||"").trim()))return false;
  if(String(p.feedback||"").trim()||String(p.familyUpdate||"").trim()||p.importedFrom)return false;
  return true;
}
function pruneEmpty(){for(const [id,p] of plans)if(id!==currentId&&id!=="example"&&isEmptyPlan(p)&&!serverIds.has(id)&&!pendingSaves.has(id))plans.delete(id)}
function persist(p){
  p.updatedAt=Math.max(Date.now(),(p.updatedAt||0)+1);plans.set(p.id,p);
  if(p.type==="individual")flowRemarks(p);
  if(isEmptyPlan(p)&&!serverIds.has(p.id)){setConn("Saves once you write something");return}
  pendingSaves.add(p.id);dirty=true;
  setConn("Saving");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flushSaves,700);
}
async function flushSaves(){
  saveTimer=null;const ids=[...pendingSaves];
  if(!db){LS.set("fps.local",[...plans.values()].filter(x=>x.id!=="example"&&!isEmptyPlan(x)));ids.forEach(id=>pendingSaves.delete(id));dirty=false;setConn("Saved on this device");return}
  let ok=true;
  for(const id of ids){const p=plans.get(id);if(!p){pendingSaves.delete(id);continue}const stamp=p.updatedAt;
    try{await db.doc("plans/"+id).set(JSON.parse(JSON.stringify(p)));if((plans.get(id)?.updatedAt||0)<=stamp)pendingSaves.delete(id)}catch(e){ok=false}}
  dirty=pendingSaves.size>0;
  if(!ok){setConn("Not saved. Check your connection");clearTimeout(saveTimer);saveTimer=setTimeout(flushSaves,5000)}
  else if(dirty){clearTimeout(saveTimer);saveTimer=setTimeout(flushSaves,300)}
  else setConn("Saved and shared");
}
async function removePlan(id){
  deletedIds.add(id);pendingSaves.delete(id);plans.delete(id);
  if(db){try{await db.doc("plans/"+id).delete()}catch(e){toast(e?.message||"Could not delete. Try again.")}}
  else LS.set("fps.local",[...plans.values()]);
  if(currentId===id)currentId=null;renderAll();
}

    <div class="chiprow-label">Setting</div>
    <div class="chips">${PLACES.map(x=>`<button class="chip ${(p.setting||[]).includes(x)?"on":""}" data-toggle="setting" data-val="${esc(x)}">${esc(x)}</button>`).join("")}</div>
    <div class="chiprow-label">Languages to keep open this week</div>
    <div class="chips">${LANGUAGES.map(x=>`<button class="chip ${(p.languages||[]).includes(x)?"on":""}" data-toggle="languages" data-val="${esc(x)}">${esc(x)}</button>`).join("")}</div>
    <div class="chiprow-label">Documentation plan</div>
    <div class="chips">${DOC_PLAN.map(x=>`<button class="chip ${(p.docplan||[]).includes(x)?"on":""}" data-toggle="docplan" data-val="${esc(x)}">${esc(x)}</button>`).join("")}</div>
  </section>`;

function fieldCard(p,f){
  if(p.type==="individual"&&f.k==="area"&&p.focus!=="area")f={...f,hint:"The thread your group is following, a question or idea the children keep returning to. A full phrase, not a topic or theme.",strong:"Several children keep asking where the rabbit goes at night and have started drawing tunnels under the yard.",starters:["The children keep returning to ","They are wondering ","Across several sittings, "]};
  const v=p.fields[f.k]||"";
  let chips=`<div class="chips">${f.starters.map(s=>`<button class="chip" data-insert="${esc(s)}" data-field="${f.k}">${esc(s.trim())}${/[ "]$/.test(s)?"…":""}</button>`).join("")}</div>`;
  if(f.groups){const gs=GROUPS.filter(g=>!p.classroom||g.room===p.classroom);chips+=`<div class="chips">${gs.map(g=>`<button class="chip" data-insert="${esc(g.name)} group " data-field="${f.k}">${esc(g.name)}</button>`).join("")}</div>`}
  if(f.places)chips+=`<details><summary class="chiprow-label" style="cursor:pointer">Outdoor spaces</summary><div class="chips" style="margin-top:6px">${PLACES.filter(x=>!/Library|Classroom|Indoor/.test(x)).map(x=>`<button class="chip" data-insert="${esc(x.toLowerCase())} " data-field="${f.k}">${esc(x)}</button>`).join("")}</div></details>`;
  if(f.materials)chips+=`<details><summary class="chiprow-label" style="cursor:pointer">Materials library</summary><div style="display:grid;gap:6px;margin-top:6px">${Object.entries(MATERIALS).map(([c,list])=>`<div class="chips"><span class="muted" style="font-size:12px;width:84px">${c}</span>${list.map(m=>`<button class="chip" data-mat="${esc(m)}" data-field="${f.k}">${esc(m)}</button>`).join("")}</div>`).join("")}</div></details>`;
  if(f.seasons){const se=seasonOf(p.weekOf);chips+=`<details><summary class="chiprow-label" style="cursor:pointer">${se} concepts from the Family Handbook</summary><div class="hint" style="margin-top:6px">Concepts we hold loosely. Use one only where it meets what children are already doing.</div><div class="chips" style="margin-top:6px">${SEASONS[se].map(x=>`<button class="chip" data-insert="${esc(x.toLowerCase())} " data-field="${f.k}">${esc(x)}</button>`).join("")}</div></details>`}
  if(f.languages)chips+=`<div class="chiprow-label">Languages to keep open</div><div class="chips">${LANGUAGES.map(x=>`<button class="chip ${(p.languages||[]).includes(x)?"on":""}" data-toggle="languages" data-val="${esc(x)}">${esc(x)}</button>`).join("")}</div>`;
  if(f.docplan)chips+=`<details><summary class="chiprow-label" style="cursor:pointer">Documentation</summary><div class="chips" style="margin-top:6px">${DOC_PLAN.map(x=>`<button class="chip ${(p.docplan||[]).includes(x)?"on":""}" data-toggle="docplan" data-val="${esc(x)}">${esc(x)}</button>`).join("")}</div></details>`;
  const ex=showExample[f.k]?`<div class="ex"><div><b>Strong.</b> ${esc(f.strong)}</div><div class="weak"><b>Weak.</b> ${esc(f.weak)}</div></div>`:"";
  return `<section class="card" data-card="${f.k}">
    <label class="lbl" for="f-${f.k}">${f.label}${f.after?' <span class="muted" style="font-size:13px;font-family:var(--body)">end of week</span>':""}</label>
    <div class="hint">${f.hint}</div>
    ${p.type==="individual"&&f.k==="observation"&&p.obsFrom&&v===p.obsFrom?`<span class="nudge" style="justify-self:start">Started from last week's Final remarks, the reflection that prompted continuing. Edit it into this week's rationale, or use Strengthen wording.</span>`:""}
    ${chips}
    <textarea id="f-${f.k}" data-f="${f.k}" rows="${f.rows}">${esc(v)}</textarea>
    ${suggestHtml(p,f)}
    ${ex}
    <div class="cardfoot"><span id="n-${f.k}">${nudgeHtml(f,v)}</span>
      <span class="actions"><button class="linkbtn" data-ex="${f.k}">${showExample[f.k]?"Hide example":"See an example"}</button>
      ${sample&&!suggest[p.id+f.k]?`<button class="btn small ghost" data-strengthen="${f.k}">Strengthen wording</button>`:""}
      ${undo[p.id+f.k]!=null?`<button class="linkbtn" data-undo="${f.k}">Undo</button>`:""}</span></div>
  </section>`;
}
function nudgeHtml(f,v){
  const t=v.trim();if(!t)return"";
  const low=t.toLowerCase();
  for(const [w,msg] of WEAK)if(low.includes(w))return `<span class="nudge">${msg}</span>`;
  const n=t.split(/\s+/).length;
  if(n<f.min)return `<span class="nudge">Add a little more. ${f.hint.split(".")[0]}.</span>`;
  return `<span class="nudge ok">Reads as children's thinking</span>`;
}
function autoGrow(t){t.style.height="auto";t.style.height=Math.min(t.scrollHeight+2,600)+"px"}

/* Curriculum web editor */
function webEditor(p){
  const w=p.web;
  const names=w.branches.map((b,i)=>b.name||"Branch "+(i+1));
  return `<section class="card"><div class="lbl">Curriculum web</div>
   <div class="hint">Visual and non-linear. Start from the thinking you observed, then add 3 to 6 directions it could go. Branches may connect or stay separate. Revisit and evolve it weekly.</div>
   <div class="webwrap">
    <div style="display:grid;gap:10px;min-width:0">
      <label class="fld-label">Central focus, the emerging thinking<input type="text" id="w-focus" value="${esc(w.focus)}" placeholder="Ex. Movement, speed, and control"></label>
      <div class="chiprow-label">Branches of investigation and their materials</div>
      ${w.branches.map((b,i)=>`<div class="branch"><div style="display:grid;gap:6px"><input type="text" data-bname="${i}" value="${esc(b.name)}" placeholder="Ex. Ramp height and angle"><textarea data-bmat="${i}" rows="2" placeholder="Specific, varied materials. Ex. wood planks, cardboard tubes, textured fabric">${esc(b.materials)}</textarea></div><button class="iconbtn" data-bdel="${i}" aria-label="Remove branch">&times;</button></div>`).join("")}
      ${w.branches.length<6?`<button class="btn small ghost" id="w-add" style="justify-self:start">Add a branch</button>`:""}
      <div class="chiprow-label">Possible connections</div>
      ${w.connections.map((c,i)=>`<div class="conn"><span>${esc(names[c[0]]||"")}</span><span class="muted">with</span><span>${esc(names[c[1]]||"")}</span><button class="linkbtn" data-cdel="${i}">Remove</button></div>`).join("")}
      ${w.branches.length>1?`<div class="conn"><select id="c-a">${names.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join("")}</select><span class="muted">with</span><select id="c-b">${names.map((n,i)=>`<option value="${i}" ${i===1?"selected":""}>${esc(n)}</option>`).join("")}</select><button class="btn small ghost" id="c-add">Connect</button></div>`:""}
    </div>
    <div style="display:grid;gap:10px;min-width:0;align-content:start">
      <div class="svgbox" id="webprev"></div>
      <div class="chiprow-label">Languages of expression</div>
      <div class="chips">${LANGUAGES.map(x=>`<button class="chip ${w.languages.includes(x)?"on":""}" data-wlang="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <label class="fld-label">Open questions, from children or observation<textarea id="w-q" rows="3" placeholder="What makes something go faster? How can we make it stay up?">${esc(w.questions)}</textarea></label>
      <label class="fld-label">Notes for the environment<textarea id="w-env" rows="3" placeholder="Expand ramp area. Allow work to remain over multiple days.">${esc(w.environment)}</textarea></label>
    </div>
   </div></section>`;
}
function webLayout(n,cx,cy,rx,ry){const pts=[];for(let i=0;i<n;i++){const a=(-90+i*360/n)*Math.PI/180;pts.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)])}return pts}
function wrapWords(t,max){const words=String(t).split(/\s+/).filter(Boolean);const out=[];let line="";for(const w of words){if((line+" "+w).trim().length>max){if(line)out.push(line);line=w}else line=(line+" "+w).trim()}if(line)out.push(line);return out}
function drawWebPreview(p){
  const w=p.web,W=560,H=380,cx=W/2,cy=H/2;
  const pts=webLayout(w.branches.length,cx,cy,195,130);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Curriculum web preview">`;
  pts.forEach(([x,y])=>s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--muted)" stroke-width="1.2"/>`);
  w.connections.forEach(([a,b])=>{if(pts[a]&&pts[b]){const [x1,y1]=pts[a],[x2,y2]=pts[b];const mx=(x1+x2)/2+(cx-(x1+x2)/2)*-0.35,my=(y1+y2)/2+(cy-(y1+y2)/2)*-0.35;s+=`<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" fill="none" stroke="var(--marigold)" stroke-width="1.6" stroke-dasharray="5 4"/>`}});
  const fl=wrapWords(w.focus||"Central focus",20).slice(0,3);
  s+=`<ellipse cx="${cx}" cy="${cy}" rx="92" ry="44" fill="var(--moss-soft)" stroke="var(--moss)" stroke-width="1.5"/>`;
  fl.forEach((l,i)=>s+=`<text x="${cx}" y="${cy-(fl.length-1)*8+i*16+5}" text-anchor="middle" font-size="13.5" font-weight="600" fill="var(--moss)" font-family="Figtree, sans-serif">${esc(l)}</text>`);
  w.branches.forEach((b,i)=>{const [x,y]=pts[i];const nl=wrapWords(b.name||"Branch "+(i+1),22).slice(0,2);const ml=wrapWords(b.materials,28).slice(0,3);const h=14+nl.length*15+ml.length*13;
    s+=`<rect x="${x-78}" y="${y-h/2}" width="156" height="${h}" rx="7" fill="var(--paper)" stroke="var(--line)"/>`;
    nl.forEach((l,j)=>s+=`<text x="${x}" y="${y-h/2+17+j*15}" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--ink)" font-family="Figtree, sans-serif">${esc(l)}</text>`);
    ml.forEach((l,j)=>s+=`<text x="${x}" y="${y-h/2+17+nl.length*15+j*13}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="Figtree, sans-serif">${esc(l)}</text>`);
  });
  s+=`</svg>`;$("#webprev").innerHTML=s;
}

function rosterFor(room){const a=roster.filter(r=>room&&r.room===room).map(r=>r.name),b=roster.filter(r=>!room||r.room!==room).map(r=>r.name);return [...new Set([...a,...b])]}
function educatorSelect(p){
  const names=rosterFor(p.classroom);const cur=p.educator||"";
  return `<label>Educator<select id="m-edsel"><option value="">Choose</option>${names.map(n=>`<option ${n===cur?"selected":""}>${esc(n)}</option>`).join("")}${cur&&!names.includes(cur)?`<option selected>${esc(cur)}</option>`:""}<option value="__add">Add a new name</option></select></label>`;
}
function teamList(p){return String(p.educator||"").split(",").map(x=>x.trim()).filter(Boolean)}
function teamPicker(p){
  const team=teamList(p);const names=rosterFor(p.classroom);const extra=team.filter(n=>!names.includes(n));
  const inRoom=roster.filter(r=>r.room===p.classroom).map(r=>r.name);
  return `<div class="fld-label" style="grid-column:1/-1">Educators on the team<div class="chips" style="margin-top:2px">${[...new Set([...inRoom,...extra,...team])].map(n=>`<button class="chip ${team.includes(n)?"on":""}" data-team="${esc(n)}">${esc(n)}</button>`).join("")}
    <details style="display:inline-block"><summary class="chip" style="list-style:none;display:inline-block">More names</summary><div class="chips" style="margin-top:6px">${names.filter(n=>!inRoom.includes(n)&&!team.includes(n)).map(n=>`<button class="chip" data-team="${esc(n)}">${esc(n)}</button>`).join("")}</div></details>
    <button class="chip" id="m-addteam">Add a new name</button></div></div>`;
}
function fillEducatorList(){const dl=$("#educators");if(dl)dl.innerHTML=rosterNames().map(n=>`<option value="${esc(n)}">`).join("")}
function renderRoster(){
  const el=$("#roster");if(!el)return;
  const groups=[...CLASSROOMS,""].map(r=>({r,names:roster.map((x,i)=>({...x,i})).filter(x=>(x.room||"")===r)})).filter(g=>g.names.length);
  el.innerHTML=groups.map(g=>`<div class="cnt">${g.r||"Specialty and floating"}</div><div class="chips">${g.names.map(x=>`<span class="rname">${esc(x.name)}<button data-rdel="${x.i}" aria-label="Remove ${esc(x.name)}">&times;</button></span>`).join("")}</div>`).join("")+
   `<div style="display:grid;gap:6px;margin-top:6px"><input type="text" id="r-name" placeholder="Add an educator's name"><div style="display:flex;gap:6px"><select id="r-room" style="flex:1"><option value="">Specialty or floating</option>${CLASSROOMS.map(r=>`<option>${r}</option>`).join("")}</select><button class="btn small" id="r-add">Add</button></div></div>`;
}
function addToRoster(name,room){name=name.trim();if(!name)return;if(!roster.some(r=>r.name.toLowerCase()===name.toLowerCase())){roster.push({name,room:room||""});saveRoster()}}
function saveRoster(){LS.set("fps.roster",roster);renderRoster();fillEducatorList();if(db)db.doc("settings/educators").set({names:JSON.parse(JSON.stringify(roster)),updatedAt:Date.now()}).catch(()=>toast("Could not save the educator list. Check your connection."))}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
  if(t.dataset.rdel!=null){roster.splice(+t.dataset.rdel,1);saveRoster();return}
  if(t.id==="r-add"){const n=$("#r-name").value;if(!n.trim()){toast("Type a name first.");return}addToRoster(n,$("#r-room").value);toast("Added to the educator list.");return}
  const p=currentId&&plans.get(currentId);if(!p||view!=="plans")return;
  if(t.dataset.team){const team=teamList(p);const n=t.dataset.team;const i=team.indexOf(n);i>=0?team.splice(i,1):team.push(n);p.educator=team.join(", ");persist(p);renderList();t.classList.toggle("on",i<0);return}
  if(t.id==="m-addteam"){$("#m-addrow").hidden=false;$("#m-newname").focus();return}
  if(t.id==="m-addcancel"){$("#m-addrow").hidden=true;const sel=$("#m-edsel");if(sel)sel.value=p.educator||"";return}
  if(t.id==="m-addname"){const n=$("#m-newname").value.trim();if(!n){toast("Type a name first.");return}addToRoster(n,p.classroom);
    if(p.type==="classroom"){const team=teamList(p);if(!team.includes(n))team.push(n);p.educator=team.join(", ")}else p.educator=n;
    persist(p);renderList();renderMain();toast("Added to the educator list for everyone.");return}
});
document.addEventListener("change",e=>{const t=e.target;if(t.id!=="m-edsel")return;const p=currentId&&plans.get(currentId);if(!p)return;
  if(t.value==="__add"){$("#m-addrow").hidden=false;$("#m-newname").focus();return}
  p.educator=t.value;persist(p);renderList()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="m-newname"){e.preventDefault();$("#m-addname").click()}if(e.key==="Enter"&&e.target.id==="r-name"){e.preventDefault();$("#r-add").click()}});
function renderWelcome(){
  $("#main").innerHTML=`<section class="welcome">
    <div><span class="eyebrow">Week of ${fmtDate(week)}</span><h2 style="font-size:32px;margin-top:4px">Plan from what children are thinking</h2>
    <p class="muted" style="max-width:62ch;margin:.4em 0 0">Each form follows the cycle in our handbook. Informal observation, assumptions, outcomes, goals, and biases, provocation, formal observation, documentation, and reflection, then back to observation. Tap a sentence starter or a material to add it, check the example for each section, and download a printable PDF when you are done.</p></div>
    <div class="steps">
      <div class="step"><h3>1. Note what you see</h3><p>Jot during the week, or paste your notepad notes. ${sample?"Claude can sort them into the right sections for you.":"Sentence starters keep entries quick."}</p></div>
      <div class="step"><h3>2. Fill the form</h3><p>Starters, a materials library, Fulton's outdoor spaces, and the hundred languages are one tap away. Gentle prompts flag theme or activity language.</p></div>
      <div class="step"><h3>3. Print or share</h3><p>Download a clean PDF for your binder or the classroom wall. Plans save for your team, and the director can mark them reviewed.</p></div>
      <div class="step"><h3>4. Carry it forward</h3><p>Next week starts from this week's reflection, so threads continue without rewriting.</p></div>
    </div>
    <div class="actions"><button class="btn" data-new="classroom">Start this week's Classroom Plan</button><button class="btn ghost" id="sample">Download a sample filled plan</button></div>
  </section>`;
}

/* ---------- Events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-open]");if(!t)return;
  const p=currentId&&plans.get(currentId);
  if(t.dataset.astatus)aStatus=t.dataset.astatus;
  if(t.dataset.view){view=t.dataset.view;LS.set("fps.view",view);renderNav();renderMain();return}
  if(await threadsClick(t))return;
  if(await importClick(t))return;
  if(t.dataset.new){view="plans";LS.set("fps.view",view);renderNav();const np=newPlan(t.dataset.new);plans.set(np.id,np);currentId=np.id;persist(np);renderList();renderMain();jumpTop();return}
  if(t.dataset.open){view="plans";LS.set("fps.view",view);renderNav();currentId=t.dataset.open;const op=plans.get(currentId);if(op&&op.weekOf!==week){week=op.weekOf;renderWeek()}renderList();renderMain();if(t.dataset.jump){const ta=$("#f-"+t.dataset.jump);if(ta){ta.scrollIntoView({block:"center"});ta.focus()}}else jumpTop();return}
  if(t.dataset.jump&&!t.dataset.open){const ta=$("#f-"+t.dataset.jump);if(ta){ta.scrollIntoView({block:"center"});ta.focus()}return}
  if(t.dataset.room){roomFilter=t.dataset.room;LS.set("fps.room",roomFilter);renderFilters();renderList();return}
  if(t.id==="prevwk"||t.id==="nextwk"){week=addDays(week,t.id==="prevwk"?-7:7);currentId=null;renderAll();return}
  if(t.id==="blanks"){makePdf(["classroom","individual"].map(type=>({type,blank:true,fields:{},web:blankWeb(),setting:[],languages:[],docplan:[]})),"Fulton blank planning forms.pdf");return}
  if(t.id==="packet"){const ps=weekPlans();if(!ps.length){toast("No plans this week to download.");return}makePdf(ps,`Fulton plans week of ${week}${roomFilter!=="All"?" "+roomFilter:""}.pdf`);return}
  if(t.id==="packetw"){const ps=weekPlans();if(!ps.length){toast("No plans this week to download.");return}makeDocx(ps,`Fulton plans week of ${week}${roomFilter!=="All"?" "+roomFilter:""}.docx`);return}
  if(t.id==="blanksw"){makeDocx(["classroom","individual"].map(type=>({type,blank:true,fields:{},web:blankWeb(),setting:[],languages:[],docplan:[]})),"Fulton blank planning forms.docx");return}
  if(t.id==="sample"){makePdf([EXAMPLE],"Fulton sample classroom plan.pdf");return}
  if(!p)return;
  if(t.id==="dl"){makePdf([p],fileName(p));return}
  if(t.id==="dlw"){makeDocx([p],fileName(p).replace(/\.pdf$/,".docx"));return}
  if(t.id==="carry"){carryForward(p);return}
  if(t.id==="del"){askDelete($("#delwrap"),p.id,"del");return}
  if(t.dataset.dupdel){askDelete($("#dupwrap"),t.dataset.dupdel,"dup");return}
  if(t.dataset.delask2){askDelete2(t.closest("#delwrap,#dupwrap"),t.dataset.delask2);return}
  if(t.dataset.delgo){const id=t.dataset.delgo;const keep=id!==p.id?p:null;if(keep){delete keep.dupOf;delete keep.importDup;persist(keep)}removePlan(id);toast("Plan deleted.");return}
  if(t.dataset.delkeep){renderMain();return}
  if(t.id==="dupok"){p.notDupOf=p.dupOf||"";delete p.dupOf;delete p.importDup;persist(p);renderMain();toast("Marked as not a duplicate.");return}
  if(t.dataset.status){p.status=t.dataset.status;persist(p);t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t));renderList();return}
  if(t.dataset.focus){p.focus=t.dataset.focus;if(p.focus==="area")p.groups=[];persist(p);renderList();renderMain();return}
  if(t.dataset.fgroup){const n=t.dataset.fgroup;p.groups=p.groups||[];const i=p.groups.indexOf(n);i>=0?p.groups.splice(i,1):p.groups.push(n);const g=GROUPS.find(g=>g.name===n);if(i<0&&g&&!p.classroom)p.classroom=g.room;
    if(i<0&&g&&!p.educator&&g.educator)p.educator=g.educator;persist(p);renderList();renderMain();return}
  if(t.dataset.session){p.session=t.dataset.session;persist(p);t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t));return}
  if(t.dataset.toggle){const arr=p[t.dataset.toggle]||(p[t.dataset.toggle]=[]);const v=t.dataset.val;const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v);t.classList.toggle("on");persist(p);return}
  if(t.dataset.insert!=null){insertText(t.dataset.field,t.dataset.insert,false);return}
  if(t.dataset.mat){insertText(t.dataset.field,t.dataset.mat,true);return}
  if(t.dataset.ex){showExample[t.dataset.ex]=!showExample[t.dataset.ex];rerenderCard(p,t.dataset.ex);return}
  if(t.dataset.strengthen){strengthen(p,t.dataset.strengthen,t);return}
  if(t.dataset.sgyes){const k=t.dataset.sgyes,key=p.id+k;const txt=($("#sgt-"+k)?.value||suggest[key]?.text||"").trim();if(txt){undo[key]=p.fields[k]||"";p.fields[k]=txt;delete suggest[key];persist(p);clearTimeout(saveTimer);flushSaves();rerenderCard(p,k);toast("Updated. Undo is under the section if you want your version back.")}return}
  if(t.dataset.sgno){delete suggest[p.id+t.dataset.sgno];rerenderCard(p,t.dataset.sgno);return}
  if(t.dataset.undo){const k=t.dataset.undo;p.fields[k]=undo[p.id+k];delete undo[p.id+k];persist(p);rerenderCard(p,k);return}
  if(t.id==="draft"){draftFromNotes(p,t);return}

function wrap(doc,text,w){doc.setFont("helvetica","normal");doc.setFontSize(PG.fs);const t=clean(text).trim();if(!t)return[];return t.split(/\n+/).flatMap(par=>doc.splitTextToSize(par,w))}

  const A=ACC[p.type]||ACC.classroom;const blank=!!p.blank;MINL=p.type==="story"?1:2;
  const pages=[];let page={items:[],top:PG.top1};const avail=()=>PG.bottom-page.top-page.items.reduce((s,it)=>s+it.h+PG.gap,0);
  const flush=()=>{pages.push(page);page={items:[],top:PG.topN}};
  const blocks=planBlocks(p);
  for(let bi=0;bi<blocks.length;bi++){const b=blocks[bi];
    if(b.t==="break"){flush();continue}
    if(b.t==="sub"){if(avail()<24+90)flush();page.items.push({t:"sub",text:b.text,h:16,w:0});continue}
    if(b.t==="web"){const h=318;if(avail()<h)flush();page.items.push({t:"web",web:b.web,blank:b.blank,h,w:0});continue}
    if(b.t==="cols"){

      if(h>PG.bottom-PG.topN){b.cols.forEach(c=>blocks.splice(bi+1,0,{t:"sec",label:c.label,text:c.text,w:b.w}));continue}
      if(h>avail())flush();

      if(fit<3||lines.length<=fit){flush();continue}

    }

let tShowDismissed=false,tOpenStopped=false;
function whoAmI(){return me()||(window.FP_HOSTED&&window.FP_NAME?window.FP_NAME():"")||"An educator"}
function shortDate(ms){return ms?new Date(ms).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):""}
const RANGE_LABEL={"4":"the last 4 weeks",8:"the last 8 weeks",year:"this school year",all:"all saved plans"};
function planWho(p){
  if(p.type==="classroom")return "Classroom team";
  if(p.type==="smallgroup")return [p.group&&p.group+" group",p.educator].filter(Boolean).join(", ");
  const g=p.focus==="smallgroup"&&(p.groups||[]).length?p.groups.join(" and ")+" group"+(p.groups.length>1?"s":""):"";
  return [p.educator,g||(p.where?p.where:"")].filter(Boolean).join(", ");
}
const normQ=x=>String(x||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
// find which section of the plan a quote came from, so every quote says exactly where it lives
function sectionOf(p,text){
  const q=normQ(text);if(!q)return"";const head=q.split(" ").slice(0,6).join(" ");
  const parts=FORMS[p.type].fields.map(f=>[f.label,normQ(p.fields?.[f.k])]);
  if(p.web)parts.push(["Curriculum web",normQ([p.web.focus,...(p.web.branches||[]).map(b=>b.name+" "+b.materials),p.web.questions,p.web.environment].join(" "))]);
  for(const [l,t] of parts)if(t&&t.includes(q))return l;
  for(const [l,t] of parts)if(t&&head.length>8&&t.includes(head))return l;
  return"";
}
function evSource(e){
  const p=plans.get(e.planId);
  if(!p)return `<span class="src">Week of ${fmtDate(e.week)}. This plan has since been deleted</span>`;
  const bits=[FORMS[p.type].name,planWho(p),p.classroom&&p.classroom+" classroom",sectionOf(p,e.text)].filter(Boolean);
  return `<span class="src"><button class="linkbtn" data-open="${p.id}">Week of ${fmtDate(p.weekOf)}</button> · ${bits.map(esc).join(" · ")}</span>`;
}
function originHtml(t,isTracked){
  const ev=[...(t.evidence||[])].sort((a,b)=>(a.week||"").localeCompare(b.week||""));
  const rows=[];
  const first=ev[0];
  if(first){const p=plans.get(first.planId);
    let inPlan="";
    if(p){const room=p.classroom?" in the "+esc(p.classroom)+" classroom":"";
      if(p.type==="classroom")inPlan=`, in the classroom team's Classroom Curriculum Plan${room}`;
      else{const g=p.type==="smallgroup"?p.group:(p.focus==="smallgroup"?(p.groups||[]).join(" and "):"");
        inPlan=`, in ${p.educator?esc(p.educator)+"'s":"an"} ${esc(FORMS[p.type].name)}${g?" for the "+esc(g)+" group":p.where?" about the "+esc(p.where):""}${room}`}}
    rows.push(`<div><b>Started</b>the week of ${fmtDate(first.week)}${inPlan}</div>`)}
  const ps=[...new Map(ev.map(e=>[e.planId,plans.get(e.planId)]).filter(([,p])=>p)).values()];
  if(ps.length){const ct=k=>ps.filter(p=>p.type===k).length;
    const types=[["classroom","Classroom team"],["individual","Individual"],["smallgroup","Small Group"]].map(([k,l])=>ct(k)?`${ct(k)} ${l}`:"").filter(Boolean).join(", ");
    const rooms=[...new Set(ps.map(p=>p.classroom).filter(Boolean))];
    const people=[...new Set(ps.flatMap(p=>p.type==="classroom"?[]:[p.educator,...(p.focus==="smallgroup"?(p.groups||[]).map(g=>g+" group"):[]),p.group&&p.group+" group"]).filter(Boolean))];
    const wks=new Set(ps.map(p=>p.weekOf)).size;
    rows.push(`<div><b>Seen in</b>${ps.length} plan${ps.length>1?"s":""} over ${wks} week${wks>1?"s":""}. ${esc(types)}${rooms.length?". "+esc(rooms.join(" and "))+(rooms.length>1?" classrooms":" classroom"):""}${people.length?". "+esc(people.slice(0,6).join(", "))+(people.length>6?` and ${people.length-6} more`:""):""}</div>`)}
  if(isTracked){
    const how=t.origin?`after Claude found it in ${t.origin.range==="all"||!RANGE_LABEL[t.origin.range]?"all saved plans":"plans from "+RANGE_LABEL[t.origin.range]}${t.origin.room&&t.origin.room!=="All"?" in the "+esc(t.origin.room)+" classroom":" across all classrooms"}`:"";
    rows.push(`<div><b>Followed</b>${t.followedBy?"by "+esc(t.followedBy)+" ":""}on ${shortDate(t.createdAt)}${how?" "+how:""}${t.refollowed?`. Followed again by ${esc(t.refollowed.by)} on ${shortDate(t.refollowed.at)}`:""}</div>`);
  }
  return rows.length?`<div class="origin">${rows.join("")}</div>`:"";

function evidenceHtml(t){

function digest(ps){
  const keys={classroom:["observation","intentions","interests","indoor","outdoor","brainstorm"],individual:["area","observation","intent","questions","remarks"],smallgroup:["thread","intention","questions","reflection"]};
  return ps.sort((a,b)=>b.weekOf.localeCompare(a.weekOf)).slice(0,140).map(p=>{const o={id:p.id,week:p.weekOf,type:FORMS[p.type].short,classroom:p.classroom||"",who:p.type==="smallgroup"?(p.group||"")+" group":p.type==="individual"?(p.educator||""):"team",text:{}};
    (keys[p.type]||[]).forEach(k=>{const v=(p.fields?.[k]||"").trim();if(v)o.text[k]=v.slice(0,450)});
    if(p.web&&(p.web.focus||p.web.branches?.some(b=>b.name)))o.text.web=[p.web.focus,...p.web.branches.map(b=>b.name)].filter(Boolean).join("; ");
    return o}).filter(o=>Object.keys(o.text).length);
}
function capDigest(d,max){const out=[];let n=0;for(const x of d){const l=JSON.stringify(x).length+1;if(n+l>max)break;out.push(x);n+=l}return out}
async function findThreads(){
  const ps=rangePlans();const full=digest(ps);const d=capDigest(full,170000);if(!d.length){toast("Save a few plans with observations first.");return}
  if(d.length<full.length)toast(`Reading the ${d.length} most recent plans. Choose a shorter range or one classroom to include older ones.`);
  scanBusy=true;renderMain();
  const ids=new Set(d.map(x=>x.id));const byId=new Map(d.map(x=>[x.id,x]));
  const tracked=[...threads.values()].filter(t=>t.status!=="closed"&&(tRoom==="All"||t.classroom===tRoom||!t.classroom)).map(t=>({id:t.id,name:t.name,question:t.question}));
  const prompt=`You are reading saved curriculum plans from ${tRoom==="All"?"all classrooms":"the "+tRoom+" classroom"} at Fulton Community School & Farm, weeks ${rangeWeeks(ps)[0]} to ${mondayOf(new Date())}.
Find the threads. A thread is a question or idea children keep returning to across several sittings or weeks, carrying weight for them. Look across Classroom team plans, Individual plans, and Small Group plans, and notice when different educators or groups describe the same thread.
Rules. Use only what the plans say. Never invent children, quotes, or events. Report threads supported by at least two plans or two separate weeks. You may add up to two emerging threads seen only once. Return at most 8 threads, strongest first. Give at most 4 evidence items per thread, each from a different plan where possible. Each evidence item must use a planId from the list and copy exact words from that plan. Keep the answer compact. Return only the JSON, with no other text.
Threads the team is already following ${JSON.stringify(tracked)}. If a thread you find is one of these, set trackedId to its id.
${STYLE}
Return JSON {"summary": two or three sentences on the overall picture of children's thinking in this range, "threads":[{"name": 3 to 7 words from the children's side, "question": the question underneath what children keep returning to, phrased as a child might ask it, "classroom": "West" or "North" or "South" or "", "groups": [flower group names involved, only if named], "status": "emerging" or "growing" or "deepening" or "resting" (resting means not seen in the latest two weeks), "weeks": [week ids from the plans], "evidence": [{"planId": id, "week": week id, "text": exact words from that plan, under 25 words}], "languages": [only from ${JSON.stringify(LANGUAGES)}], "next": [2 to 4 possible provocations or environment changes grounded in the evidence, naming specific materials], "trackedId": ""}]}

Plans, one JSON object per line.
${d.map(x=>JSON.stringify(x)).join("\n")}`;
  try{
    const out=await sample.json(prompt,{modelTier:"complex",cache:false,purpose:"threads"});
    const clean2=v=>String(v||"").replace(/—/g,", ");
    const ths=(Array.isArray(out?.threads)?out.threads:[]).slice(0,8).map(x=>{
      const ev=(Array.isArray(x.evidence)?x.evidence:[]).filter(e=>e&&ids.has(e.planId)).map(e=>({planId:e.planId,week:byId.get(e.planId).week,text:clean2(e.text).slice(0,240)}));
      const wk=[...new Set([...(Array.isArray(x.weeks)?x.weeks:[]).filter(w=>d.some(p=>p.week===w)),...ev.map(e=>e.week)])].sort();
      return {name:clean2(x.name)||"Untitled thread",question:clean2(x.question),classroom:CLASSROOMS.includes(x.classroom)?x.classroom:"",groups:(Array.isArray(x.groups)?x.groups:[]).filter(g=>GROUPS.some(G=>G.name===g)),status:TSTATUS[x.status]?x.status:"emerging",weeks:wk,evidence:ev,languages:(Array.isArray(x.languages)?x.languages:[]).filter(l=>LANGUAGES.includes(l)),next:(Array.isArray(x.next)?x.next:[]).map(clean2).slice(0,4),trackedId:threads.has(x.trackedId)?x.trackedId:""};
    }).filter(x=>x.evidence.length);
    // update followed threads with new evidence
    for(const x of ths){if(!x.trackedId)continue;const th=threads.get(x.trackedId);const have=new Set((th.evidence||[]).map(e=>e.planId+e.text));
      const add=x.evidence.filter(e=>!have.has(e.planId+e.text));th.evidence=[...(th.evidence||[]),...add];th.weeks=[...new Set([...(th.weeks||[]),...x.weeks])].sort();th.lastWeek=th.weeks.slice(-1)[0]||"";if(th.status!=="closed")th.status=x.status;
      th.next=x.next.length?x.next:th.next;th.languages=[...new Set([...(th.languages||[]),...x.languages])];saveThread(th)}
    saveScan({room:tRoom,range:tRange,createdAt:Date.now(),summary:clean2(out?.summary),threads:ths});
    toast(ths.length?`Found ${ths.length} thread${ths.length>1?"s":""}.`:"No threads with enough evidence yet.");
  }catch(err){toast(assistError(err?.code||"unknown"))}
  scanBusy=false;renderMain();
}
async function writeStory(th){
  if(!th)return;storyBusy[th.id]=true;renderMain();
  const src=(th.evidence||[]).map(e=>plans.get(e.planId)).filter(Boolean);
  const uniq=[...new Map(src.map(p=>[p.id,p])).values()].sort((a,b)=>a.weekOf.localeCompare(b.weekOf));
  const d=digest(uniq).reverse();
  const prompt=`Write a project story for Fulton Community School & Farm educators to share at a family evening or with colleagues, following the school's project presentation timeline. The project grew from this thread.
Thread ${JSON.stringify({name:th.name,question:th.question,classroom:th.classroom,groups:th.groups,weeks:th.weeks,evidence:th.evidence,team_notes:th.notes||""})}
Use only what the plans, evidence, and team notes say. Never invent quotes, children, or events. When the plans give nothing for a section, write one short sentence naming what educators could add there, beginning with "Add". Write 2 to 4 sentences per section. ${STYLE}
Return JSON with these keys ${STORY.map(([k,l])=>`"${k}" (${l})`).join(", ")}.

Plans, oldest first.
${d.map(x=>JSON.stringify(x)).join("\n")}`;
  try{const out=await sample.json(prompt,{modelTier:"complex",cache:false});const st={};STORY.forEach(([k])=>st[k]=String(out?.[k]||"").replace(/—/g,", "));th.story=st;saveThread(th);toast("Project story written. Open it below the thread to edit.")}
  catch(err){toast(assistError(err?.code||"unknown"))}
  delete storyBusy[th.id];renderMain();
}

function loadScript(src,globalName){return new Promise((res,rej)=>{if(window[globalName])return res(window[globalName]);const sc=document.createElement("script");sc.src=src;sc.onload=()=>window[globalName]?res(window[globalName]):rej(new Error("load"));sc.onerror=()=>rej(new Error("load"));document.head.appendChild(sc)})}

async function shrinkImage(file){
  try{const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});const sc=Math.min(1,2200/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return await canvasBlob(c)}
  catch(e){return file}

async function addFiles(files){

  for(const f of files){
    const name=f.name||"Photo";const ext=(name.split(".").pop()||"").toLowerCase();const grp=nextGrp++;
    try{
      if(f.type.startsWith("image/")||["jpg","jpeg","png","webp","gif","heic"].includes(ext)){const b=await shrinkImage(f);uploads.push({kind:"image",name,file:name,grp,blob:b,url:URL.createObjectURL(b)})}
      else if(ext==="pdf"||f.type==="application/pdf"){
        const lib=await pdfLib();const pdf=await lib.getDocument({data:await f.arrayBuffer()}).promise;
        const pages=Math.min(pdf.numPages,200);if(pdf.numPages>200)toast(`${name} has ${pdf.numPages} pages. The first 200 are added.`);
        for(let i=1;i<=pages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();const pageText=tc.items.map(x=>x.str).join(" ").trim();
          const vp0=pg.getViewport({scale:1});const vp=pg.getViewport({scale:Math.min(2.5,1800/Math.max(vp0.width,vp0.height))});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;const b=await canvasBlob(c);uploads.push({kind:"image",name:`${name}, page ${i}`,file:name,grp,blob:b,url:URL.createObjectURL(b),pageText});if(view==="import"&&i%5===0)renderImport()}
      }

}

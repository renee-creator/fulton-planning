function printBtns(kind,id,pdfLabel,primary){const d=`data-print="${kind}"${id?` data-id="${id}"`:""}`;return `<button class="btn small${primary?"":" ghost"}" ${d}>${pdfLabel}</button><button class="linkbtn" ${d} data-word="1" aria-label="${pdfLabel.replace(/PDF/,"Word")}">Word</button>`}

/* ---------- Threads and overview ---------- */
const STORY=[["inception","The inception of the project"],["thread","What was the thread that started the inquiry"],["decision","How we decided to follow it"],["evolution","The evolution of the project"],["investigations","Investigations offered to move knowledge forward"],["knew","What the children knew and what they wanted to know"],["inquiry","Following children's inquiry"],["now","Where the project is now"],["closure","Summary of closure"],["future","Continuation and ideas for the future"]];
const TSTATUS={emerging:"Emerging",growing:"Growing",deepening:"Deepening",resting:"Resting",closed:"Closed"};
const STOP=new Set("a an and are as at be been being but by can could did do does each for from had has have he her his how i if in into is it its just like many may me more most my new no not of on one or other our out over own same she so some such than that the their them then there these they this those through to too under up very was we were what when where which while who why will with would you your about after again also all any around because before both down during few further here him himself itself let made make makes making might much must nor off once only ourselves she should since still themselves until upon us use used using week weeks children child childrens group groups educator educators teacher teachers plan plans classroom small others another several began begin continue continued continuing day days time times support supporting supports offer offering offered added adding explore exploring explored exploration ideas idea thinking materials material work working provide providing allow allowing invite inviting different ways way across each things thing seem seems kept keep back during now next last first second third two three morning afternoon".split(" "));
let GNAMES=new Set(GROUPS.flatMap(g=>g.name.toLowerCase().split(" ")).concat(["glory"]));
function schoolYearStart(){const t=new Date();const y=t.getMonth()>=7?t.getFullYear():t.getFullYear()-1;return mondayOf(new Date(y,7,1))}
function rangeStart(){const cur=mondayOf(new Date());if(tRange==="4")return addDays(cur,-21);if(tRange==="8")return addDays(cur,-49);if(tRange==="year")return schoolYearStart();return "0000-00-00"}
function rangePlans(){const s=rangeStart();return [...plans.values()].filter(p=>p.id!=="example"&&p.weekOf>=s&&(tRoom==="All"||p.classroom===tRoom))}
function rangeWeeks(ps){const cur=mondayOf(new Date());let s=rangeStart();if(s==="0000-00-00"){s=ps.reduce((m,p)=>p.weekOf<m?p.weekOf:m,cur)}const last=ps.reduce((m,p)=>p.weekOf>m?p.weekOf:m,cur);const out=[];for(let w=s;w<=last&&out.length<60;w=addDays(w,7))out.push(w);return out}
function planText(p){const parts=Object.values(p.fields||{});if(p.web){parts.push(p.web.focus||"");(p.web.branches||[]).forEach(b=>parts.push(b.name||"",b.materials||""));parts.push(p.web.questions||"",p.web.environment||"")}return parts.filter(Boolean).join(" \n ")}
function thinkingText(p){const f=p.fields||{};const ks={classroom:["observation","interests","intentions","brainstorm"],individual:["area","observation","remarks"],smallgroup:["thread","intention","reflection"]}[p.type]||[];let t=ks.map(k=>f[k]||"").join(" ");if(p.web)t+=" "+(p.web.focus||"")+" "+(p.web.branches||[]).map(b=>b.name).join(" ");return t}
function recurring(ps){
  const terms=new Map();
  for(const p of ps){
    const words=thinkingText(p).toLowerCase().replace(/[.;,!?:()\n]+/g," | ").replace(/[^a-z'| ]+/g," ").split(/\s+/).map(w=>w.replace(/^'+|'+$/g,"").replace(/'s$/,"")).filter(Boolean);
    const seen=new Set();
    for(let i=0;i<words.length;i++){
      const w=words[i];if(w==="|"||w.length<4||STOP.has(w)||GNAMES.has(w))continue;seen.add(w);
      const n=words[i+1];if(n&&n!=="|"&&n.length>=4&&!STOP.has(n)&&!GNAMES.has(n))seen.add(w+" "+n);
    }
    for(const k of seen){if(!terms.has(k))terms.set(k,{weeks:new Set(),plans:0});const e=terms.get(k);e.weeks.add(p.weekOf);e.plans++}
  }
  let arr=[...terms.entries()].map(([k,v])=>({k,weeks:v.weeks.size,plans:v.plans})).filter(x=>x.plans>=2);
  arr.sort((a,b)=>b.weeks-a.weeks||b.plans-a.plans||(b.k.includes(" ")-a.k.includes(" ")));
  const out=[];for(const x of arr){if(out.some(o=>o.k.includes(x.k)&&o.plans===x.plans))continue;out.push(x);if(out.length>=24)break}
  return out;
}
function snippet(text,q){const i=text.toLowerCase().indexOf(q.toLowerCase());if(i<0)return esc(text.slice(0,140));const a=Math.max(0,i-70),b=Math.min(text.length,i+q.length+90);return (a?"…":"")+esc(text.slice(a,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length,b))+(b<text.length?"…":"")}

function renderThreads(){
  const ps=rangePlans();const weeks=rangeWeeks(ps);
  const rooms=tRoom==="All"?CLASSROOMS:[tRoom];
  const cols=tRoom==="All"&&ps.some(p=>!p.classroom)?[...rooms,""]:rooms;
  const waiting=ps.filter(p=>p.status==="ready").length;
  const withTeam=new Set(ps.filter(p=>p.type==="classroom").map(p=>p.weekOf+p.classroom)).size;
  const inRoom=[...threads.values()].filter(t=>tRoom==="All"||t.classroom===tRoom||!t.classroom);
  const tracked=inRoom.filter(t=>!t.unfollowed).sort((a,b)=>(a.status==="closed")-(b.status==="closed")||(b.lastWeek||"").localeCompare(a.lastWeek||""));
  const yStart=parseIso(schoolYearStart()).getTime();
  const stopped=inRoom.filter(t=>t.unfollowed&&!t.undone).sort((a,b)=>(b.unfollowed.at||0)-(a.unfollowed.at||0));
  const stoppedNow=stopped.filter(t=>(t.unfollowed.at||0)>=yStart),stoppedOld=stopped.filter(t=>(t.unfollowed.at||0)<yStart);
  const scan=scans.get(tRoom);
  let h=`<div class="head"><div class="head-row"><div><span class="eyebrow">Across saved plans</span><h2 style="margin-top:4px">Threads and overview</h2>
    <div class="sub">See what children keep returning to across weeks, groups, and educators, and keep track of the threads worth following.</div></div></div>
    <div class="actions"><div class="filters" style="margin:0">${["All",...CLASSROOMS].map(r=>`<button class="pill" aria-pressed="${r===tRoom}" data-troom="${r}">${r}</button>`).join("")}</div>
    <select id="trange" style="width:auto">${[["4","Last 4 weeks"],["8","Last 8 weeks"],["year","This school year"],["all","All saved plans"]].map(([v,l])=>`<option value="${v}" ${tRange===v?"selected":""}>${l}</option>`).join("")}</select></div></div>
  <div class="stats">
    <div class="stat"><b>${ps.length}</b><span>plans saved in this range</span></div>
    <div class="stat"><b>${withTeam}</b><span>classroom team plans</span></div>
    <div class="stat"><b>${waiting}</b><span>waiting for director review</span></div>
    <div class="stat"><b>${tracked.filter(t=>t.status!=="closed").length}</b><span>threads being followed</span></div>
  </div>`;

  // Threads
  h+=`<section style="display:grid;gap:12px"><div class="secthead"><h2>Threads</h2>
    <span class="actions">${printBtns("threads","","Download threads PDF")}${sample&&isDirector()?`<button class="btn small" id="scan" ${scanBusy||!ps.length?"disabled":""}>${scanBusy?"Reading plans":"Find threads with Claude"}</button>`:""}</span></div>
    <div class="hint muted" style="font-size:13.5px;max-width:72ch">A thread is a question children keep returning to across several sittings or weeks. ${isDirector()?"Claude reads the saved plans in this range, finds the threads, and points to the plans they came from.":"The director asks Claude to read the saved plans and find the threads, which then appear here with the plans they came from."} Follow the ones worth following and they stay here for the whole team.</div>`;
  if(tracked.length)h+=`<div class="chiprow-label">Threads we are following</div><div class="threads">${tracked.map(t=>threadCard(t,true,weeks)).join("")}</div>`;
  if(stoppedNow.length)h+=`<details ${tOpenStopped?"open":""} data-tstopwrap="now"><summary class="chiprow-label" style="cursor:pointer">No longer following, ${stoppedNow.length} this school year</summary><div class="stopped">${stoppedNow.map(t=>stoppedCard(t)).join("")}</div></details>`;
  if(stoppedOld.length)h+=`<details><summary class="chiprow-label" style="cursor:pointer">No longer following, ${stoppedOld.length} from earlier school years</summary><div class="stopped">${stoppedOld.map(t=>stoppedCard(t)).join("")}</div></details>`;
  if(scan&&scan.threads?.length){
    const open=x=>!x.trackedId||!threads.has(x.trackedId)||!!threads.get(x.trackedId).undone;
    const fresh=scan.threads.filter(x=>open(x)&&(!x.dismissed||tShowDismissed));const nDis=scan.threads.filter(x=>open(x)&&x.dismissed).length;
    h+=`<div class="chiprow-label">Found by Claude, ${new Date(scan.createdAt).toLocaleDateString("en-US",{month:"short",day:"numeric"})}, ${esc({"4":"last 4 weeks","8":"last 8 weeks",year:"this school year",all:"all saved plans"}[scan.range]||"")}</div>`;
    if(scan.summary)h+=`<div class="ref" style="background:var(--moss-soft)"><div>${esc(scan.summary)}</div></div>`;
    if(fresh.length)h+=`<div class="threads">${fresh.map((x,i)=>threadCard(x,false,weeks,scan.threads.indexOf(x),scan)).join("")}</div>`;
    else h+=`<div class="empty">${nDis?"Every other thread from the last search is being followed or was dismissed.":"Every thread from the last search is already being followed."}</div>`;
    if(nDis)h+=`<div class="actions"><button class="linkbtn" data-tshowdis="1">${tShowDismissed?"Hide dismissed suggestions":`Show ${nDis} dismissed suggestion${nDis>1?"s":""}`}</button></div>`;
  }else if(!tracked.length)h+=`<div class="empty">${ps.length?(sample?(isDirector()?"No threads found yet. Press Find threads with Claude.":"No threads found yet. The director's next thread search will show here."):"Use Recurring ideas and Search below to spot threads, then follow them in your plans."):"No plans saved in this range yet. Threads appear once educators save a few weeks of plans."}</div>`;
  h+=`</section>`;

  // Planning grid
  const wks=[...weeks].reverse();
  h+=`<section style="display:grid;gap:10px"><div class="secthead"><h2>Planning at a glance</h2><span class="cnt"><span class="dot draft"></span> Draft &nbsp; <span class="dot ready"></span> Ready for review &nbsp; <span class="dot reviewed"></span> Reviewed</span></div>
   <div class="tablewrap"><table class="grid2"><thead><tr><th>Week of</th>${cols.map(r=>`<th>${r||"No classroom set"}</th>`).join("")}</tr></thead><tbody>
   ${wks.length?wks.map(w=>`<tr><td style="white-space:nowrap">${fmtDate(w)}</td>${cols.map(r=>{const rp=ps.filter(p=>p.weekOf===w&&(p.classroom||"")===r);const teams=rp.filter(p=>p.type==="classroom");const team=teams[0];const ns=rp.filter(isGroupPlan).length,ni=rp.filter(p=>p.type==="individual"&&!isGroupPlan(p)).length;const nd=rp.filter(p=>p.dupOf&&plans.has(p.dupOf)).length;
     return `<td><button class="cellbtn" data-cell="${w}|${r}" aria-label="Open ${r||"unassigned"} plans for week of ${fmtDate(w)}">${r?(team?`<span class="dot ${team.status}"></span><span class="cnt">${teams.length>1?teams.length+" team plans":"Team"}</span>`:`<span class="dot"></span><span class="cnt">No team plan</span>`):(teams.length?`<span class="cnt">${teams.length} team</span>`:"")}<span class="cnt">${r||teams.length?"· ":""}${ni} individual · ${ns} small group</span>${nd?`<span class="cnt" style="color:var(--marigold)">· ${nd} possible duplicate${nd>1?"s":""}</span>`:""}</button></td>`}).join("")}</tr>`).join(""):`<tr><td colspan="${cols.length+1}" class="muted">No weeks in this range.</td></tr>`}
   </tbody></table></div></section>`;

  // Recurring ideas
  const rec=recurring(ps);
  h+=`<section style="display:grid;gap:10px"><div class="secthead"><h2>Recurring ideas</h2><span class="cnt">Words and phrases that show up in observations, interests, and threads, with the number of weeks each appears</span></div>
    ${rec.length?`<div class="terms">${rec.map(x=>`<button class="term" data-term="${esc(x.k)}">${esc(x.k)}<small>${x.weeks} wk</small></button>`).join("")}</div>`:`<div class="empty">Recurring ideas appear once a few plans mention the same things.</div>`}</section>`;

  // Search
  h+=`<section style="display:grid;gap:10px"><div class="secthead"><h2>Search all plans</h2></div>
    <input type="text" id="tsearch" placeholder="Search every saved plan. Ex. shadows, Juniper, tunnels, clay" value="${esc(tSearch)}">
    <div id="tresults" style="display:grid;gap:6px"></div></section>`;
  $("#main").innerHTML=h;
  $("#main").querySelectorAll("textarea").forEach(autoGrow);
  renderSearch();
}
function renderSearch(){
  const el=$("#tresults");if(!el)return;const q=tSearch.trim();
  if(q.length<2){el.innerHTML="";return}
  const hits=[...plans.values()].filter(p=>p.id!=="example"&&(tRoom==="All"||p.classroom===tRoom)).map(p=>({p,t:planText(p)})).filter(x=>x.t.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.p.weekOf.localeCompare(a.p.weekOf)).slice(0,40);
  el.innerHTML=hits.length?`<span class="cnt">${hits.length}${hits.length===40?"+":""} plans mention “${esc(q)}”</span>`+hits.map(({p,t})=>`<button class="result" data-open="${p.id}"><span><span class="tag ${p.type}">${FORMS[p.type].short}</span> <b>${esc(planTitle(p))}</b> <span class="cnt">week of ${fmtDate(p.weekOf)}${p.classroom?", "+esc(p.classroom):""}</span></span><span style="font-size:13.5px">${snippet(t.replace(/\s*\n\s*/g," "),q)}</span></button>`).join(""):`<div class="empty">No plans mention “${esc(q)}”.</div>`;
}
let tShowDismissed=false,tOpenStopped=false;
function whoAmI(){return me()||(window.FP_HOSTED&&window.FP_NAME?window.FP_NAME():"")||"An educator"}
function shortDate(ms){return ms?new Date(ms).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):""}
const RANGE_LABEL={"4":"the last 4 weeks",8:"the last 8 weeks",year:"this school year",all:"all saved plans"};
function planWho(p){
  if(p.type==="classroom")return "Classroom team";
  if(p.type==="smallgroup")return [p.group&&p.group+" group",p.educator].filter(Boolean).join(", ");
  const g=p.focus==="smallgroup"&&(p.groups||[]).length?p.groups.join(" and ")+" group"+(p.groups.length>1?"s":""):"";
  return [p.educator,g||(p.where?p.where:"")].filter(Boolean).join(", ");
}
const normQ=x=>String(x||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
// find which section of the plan a quote came from, so every quote says exactly where it lives
function sectionOf(p,text){
  const q=normQ(text);if(!q)return"";const head=q.split(" ").slice(0,6).join(" ");
  const parts=FORMS[p.type].fields.map(f=>[f.label,normQ(p.fields?.[f.k])]);
  if(p.web)parts.push(["Curriculum web",normQ([p.web.focus,...(p.web.branches||[]).map(b=>b.name+" "+b.materials),p.web.questions,p.web.environment].join(" "))]);
  for(const [l,t] of parts)if(t&&t.includes(q))return l;
  for(const [l,t] of parts)if(t&&head.length>8&&t.includes(head))return l;
  return"";
}
function evSource(e){
  const p=plans.get(e.planId);
  if(!p)return `<span class="src">Week of ${fmtDate(e.week)}. This plan has since been deleted</span>`;
  const bits=[FORMS[p.type].name,planWho(p),p.classroom&&p.classroom+" classroom",sectionOf(p,e.text)].filter(Boolean);
  return `<span class="src"><button class="linkbtn" data-open="${p.id}">Week of ${fmtDate(p.weekOf)}</button> · ${bits.map(esc).join(" · ")}</span>`;
}
function originHtml(t,isTracked){
  const ev=[...(t.evidence||[])].sort((a,b)=>(a.week||"").localeCompare(b.week||""));
  const rows=[];
  const first=ev[0];
  if(first){const p=plans.get(first.planId);
    let inPlan="";
    if(p){const room=p.classroom?" in the "+esc(p.classroom)+" classroom":"";
      if(p.type==="classroom")inPlan=`, in the classroom team's Classroom Curriculum Plan${room}`;
      else{const g=p.type==="smallgroup"?p.group:(p.focus==="smallgroup"?(p.groups||[]).join(" and "):"");
        inPlan=`, in ${p.educator?esc(p.educator)+"'s":"an"} ${esc(FORMS[p.type].name)}${g?" for the "+esc(g)+" group":p.where?" about the "+esc(p.where):""}${room}`}}
    rows.push(`<div><b>Started</b>the week of ${fmtDate(first.week)}${inPlan}</div>`)}
  const ps=[...new Map(ev.map(e=>[e.planId,plans.get(e.planId)]).filter(([,p])=>p)).values()];
  if(ps.length){const ct=k=>ps.filter(p=>p.type===k).length;
    const types=[["classroom","Classroom team"],["individual","Individual"],["smallgroup","Small Group"]].map(([k,l])=>ct(k)?`${ct(k)} ${l}`:"").filter(Boolean).join(", ");
    const rooms=[...new Set(ps.map(p=>p.classroom).filter(Boolean))];
    const people=[...new Set(ps.flatMap(p=>p.type==="classroom"?[]:[p.educator,...(p.focus==="smallgroup"?(p.groups||[]).map(g=>g+" group"):[]),p.group&&p.group+" group"]).filter(Boolean))];
    const wks=new Set(ps.map(p=>p.weekOf)).size;
    rows.push(`<div><b>Seen in</b>${ps.length} plan${ps.length>1?"s":""} over ${wks} week${wks>1?"s":""}. ${esc(types)}${rooms.length?". "+esc(rooms.join(" and "))+(rooms.length>1?" classrooms":" classroom"):""}${people.length?". "+esc(people.slice(0,6).join(", "))+(people.length>6?` and ${people.length-6} more`:""):""}</div>`)}
  if(isTracked){
    const how=t.origin?`after Claude found it in ${t.origin.range==="all"||!RANGE_LABEL[t.origin.range]?"all saved plans":"plans from "+RANGE_LABEL[t.origin.range]}${t.origin.room&&t.origin.room!=="All"?" in the "+esc(t.origin.room)+" classroom":" across all classrooms"}`:"";
    rows.push(`<div><b>Followed</b>${t.followedBy?"by "+esc(t.followedBy)+" ":""}on ${shortDate(t.createdAt)}${how?" "+how:""}${t.refollowed?`. Followed again by ${esc(t.refollowed.by)} on ${shortDate(t.refollowed.at)}`:""}</div>`);
  }
  return rows.length?`<div class="origin">${rows.join("")}</div>`:"";
}
function evidenceHtml(t){
  const all=[...(t.evidence||[])].sort((a,b)=>(b.week||"").localeCompare(a.week||""));if(!all.length)return"";
  const line=e=>`<div>“${esc(e.text)}”${evSource(e)}</div>`;
  return `<div class="evid">${all.slice(0,4).map(line).join("")}</div>${all.length>4?`<details><summary class="chiprow-label" style="cursor:pointer">Show ${all.length-4} earlier quote${all.length-4>1?"s":""}</summary><div class="evid" style="margin-top:8px">${all.slice(4).map(line).join("")}</div></details>`:""}`;
}
function threadCard(t,isTracked,weeks,scanIdx,scan){

  let h=`<article class="thread"${isTracked&&t.id?` id="th-${t.id}"`:""}><div class="secthead"><h3>${esc(t.name)}</h3><span class="status st-${t.status||"emerging"}">${TSTATUS[t.status]||"Emerging"}</span></div>`;
  if(t.question)h+=`<div class="q">${esc(t.question)}</div>`;
  h+=originHtml(t,isTracked);
  if(t.classroom||(t.groups||[]).length)h+=`<div class="cnt">${[t.classroom&&t.classroom+" classroom",(t.groups||[]).join(", ")].filter(Boolean).map(esc).join(" · ")}</div>`;

  h+=evidenceHtml(t);
  if(linked.length)h+=`<details${linked.length<=3?" open":""}><summary class="chiprow-label" style="cursor:pointer">${linked.length} plan${linked.length>1?"s":""} connected by educators</summary><div class="evid" style="margin-top:8px">${linked.map(p=>`<div><span class="src"><button class="linkbtn" data-open="${p.id}">Week of ${fmtDate(p.weekOf)}</button> \u00b7 ${[FORMS[p.type].name,planWho(p),p.classroom&&p.classroom+" classroom"].filter(Boolean).map(esc).join(" \u00b7 ")}</span></div>`).join("")}</div></details>`;
  if((t.languages||[]).length)h+=`<div class="chips">${t.languages.map(l=>`<span class="chip on" style="cursor:default">${esc(l)}</span>`).join("")}</div>`;
  if((t.next||[]).length)h+=`<details><summary class="chiprow-label" style="cursor:pointer">Possible next provocations</summary><ul style="margin:6px 0 0;padding-left:18px;font-size:14px">${t.next.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></details>`;
  if(isTracked){
    const pr=projectOfThread(t.id);const openProjects=[...projects.values()].filter(x=>x.status!=="closed");
    if(pr)h+=`<div class="origin"><div><b>Project</b><button class="linkbtn" data-popen="${pr.id}">${esc(pr.name)}</button>${sample&&!t.story?". Its stories are written on the project page.":""}</div></div>`;
    h+=`<div class="actions"><label class="cnt">Status <select data-tstatus="${t.id}" style="width:auto">${Object.entries(TSTATUS).map(([k,v])=>`<option value="${k}" ${t.status===k?"selected":""}>${v}</option>`).join("")}</select></label></div>
      <textarea data-tnotes="${t.id}" rows="2" placeholder="Team notes on this thread">${esc(t.notes||"")}</textarea>
      <div class="actions">${printBtns("thread",t.id,"Thread PDF")}<button class="btn small ghost" data-tplan="${t.id}">Start an Individual Plan from it</button>
      ${pr?"":`<button class="btn small ghost" data-pstart="${t.id}">Start a project from it</button>${openProjects.length?`<select data-padd="${t.id}" style="width:auto;max-width:100%" aria-label="Add this thread to a project"><option value="">Add to a project</option>${openProjects.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select>`:""}`}
      ${sample&&(!pr||t.story)?`<span id="tsrw-${t.id}"><button class="btn small ghost" data-tstory="${t.id}" ${storyBusy[t.id]?"disabled":""}>${storyBusy[t.id]?"Writing":t.story?"Rewrite project story":"Write project story"}</button></span>`:""}
      ${t.story?`${printBtns("tstory",t.id,"Project story PDF",true)}<span id="tsrm-${t.id}"><button class="linkbtn" data-tstoryrm="${t.id}">Remove story</button></span>`:""}
      <span id="tstop-${t.id}"><button class="linkbtn" data-tstop="${t.id}">Stop following</button></span>
      <span id="tundo-${t.id}"><button class="linkbtn" data-tundo="${t.id}">Undo follow</button></span></div>`;
    if(t.story)h+=`<details><summary class="chiprow-label" style="cursor:pointer">Project story, for family evenings and colleagues</summary><div class="story" style="margin-top:8px">${STORY.map(([k,l])=>`<label class="fld-label">${l}<textarea data-tstoryf="${t.id}|${k}" rows="2">${esc(t.story[k]||"")}</textarea></label>`).join("")}</div></details>`;
  }else{

/* ---------- Plans connected to followed threads ---------- */
// a plan is connected to a followed thread when it was started from it, when the thread quotes it, or when an educator connected it by hand
const PLAN_TYPES=["classroom","individual","smallgroup"];
function planThreads(p){
  if(!p||p.blank||p.id==="example"||!PLAN_TYPES.includes(p.type))return[];
  const off=new Set(p.threadOff||[]),out=[],seen=new Set();
  const add=(t,how,link)=>{if(!t||t.unfollowed||off.has(t.id)||seen.has(t.id))return;seen.add(t.id);out.push({t,how,link})};
  if(p.threadId)add(threads.get(p.threadId),"started");
  for(const l of p.threadLinks||[])add(threads.get(l.id),"hand",l);
  for(const t of threads.values())if((t.evidence||[]).some(e=>e.planId===p.id))add(t,"quoted");
  return out;
}
// plans educators tied to a thread themselves, beyond the ones the thread already quotes
function threadLinkedPlans(t){
  const ev=new Set((t.evidence||[]).map(e=>e.planId));
  return [...plans.values()].filter(p=>p.id!=="example"&&!ev.has(p.id)&&!(p.threadOff||[]).includes(t.id)&&(p.threadId===t.id||(p.threadLinks||[]).some(l=>l.id===t.id))).sort((a,b)=>b.weekOf.localeCompare(a.weekOf));
}
function threadsLine(p){return planThreads(p).map(c=>{const pr=projectOfThread(c.t.id);return c.t.name?c.t.name+(pr&&pr.name?" (project "+pr.name+")":""):""}).filter(Boolean).join("  \u2022  ")}
function threadsNoteHtml(p){
  if(!p||p.id==="example")return"";
  const cs=planThreads(p);const on=new Set(cs.map(c=>c.t.id));
  const rest=[...threads.values()].filter(t=>t&&!t.unfollowed&&!on.has(t.id)).sort((a,b)=>((b.classroom===p.classroom)-(a.classroom===p.classroom))||(b.lastWeek||"").localeCompare(a.lastWeek||""));
  let h=cs.map(({t,how,link})=>{
    const why=how==="started"?"This plan was started from the thread.":how==="quoted"?"The thread quotes this plan.":link.carried?"Carried forward from last week's plan.":`Connected by ${esc(link.by||"an educator")}${link.at?" on "+shortDate(link.at):""}.`;
    const elsewhere=t.classroom&&p.classroom&&t.classroom!==p.classroom?` Followed in the ${esc(t.classroom)} classroom.`:"";
    return `<section class="ref" style="background:var(--marigold-soft)"><b style="color:var(--marigold)">Following the thread ${esc(t.name)}</b>${t.question?`<div>${esc(t.question)}</div>`:""}
      ${(pr=>pr?`<div>Part of the project <button class="linkbtn" data-popen="${pr.id}">${esc(pr.name)}</button></div>`:"")(projectOfThread(t.id))}
      ${(t.evidence||[]).filter(e=>e.planId!==p.id).slice(cs.length>1?-1:-3).map(e=>`<div class="muted">\u201c${esc(e.text)}\u201d ${fmtDate(e.week)}</div>`).join("")}
      <div class="muted">${why}${elsewhere}</div>
      <div class="actions"><button class="linkbtn" data-tsee="${t.id}">See the thread</button><button class="linkbtn" data-tunlink="${t.id}">Disconnect from this plan</button></div></section>`}).join("");
  if(rest.length)h+=`<label class="tlink">${cs.length?"Connect another thread we are following":"Connect this plan to a thread we are following"}<select id="m-thread"><option value="">Choose a thread</option>${rest.map(t=>`<option value="${t.id}">${esc(t.name)}${t.classroom?" \u00b7 "+esc(t.classroom):""}</option>`).join("")}</select></label>`;
  return h;
}
function linkThread(p,id){

function unlinkThread(p,id){

function digest(ps){
  const keys={classroom:["observation","intentions","interests","indoor","outdoor","brainstorm"],individual:["area","observation","intent","questions","remarks"],smallgroup:["thread","intention","questions","reflection"]};
  return ps.sort((a,b)=>b.weekOf.localeCompare(a.weekOf)).slice(0,140).map(p=>{const o={id:p.id,week:p.weekOf,type:FORMS[p.type].short,classroom:p.classroom||"",who:p.type==="smallgroup"?(p.group||"")+" group":p.type==="individual"?(p.educator||""):"team",text:{}};
    (keys[p.type]||[]).forEach(k=>{const v=(p.fields?.[k]||"").trim();if(v)o.text[k]=v.slice(0,450)});
    if(p.web&&(p.web.focus||p.web.branches?.some(b=>b.name)))o.text.web=[p.web.focus,...p.web.branches.map(b=>b.name)].filter(Boolean).join("; ");
    const fol=planThreads(p).filter(c=>c.how!=="quoted").map(c=>c.t.id);if(fol.length)o.follows=fol;
    return o}).filter(o=>Object.keys(o.text).length);
}
function capDigest(d,max){const out=[];let n=0;for(const x of d){const l=JSON.stringify(x).length+1;if(n+l>max)break;out.push(x);n+=l}return out}
async function findThreads(){

  if(d.length<full.length)toast(`Reading the ${d.length} most recent plans. Choose a shorter range or one classroom to include older ones.`);

  const tracked=[...threads.values()].filter(t=>t.status!=="closed"&&(tRoom==="All"||t.classroom===tRoom||!t.classroom)).map(t=>({id:t.id,name:t.name,question:t.question}));
  const prompt=`You are reading saved curriculum plans from ${tRoom==="All"?"all classrooms":"the "+tRoom+" classroom"} at Fulton Community School & Farm, weeks ${rangeWeeks(ps)[0]} to ${mondayOf(new Date())}.

${STYLE}
Return JSON {"summary": two or three sentences on the overall picture of children's thinking in this range, "threads":[{"name": 3 to 7 words naming what children keep returning to, "question": the educators' hypothesis about what children may be asking, written as one sentence that begins with the words Children may be asking, never phrased in a child's voice, "classroom": "West" or "North" or "South" or "", "groups": [flower group names involved, only if named], "status": "emerging" or "growing" or "deepening" or "resting" (resting means not seen in the latest two weeks), "weeks": [week ids from the plans], "evidence": [{"planId": id, "week": week id, "text": exact words from that plan, under 25 words}], "languages": [only from ${JSON.stringify(langList())}], "next": [2 to 4 possible provocations or environment changes grounded in the evidence, naming specific materials], "trackedId": "", "relatedProject": ""}]}

Plans, one JSON object per line.
${d.map(x=>JSON.stringify(x)).join("\n")}`;
  try{

      th.next=x.next.length?x.next:th.next;th.languages=[...new Set([...(th.languages||[]),...x.languages])];saveThread(th)}
    saveScan({room:tRoom,range:tRange,createdAt:Date.now(),summary:clean2(out?.summary),threads:ths});
    toast(ths.length?`Found ${ths.length} thread${ths.length>1?"s":""}.`:"No threads with enough evidence yet.");
  }catch(err){toast(assistError(err?.code||"unknown"))}
  scanBusy=false;renderMain();
}

function findDup(p){
  const mine=wordSet(planText(p));
  // one team plan per classroom per week; individual plans only match on nearly identical writing, since an educator may write several in a week
  const sameSlot=x=>!p.importNoDate&&p.type==="classroom"&&x.type==="classroom"&&x.weekOf===p.weekOf&&!!p.classroom&&x.classroom===p.classroom;
  const sameText=x=>{if(mine.size<12)return false;const o=wordSet(planText(x));if(o.size<12)return false;let n=0;for(const w of mine)if(o.has(w))n++;return n/Math.max(mine.size,o.size)>=.85};
  let best=null;
  for(const x of plans.values()){if(x.id===p.id||x.id==="example"||x.id===p.notDupOf||x.dupOf===p.id||x.id===p.prevId||x.prevId===p.id)continue;if(sameText(x))return x;if(!best&&sameSlot(x))best=x}

}

  if(tp==="classroom"&&out?.web&&typeof out.web==="object"){const w=out.web;const empty=!p.web.focus&&!p.web.branches.some(b=>b.name);

  ${lensSettingsHtml()}
  <section class="card"><div class="lbl">Small groups</div><div class="hint">Each group's classroom and lead educator. An educator can lead more than one group.</div>
    <div class="tablewrap"><table class="grid2" style="min-width:480px"><thead><tr><th>Group</th><th>Classroom</th><th>Educator</th><th></th></tr></thead><tbody>
    ${GROUPS.map((g,i)=>`<tr><td><input type="text" data-gname="${i}" value="${esc(g.name)}"></td><td><select data-groom="${i}"><option value="">None</option>${CLASSROOMS.map(r=>`<option ${g.room===r?"selected":""}>${r}</option>`).join("")}</select></td>
      <td><select data-ged="${i}"><option value="">Not set</option>${[...new Set([...names,g.educator].filter(Boolean))].map(n=>`<option ${g.educator===n?"selected":""}>${esc(n)}</option>`).join("")}</select></td><td><button class="linkbtn" data-gdel="${i}">Remove</button></td></tr>`).join("")}
    </tbody></table></div>
    <div class="actions"><input type="text" id="g-new" placeholder="New group name" style="width:200px"><button class="btn small" id="g-add">Add group</button></div></section>
  <section class="card"><div class="lbl">Educators</div><div class="hint">Names offered on plans and used to read handwriting on uploaded plans.</div><div class="roster" id="roster"></div></section>
  <section class="card"><div class="lbl">Spaces</div><div class="hint">Suggested places where small groups meet, indoors and outdoors.</div>
    <div class="chips">${chipList(PLACES,"data-pdel")}</div>
    <div class="actions"><input type="text" id="p-new" placeholder="Add a space" style="width:220px"><button class="btn small" id="p-add">Add</button></div></section>
  <section class="card"><div class="lbl">Classroom areas</div><div class="hint">Offered on the Individual plan when the focus is a classroom area.</div>
    <div class="chips">${chipList(AREAS,"data-adel")}</div>
    <div class="actions"><input type="text" id="a-new" placeholder="Add a classroom area" style="width:220px"><button class="btn small" id="a-add">Add</button></div></section>
  <section class="card"><div class="lbl">Languages of expression</div><div class="hint">Offered on every plan and the curriculum web. Educators can add others on any plan, and those are offered to everyone afterward.</div>
    <div class="chips">${chipList(LANGUAGES,"data-ldel")}</div>
    <div class="actions"><input type="text" id="l-new" placeholder="Add a language of expression" style="width:240px"><button class="btn small" id="l-add">Add</button></div></section>
  <section class="card"><div class="lbl">Materials library</div><div class="hint">Tap-to-add materials on the plans, grouped by kind.</div>
    ${Object.entries(MATERIALS).map(([cat,list])=>`<div style="display:grid;gap:6px;border-top:1px solid var(--line);padding-top:8px"><div class="secthead"><b>${esc(cat)}</b><button class="linkbtn" data-mcatdel="${esc(cat)}">Remove group</button></div>
      <div class="chips">${list.map((m,i)=>`<span class="rname">${esc(m)}<button data-mdel="${esc(cat)}|${i}" aria-label="Remove ${esc(m)}">&times;</button></span>`).join("")}</div>
      <div class="actions"><input type="text" data-madd-in="${esc(cat)}" placeholder="Add to ${esc(cat)}" style="width:200px"><button class="btn small ghost" data-madd="${esc(cat)}">Add</button></div></div>`).join("")}
    <div class="actions" style="border-top:1px solid var(--line);padding-top:8px"><input type="text" id="mc-new" placeholder="New material group" style="width:200px"><button class="btn small" id="mc-add">Add group</button></div></section>

  <div class="actions"><span id="resetwrap"><button class="linkbtn" id="prog-reset">Restore the original lists</button></span></div>`;
  $("#main").innerHTML=h;renderRoster();
}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t||view!=="settings")return;
  const val=sel=>{const el=document.querySelector(sel);const v=(el?.value||"").trim();return v};
  if(t.id==="g-add"){const n=val("#g-new");if(!n){toast("Type a group name first.");return}if(GROUPS.some(g=>g.name.toLowerCase()===n.toLowerCase())){toast("That group already exists.");return}GROUPS.push({name:n,room:"",educator:""});saveProgram();renderSettings();return}
  if(t.dataset.gdel!=null){GROUPS.splice(+t.dataset.gdel,1);saveProgram();renderSettings();return}
  if(t.id==="p-add"){const n=val("#p-new");if(n&&!PLACES.includes(n)){PLACES.push(n);saveProgram()}renderSettings();return}
  if(t.dataset.pdel!=null){PLACES.splice(+t.dataset.pdel,1);saveProgram();renderSettings();return}
  if(t.id==="a-add"){const n=val("#a-new");if(n&&!AREAS.some(x=>x.toLowerCase()===n.toLowerCase())){AREAS.push(n);saveProgram()}renderSettings();return}
  if(t.dataset.adel!=null){AREAS.splice(+t.dataset.adel,1);saveProgram();renderSettings();return}
  if(t.id==="l-add"){const n=val("#l-new");if(n&&!LANGUAGES.some(x=>x.toLowerCase()===n.toLowerCase())){LANGUAGES.push(n);saveProgram()}renderSettings();return}
  if(t.dataset.ldel!=null){LANGUAGES.splice(+t.dataset.ldel,1);saveProgram();renderSettings();return}
  if(t.dataset.mdel){const [c,i]=t.dataset.mdel.split("|");MATERIALS[c].splice(+i,1);saveProgram();renderSettings();return}
  if(t.dataset.madd){const c=t.dataset.madd;const n=(document.querySelector(`[data-madd-in="${CSS.escape(c)}"]`)?.value||"").trim();if(n&&!MATERIALS[c].includes(n)){MATERIALS[c].push(n);saveProgram()}renderSettings();return}
  if(t.dataset.mcatdel){delete MATERIALS[t.dataset.mcatdel];saveProgram();renderSettings();return}
  if(t.id==="mc-add"){const n=val("#mc-new");if(n&&!MATERIALS[n]){MATERIALS[n]=[];saveProgram()}renderSettings();return}
  if(t.dataset.sdel){const [se,i]=t.dataset.sdel.split("|");SEASONS[se].splice(+i,1);saveProgram();renderSettings();return}
  if(t.dataset.sadd){const se=t.dataset.sadd;const n=(document.querySelector(`[data-sadd-in="${se}"]`)?.value||"").trim();if(n){(SEASONS[se]=SEASONS[se]||[]).push(n);saveProgram()}renderSettings();return}
  if(t.id==="prog-reset"){$("#resetwrap").innerHTML=`<span class="confirm">Replace all lists with the originals? <button class="btn warn small" id="prog-reset-yes">Restore</button><button class="linkbtn" id="prog-reset-no">Keep mine</button></span>`;return}
  if(t.id==="prog-reset-no"){renderSettings();return}
  if(t.id==="prog-reset-yes"){applyProgram(JSON.parse(JSON.stringify(PDEF)));saveProgram();renderSettings();toast("Original lists restored.");return}
});
document.addEventListener("change",e=>{if(view!=="settings")return;const t=e.target;
  if(t.dataset.gname!=null){const n=t.value.trim();if(n){GROUPS[+t.dataset.gname].name=n;saveProgram()}return}
  if(t.dataset.groom!=null){GROUPS[+t.dataset.groom].room=t.value;saveProgram();return}
  if(t.dataset.ged!=null){GROUPS[+t.dataset.ged].educator=t.value;saveProgram();return}
});
document.addEventListener("keydown",e=>{if(view!=="settings"||e.key!=="Enter")return;const t=e.target;
  const map={"g-new":"#g-add","p-new":"#p-add","mc-new":"#mc-add"};
  if(map[t.id]){e.preventDefault();$(map[t.id]).click()}
  if(t.dataset.maddIn!=null){e.preventDefault();document.querySelector(`[data-madd="${CSS.escape(t.dataset.maddIn)}"]`).click()}
  if(t.dataset.saddIn!=null){e.preventDefault();document.querySelector(`[data-sadd="${t.dataset.saddIn}"]`).click()}
});

$("#me").addEventListener("change",()=>{renderDue();if(view!=="plans"||!currentId)setTimeout(renderMain,0)});
boot();
</script>

</body>
</html>

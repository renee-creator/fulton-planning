  const groups=[];let cur=null;j.aside=[];
  for(const {u,c} of cls){
    if(c.form==="blank"||c.form==="other"){j.aside.push({u,n:c.n,form:c.form});cur=c.form==="blank"?cur:null;continue}
    const fresh=!cur||c.newPlan||(c.form&&cur.form&&c.form!==cur.form)||cur.items.length>=maxPages;
    if(fresh){cur={items:[],form:c.form,classroom:c.classroom,group:c.group,educator:c.educator,weekOf:c.weekOf,first:c.n,last:c.n};groups.push(cur)}
    cur.items.push(u);cur.last=c.n;cur.form=cur.form||c.form;cur.classroom=cur.classroom||c.classroom;cur.group=cur.group||c.group;cur.educator=cur.educator||c.educator;cur.weekOf=cur.weekOf||c.weekOf;
  }
  const at=jobs.indexOf(j)+1;
  const made=groups.map(g=>{const who=g.form==="smallgroup"?(g.group?g.group+" group":""):g.form==="individual"?g.educator:"";
    return {id:uid(),items:g.items,name:[g.form?FORMS[g.form].name:"Plan",g.classroom,who].filter(Boolean).join(", ")+`, page${g.first===g.last?" "+g.first:"s "+g.first+" to "+g.last}`,status:"waiting",planIds:[],error:"",type:g.form||importType,targetId:"",batch:false,meta:{classroom:g.classroom,group:g.group,educator:g.educator,weekOf:g.weekOf}}});
  jobs.splice(at,0,...made);
  j.progress=`Found ${groups.length} plan${groups.length===1?"":"s"} in ${pages.length} pages.`;
  j.name=`Sorted ${pages.length} scanned page${pages.length===1?"":"s"}`;
  j.cls=null;
}
function schoolSummary(){
  const ps=jobs.flatMap(j=>j.planIds).map(id=>plans.get(id)).filter(Boolean);if(ps.length<2)return"";
  const rooms=[...CLASSROOMS,""].map(r=>{const rp=ps.filter(p=>(p.classroom||"")===r);if(!rp.length)return"";const c=k=>rp.filter(p=>p.type===k).length;
    return `<div class="stat"><b>${rp.length}</b><span>${r?esc(r):"Classroom not found"}. ${c("classroom")} team, ${c("individual")} individual, ${c("smallgroup")} small group</span></div>`}).join("");
  const nodate=ps.filter(p=>p.importNoDate).length;
  return `<div class="stats">${rooms}</div>${nodate?`<span class="nudge" style="justify-self:start">${nodate} plan${nodate>1?"s have":" has"} no week written. They are filed under the week of ${fmtDate(week)} until you set the date.</span>`:""}`;
}

/* ---------- All plans ---------- */
let aRoom="All",aType="all",aStatus="all",aQ="";
function allFiltered(){
  const q=aQ.trim().toLowerCase();
  return [...plans.values()].filter(p=>p.id!=="example"&&(aRoom==="All"||(aRoom==="none"?!p.classroom:p.classroom===aRoom))&&(aType==="all"||p.type===aType)&&
    (aStatus==="all"||(aStatus==="dup"?!!(p.dupOf&&plans.has(p.dupOf)):aStatus==="due"?needsRemarks(p):aStatus==="done"?p.status==="ready"||p.status==="reviewed":p.status===aStatus))&&
    (!q||[planTitle(p),p.educator,p.group,p.classroom,planText(p)].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>b.weekOf.localeCompare(a.weekOf)||(a.classroom||"~").localeCompare(b.classroom||"~")||a.type.localeCompare(b.type));
}
function filledCount(p){const F=FORMS[p.type];return F.fields.filter(f=>(p.fields?.[f.k]||"").trim()).length+"/"+F.fields.length}
function renderAllPlans(){
  const ps=allFiltered();const all=[...plans.values()].filter(p=>p.id!=="example");
  const c=k=>all.filter(p=>k==="done"?p.status==="ready"||p.status==="reviewed":p.status===k).length;
  let h=`<div class="head"><div><span class="eyebrow">Every saved plan</span><h2 style="margin-top:4px">All plans</h2>
    <div class="sub">Every plan from every week and classroom. Filter, open any plan, or download the ones shown as one PDF.</div></div></div>
    <div class="stats"><div class="stat"><b>${all.length}</b><span>plans saved</span></div><div class="stat"><b>${c("done")}</b><span>completed, ready or reviewed</span></div><div class="stat"><b>${c("ready")}</b><span>waiting for review</span></div><div class="stat"><b>${c("draft")}</b><span>still in draft</span></div></div>
    <section class="card" style="gap:10px">
      <div class="filters" style="margin:0">${[["All","All classrooms"],["West","West"],["North","North"],["South","South"],["none","No classroom"]].map(([v,l])=>`<button class="pill" aria-pressed="${aRoom===v}" data-aroom="${v}">${l}</button>`).join("")}</div>
      <div class="actions">
        <select id="atype" style="width:auto">${[["all","All forms"],["classroom","Classroom"],["individual","Individual"],["smallgroup","Small group"]].map(([v,l])=>`<option value="${v}" ${aType===v?"selected":""}>${l}</option>`).join("")}</select>
        <select id="astatus" style="width:auto">${[["all","Any status"],["done","Completed"],["ready","Ready for review"],["reviewed","Reviewed"],["draft","Draft"],["due","Final remarks due"],["dup","Possible duplicates"]].map(([v,l])=>`<option value="${v}" ${aStatus===v?"selected":""}>${l}</option>`).join("")}</select>
        <input type="text" id="aq" placeholder="Search by educator, group, or any word" value="${esc(aQ)}" style="flex:1;min-width:200px">
      </div>
      <div class="actions" style="justify-content:space-between"><span class="cnt" id="acount">${ps.length} plan${ps.length===1?"":"s"} shown</span><span class="actions"><button class="btn small" id="adl" ${ps.length?"":"disabled"}>Download these as one PDF</button><button class="btn small ghost" id="adlw" ${ps.length?"":"disabled"}>As one Word file</button></span></div>
    </section><div id="alist" style="display:grid;gap:14px">${allListHtml(ps)}</div>`;
  $("#main").innerHTML=h;
}
function allListHtml(ps){
  if(!ps.length)return `<div class="empty">No plans match these filters.</div>`;
  const weeks=[...new Set(ps.map(p=>p.weekOf))];
  return weeks.map(w=>{const wp=ps.filter(p=>p.weekOf===w);return `<section style="display:grid;gap:6px"><div class="chiprow-label">Week of ${fmtDate(w)} · ${wp.length} plan${wp.length===1?"":"s"}</div>
    <div class="tablewrap"><table class="grid2" style="table-layout:fixed"><colgroup><col style="width:130px"><col><col style="width:130px"><col style="width:130px"><col style="width:160px"></colgroup><thead><tr><th>Form</th><th>Plan</th><th>Classroom</th><th>Sections filled</th><th>Status</th></tr></thead><tbody>
    ${wp.map(p=>`<tr><td><span class="tag ${p.type}">${FORMS[p.type].short}</span></td><td><button class="linkbtn" data-open="${p.id}" style="text-align:left">${esc(planTitle(p))}</button>${p.importNoDate?' <span class="cnt">no date found</span>':""}${p.dupOf&&plans.has(p.dupOf)?' <span class="status" style="color:var(--marigold);border-color:var(--marigold)">May be a duplicate</span>':""}${needsRemarks(p)?' <span class="status" style="color:var(--clay);border-color:var(--clay)">Final remarks due</span>':""}</td><td>${esc(p.classroom||"Not set")}</td><td class="cnt">${filledCount(p)}</td><td><span class="status ${p.status}">${STATUS[p.status]||"Draft"}</span></td></tr>`).join("")}
    </tbody></table></div></section>`}).join("");
}
function refreshAll(){const ps=allFiltered();$("#alist").innerHTML=allListHtml(ps);$("#acount").textContent=`${ps.length} plan${ps.length===1?"":"s"} shown`;$("#adl").disabled=!ps.length;$("#adlw").disabled=!ps.length}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t||view!=="all")return;
  if(t.dataset.aroom){aRoom=t.dataset.aroom;renderAllPlans()}
  if(t.id==="adlw"){const ps=allFiltered();if(ps.length)makeDocx(ps,`Fulton plans ${aRoom==="All"?"all classrooms":aRoom} ${mondayOf(new Date())}.docx`);return}
  if(t.id==="adl"){const ps=allFiltered();if(ps.length)makePdf(ps,`Fulton plans ${aRoom==="All"?"all classrooms":aRoom} ${mondayOf(new Date())}.pdf`)}});
document.addEventListener("change",e=>{if(view!=="all")return;if(e.target.id==="atype"){aType=e.target.value;refreshAll()}if(e.target.id==="astatus"){aStatus=e.target.value;refreshAll()}});
document.addEventListener("input",e=>{if(view==="all"&&e.target.id==="aq"){aQ=e.target.value;refreshAll()}});

/* ---------- Program settings ---------- */
function applyProgram(v){
  if(Array.isArray(v.groups))GROUPS=v.groups.filter(g=>g&&g.name).map(g=>({name:String(g.name),room:g.room||"",educator:g.educator||""}));
  if(Array.isArray(v.places))PLACES=v.places.filter(Boolean);
  if(v.materials&&typeof v.materials==="object")MATERIALS=v.materials;
  if(v.seasons&&typeof v.seasons==="object")SEASONS=Object.assign({Fall:[],Winter:[],Spring:[]},v.seasons);
  GNAMES=new Set(GROUPS.flatMap(g=>g.name.toLowerCase().split(" ")));
  fillPlaceList();
}
function fillPlaceList(){const dl=$("#placelist");if(dl)dl.innerHTML=PLACES.map(x=>`<option value="${esc(x)}">`).join("")}
let progTimer=null;
function saveProgram(){
  const v={groups:GROUPS,places:PLACES,materials:MATERIALS,seasons:SEASONS,updatedAt:Date.now()};
  LS.set("fps.program",v);GNAMES=new Set(GROUPS.flatMap(g=>g.name.toLowerCase().split(" ")));fillPlaceList();
  clearTimeout(progTimer);progTimer=setTimeout(()=>{if(db)db.doc("settings/program").set(JSON.parse(JSON.stringify(v))).then(()=>setConn("Settings saved")).catch(()=>toast("Could not save settings. Check your connection."))},500);
}
function chipList(items,delAttr){return items.map((x,i)=>`<span class="rname">${esc(x)}<button ${delAttr}="${i}" aria-label="Remove ${esc(x)}">&times;</button></span>`).join("")}
function renderSettings(){
  if(!isDirector()){$("#main").innerHTML=`<div class="empty">Program settings are managed by the director.</div>`;return}
  const names=rosterNames();
  let h=`<div class="head"><div><span class="eyebrow">For the director</span><h2 style="margin-top:4px">Program settings</h2>
    <div class="sub">The lists the app offers as choices and suggestions. Change them whenever the program changes. Plans already written keep their wording, and educators can always type their own.</div></div></div>
  <section class="card"><div class="lbl">Small groups</div><div class="hint">Each group's classroom and lead educator. An educator can lead more than one group.</div>
    <div class="tablewrap"><table class="grid2" style="min-width:480px"><thead><tr><th>Group</th><th>Classroom</th><th>Educator</th><th></th></tr></thead><tbody>
    ${GROUPS.map((g,i)=>`<tr><td><input type="text" data-gname="${i}" value="${esc(g.name)}"></td><td><select data-groom="${i}"><option value="">None</option>${CLASSROOMS.map(r=>`<option ${g.room===r?"selected":""}>${r}</option>`).join("")}</select></td>
      <td><select data-ged="${i}"><option value="">Not set</option>${[...new Set([...names,g.educator].filter(Boolean))].map(n=>`<option ${g.educator===n?"selected":""}>${esc(n)}</option>`).join("")}</select></td><td><button class="linkbtn" data-gdel="${i}">Remove</button></td></tr>`).join("")}
    </tbody></table></div>
    <div class="actions"><input type="text" id="g-new" placeholder="New group name" style="width:200px"><button class="btn small" id="g-add">Add group</button></div></section>
  <section class="card"><div class="lbl">Educators</div><div class="hint">Names offered on plans and used to read handwriting on uploaded plans.</div><div class="roster" id="roster"></div></section>
  <section class="card"><div class="lbl">Spaces</div><div class="hint">Suggested places for small groups and classroom areas.</div>
    <div class="chips">${chipList(PLACES,"data-pdel")}</div>
    <div class="actions"><input type="text" id="p-new" placeholder="Add a space" style="width:220px"><button class="btn small" id="p-add">Add</button></div></section>
  <section class="card"><div class="lbl">Materials library</div><div class="hint">Tap-to-add materials on the plans, grouped by kind.</div>
    ${Object.entries(MATERIALS).map(([cat,list])=>`<div style="display:grid;gap:6px;border-top:1px solid var(--line);padding-top:8px"><div class="secthead"><b>${esc(cat)}</b><button class="linkbtn" data-mcatdel="${esc(cat)}">Remove group</button></div>
      <div class="chips">${list.map((m,i)=>`<span class="rname">${esc(m)}<button data-mdel="${esc(cat)}|${i}" aria-label="Remove ${esc(m)}">&times;</button></span>`).join("")}</div>
      <div class="actions"><input type="text" data-madd-in="${esc(cat)}" placeholder="Add to ${esc(cat)}" style="width:200px"><button class="btn small ghost" data-madd="${esc(cat)}">Add</button></div></div>`).join("")}
    <div class="actions" style="border-top:1px solid var(--line);padding-top:8px"><input type="text" id="mc-new" placeholder="New material group" style="width:200px"><button class="btn small" id="mc-add">Add group</button></div></section>
  <section class="card"><div class="lbl">Seasonal concepts</div><div class="hint">Offered loosely in the Curriculum brainstorm for the current season.</div>
    ${["Fall","Winter","Spring"].map(se=>`<div style="display:grid;gap:6px;border-top:1px solid var(--line);padding-top:8px"><b>${se}</b><div class="chips">${(SEASONS[se]||[]).map((c,i)=>`<span class="rname">${esc(c)}<button data-sdel="${se}|${i}" aria-label="Remove ${esc(c)}">&times;</button></span>`).join("")}</div>
      <div class="actions"><input type="text" data-sadd-in="${se}" placeholder="Add a ${se.toLowerCase()} concept" style="width:220px"><button class="btn small ghost" data-sadd="${se}">Add</button></div></div>`).join("")}</section>
  <div class="actions"><span id="resetwrap"><button class="linkbtn" id="prog-reset">Restore the original lists</button></span></div>`;
  $("#main").innerHTML=h;renderRoster();
}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t||view!=="settings")return;
  const val=sel=>{const el=document.querySelector(sel);const v=(el?.value||"").trim();return v};
  if(t.id==="g-add"){const n=val("#g-new");if(!n){toast("Type a group name first.");return}if(GROUPS.some(g=>g.name.toLowerCase()===n.toLowerCase())){toast("That group already exists.");return}GROUPS.push({name:n,room:"",educator:""});saveProgram();renderSettings();return}
  if(t.dataset.gdel!=null){GROUPS.splice(+t.dataset.gdel,1);saveProgram();renderSettings();return}
  if(t.id==="p-add"){const n=val("#p-new");if(n&&!PLACES.includes(n)){PLACES.push(n);saveProgram()}renderSettings();return}
  if(t.dataset.pdel!=null){PLACES.splice(+t.dataset.pdel,1);saveProgram();renderSettings();return}
  if(t.dataset.mdel){const [c,i]=t.dataset.mdel.split("|");MATERIALS[c].splice(+i,1);saveProgram();renderSettings();return}
  if(t.dataset.madd){const c=t.dataset.madd;const n=(document.querySelector(`[data-madd-in="${CSS.escape(c)}"]`)?.value||"").trim();if(n&&!MATERIALS[c].includes(n)){MATERIALS[c].push(n);saveProgram()}renderSettings();return}
  if(t.dataset.mcatdel){delete MATERIALS[t.dataset.mcatdel];saveProgram();renderSettings();return}
  if(t.id==="mc-add"){const n=val("#mc-new");if(n&&!MATERIALS[n]){MATERIALS[n]=[];saveProgram()}renderSettings();return}
  if(t.dataset.sdel){const [se,i]=t.dataset.sdel.split("|");SEASONS[se].splice(+i,1);saveProgram();renderSettings();return}
  if(t.dataset.sadd){const se=t.dataset.sadd;const n=(document.querySelector(`[data-sadd-in="${se}"]`)?.value||"").trim();if(n){(SEASONS[se]=SEASONS[se]||[]).push(n);saveProgram()}renderSettings();return}
  if(t.id==="prog-reset"){$("#resetwrap").innerHTML=`<span class="confirm">Replace all lists with the originals? <button class="btn warn small" id="prog-reset-yes">Restore</button><button class="linkbtn" id="prog-reset-no">Keep mine</button></span>`;return}
  if(t.id==="prog-reset-no"){renderSettings();return}
  if(t.id==="prog-reset-yes"){applyProgram(JSON.parse(JSON.stringify(PDEF)));saveProgram();renderSettings();toast("Original lists restored.");return}
});
document.addEventListener("change",e=>{if(view!=="settings")return;const t=e.target;
  if(t.dataset.gname!=null){const n=t.value.trim();if(n){GROUPS[+t.dataset.gname].name=n;saveProgram()}return}
  if(t.dataset.groom!=null){GROUPS[+t.dataset.groom].room=t.value;saveProgram();return}
  if(t.dataset.ged!=null){GROUPS[+t.dataset.ged].educator=t.value;saveProgram();return}
});
document.addEventListener("keydown",e=>{if(view!=="settings"||e.key!=="Enter")return;const t=e.target;
  const map={"g-new":"#g-add","p-new":"#p-add","mc-new":"#mc-add"};
  if(map[t.id]){e.preventDefault();$(map[t.id]).click()}
  if(t.dataset.maddIn!=null){e.preventDefault();document.querySelector(`[data-madd="${CSS.escape(t.dataset.maddIn)}"]`).click()}
  if(t.dataset.saddIn!=null){e.preventDefault();document.querySelector(`[data-sadd="${t.dataset.saddIn}"]`).click()}
});

$("#me").addEventListener("change",()=>{renderDue();if(view!=="plans"||!currentId)setTimeout(renderMain,0)});
boot();
</script>

</body>

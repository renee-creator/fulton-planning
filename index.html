<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5a43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planning">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Fulton Planning Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout. A garden-shed clipboard. Sidebar of the week's plans, a working form on the right, paper-like field cards. */
:root{
  --bg:#f3f5ef; --paper:#fffffb; --ink:#22332a; --muted:#5d6e63; --line:#d5ddd2;
  --moss:#2f5a43; --moss-soft:#e3ece4; --marigold:#c47a06; --marigold-soft:#fbefd8;
  --clay:#a24f35; --clay-soft:#f6e3dc; --sky:#2f6a86; --sky-soft:#e0edf3;
  --focus:#c47a06;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a16; --paper:#1c241f; --ink:#e6ece6; --muted:#9fb0a5; --line:#33413a;
  --moss:#8cc4a2; --moss-soft:#24352b; --marigold:#f0b44a; --marigold-soft:#3a2e17;
  --clay:#e59a80; --clay-soft:#3b2620; --sky:#86c1dc; --sky-soft:#1d3039; --focus:#f0b44a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a16; --paper:#1c241f; --ink:#e6ece6; --muted:#9fb0a5; --line:#33413a;
  --moss:#8cc4a2; --moss-soft:#24352b; --marigold:#f0b44a; --marigold-soft:#3a2e17;
  --clay:#e59a80; --clay-soft:#3b2620; --sky:#86c1dc; --sky-soft:#1d3039; --focus:#f0b44a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:14px 60px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:6px 16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{display:flex;flex-direction:column;gap:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{font-size:26px;font-weight:700;color:var(--moss);line-height:1.1}
.top .spacer{flex:1}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who label{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
@media (max-width:900px){.side{position:static}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:600;margin-bottom:10px}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav .wk{flex:1;text-align:center;font-family:var(--display);font-weight:500;font-size:16px}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:8px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{background:var(--moss-soft)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:var(--paper)}
.newbtns{display:grid;gap:8px}
.newbtn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;cursor:pointer}
.newbtn:hover{border-color:var(--moss)}
.newbtn b{font-weight:600}
.newbtn span{font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:4px}
.group-h{font-size:12px;color:var(--muted);font-weight:600;margin-top:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid transparent;background:transparent;text-align:left;border-radius:8px;padding:7px 8px;cursor:pointer;width:100%}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--moss-soft);border-color:var(--line)}
.item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 6px}
.tag.classroom{background:var(--moss-soft);color:var(--moss)}
.tag.individual{background:var(--sky-soft);color:var(--sky)}
.tag.smallgroup{background:var(--marigold-soft);color:var(--marigold)}
.status{font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.status.ready{border-color:var(--marigold);color:var(--marigold)}
.status.reviewed{border-color:var(--moss);color:var(--moss)}
.empty{color:var(--muted);font-size:13.5px;padding:6px 2px}
.nav{flex-wrap:wrap;border-radius:20px}
@media (max-width:520px){.navx{display:none}div.nav button{padding:6px 9px;font-size:13.5px}}
.pcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px;align-items:start}
.pcol{display:grid;gap:10px;min-width:0}
.pthread{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;font-size:14px;background:var(--bg);min-width:0}
.lq{margin:0;padding-left:20px;display:grid;gap:3px;font-size:15px}
.lmoments{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.lmoment{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;font-size:14px;min-width:0;align-content:start}
.lmoment .src{display:block;font-size:12px;color:var(--muted)}
.lmoment .src button{font-size:12px}
.lans{margin:4px 0 0;display:grid;gap:2px;font-size:13.5px}
.lans dt{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:6px}
.lans dd{margin:0}
.pdir{display:grid;gap:5px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.proom{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.proom:first-of-type{border-top:none;padding-top:0}
.tlink{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.tlink select{width:auto;max-width:100%;flex:1 1 220px}
.linkbtn{background:none;border:none;padding:0;color:var(--moss);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13.5px}
.btn{border:1px solid var(--moss);background:var(--moss);color:var(--paper);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--moss)}
.btn.warn{background:transparent;color:var(--clay);border-color:var(--clay)}
.btn:disabled{opacity:.5;cursor:default}
.btn.small{padding:5px 10px;font-size:13px}
input[type=text],input[type=date],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
textarea{resize:vertical;line-height:1.55;min-height:84px}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.head{display:flex;flex-direction:column;gap:12px}
.head-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between}
.head h2{font-size:30px;font-weight:700;line-height:1.1}
.head .sub{color:var(--muted);font-size:14px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.meta label,.fld-label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:transparent;padding:6px 12px;cursor:pointer;font-size:13.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--moss);color:var(--paper)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.savestate{font-size:12.5px;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .lbl{font-family:var(--display);font-weight:500;font-size:18px}
.card .hint{color:var(--muted);font-size:13.5px;max-width:72ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--line);background:var(--bg);border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--moss);border-style:solid}
.chip.on{background:var(--moss-soft);border-style:solid;border-color:var(--moss);color:var(--moss)}
.chiprow-label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.cardfoot{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.nudge{font-size:13px;color:var(--clay);background:var(--clay-soft);border-radius:6px;padding:3px 9px}
.nudge.ok{color:var(--moss);background:var(--moss-soft)}
.ex{font-size:13.5px;border-left:3px solid var(--moss);background:var(--bg);padding:8px 12px;border-radius:0 6px 6px 0;display:grid;gap:4px}
.ex .weak{color:var(--clay)}
.ex b{font-weight:600}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.two{grid-template-columns:minmax(0,1fr)}}
.ai{background:var(--marigold-soft);border:1px solid color-mix(in srgb,var(--marigold) 40%,transparent);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ai .lbl{font-family:var(--display);font-weight:500;font-size:18px}
.ai p{margin:0;font-size:13.5px;color:var(--muted)}
.ref{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--sky-soft);font-size:14px;display:grid;gap:4px}
.ref b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sky)}
.webwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px}
@media (max-width:1100px){.webwrap{grid-template-columns:minmax(0,1fr)}}
.branch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)}
.branch textarea{min-height:52px}
.svgbox{border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow-x:auto}
.svgbox svg{display:block;width:100%;min-width:420px;height:auto}
.conn{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.conn select{width:auto;flex:1;min-width:120px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;background:var(--clay-soft);border-radius:8px;padding:6px 10px;font-size:13.5px;flex-wrap:wrap}
.welcome{display:grid;gap:14px}
.welcome .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.welcome .step{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.welcome .step h3{font-size:17px;margin-bottom:4px}
.welcome .step p{margin:0;color:var(--muted);font-size:14px}
.review{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.muted{color:var(--muted)}

.nav{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--paper)}
.nav button{border:none;background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.nav button[aria-pressed="true"]{background:var(--moss);color:var(--paper)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:700;color:var(--moss);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.main section,.main>div{min-width:0}
.tablewrap{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table.grid2{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
.grid2 th,.grid2 td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.grid2 th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.grid2 tr:last-child td{border-bottom:none}
.cellbtn{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border:none;background:transparent;padding:2px;cursor:pointer;text-align:left}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);display:inline-block}
.dot.draft{border-color:var(--muted);background:transparent}
.dot.ready{border-color:var(--marigold);background:var(--marigold)}
.dot.reviewed{border-color:var(--moss);background:var(--moss)}
.cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.thread{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;min-width:0}
.thread h3{font-size:19px;font-weight:500}
.thread .q{font-size:15px;color:var(--ink)}
.tl{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.tl i{width:12px;height:12px;border-radius:3px;background:var(--bg);border:1px solid var(--line);display:inline-block}
.tl i.on{background:var(--moss);border-color:var(--moss)}
.evid{font-size:13.5px;display:grid;gap:8px;border-left:3px solid var(--line);padding-left:10px}
.evid .src{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.evid .src button{font-size:12px}
.origin{display:grid;gap:3px;font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px}
.origin b{font-weight:600;margin-right:4px}
.stopped{display:grid;gap:10px;margin-top:8px}
.stopped .thread{background:transparent}
.st-emerging{border-color:var(--sky);color:var(--sky)}
.st-growing{border-color:var(--marigold);color:var(--marigold)}
.st-deepening{border-color:var(--moss);color:var(--moss)}
.st-resting,.st-closed{border-color:var(--line);color:var(--muted)}
.threads{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px}
.terms{display:flex;flex-wrap:wrap;gap:6px}
.term{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.term small{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.result{display:grid;gap:2px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:9px 12px;text-align:left;cursor:pointer;width:100%}
.result:hover{border-color:var(--moss)}
.result mark{background:var(--marigold-soft);color:inherit;border-radius:2px}
.secthead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between}
.secthead h2{font-size:22px;font-weight:500}
.story{display:grid;gap:8px}
.drop{border:2px dashed var(--line);border-radius:var(--r);background:var(--paper);padding:22px 16px;display:grid;gap:8px;justify-items:center;text-align:center}
.drop.over{border-color:var(--moss);background:var(--moss-soft)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumb{position:relative;width:120px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:6px;display:grid;gap:4px;font-size:12px}
.thumb img{width:100%;height:120px;object-fit:cover;border-radius:4px;background:var(--bg)}
.thumb .doc{height:120px;display:grid;place-items:center;background:var(--bg);border-radius:4px;color:var(--muted);font-weight:600}
.thumb button{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer}
.thumb button.thumbact{position:static;width:auto;height:auto;border-radius:6px;padding:5px 6px;font-size:12px;font-weight:600;color:var(--ink)}
.sugg{border:1px solid color-mix(in srgb,var(--marigold) 45%,transparent);background:var(--marigold-soft);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.sugg b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--marigold)}
.sugg .err{color:var(--clay)}
.due{display:grid;gap:4px}
.due .item{grid-template-columns:minmax(0,1fr) auto}
.roster{display:grid;gap:6px}
.rname{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px;background:var(--bg)}
.rname button{border:none;background:transparent;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 4px}
.radio{display:flex;gap:8px;align-items:flex-start;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="eyebrow">Fulton Community School &amp; Farm</span><h1>Planning Studio</h1></div>
    <div class="nav" role="group" aria-label="View"><button data-view="plans">Plans</button><button data-view="all">All plans</button><button data-view="threads">Threads<span class="navx"> and overview</span></button><button data-view="projects">Projects</button><button data-view="lens">Lens</button></div>
    <div class="spacer"></div>
    <div class="who">
      <label for="me">Educator</label>
      <input id="me" type="text" list="educators" placeholder="Your name" style="width:170px">
      <span class="savestate" id="conn">Connecting</span>
    </div>
  </header>

  <div class="grid">
    <aside class="side">
      <section class="panel">
        <h3>Week of</h3>
        <div class="weeknav">
          <button class="iconbtn" id="prevwk" aria-label="Previous week">&#8249;</button>
          <div class="wk" id="wklabel"></div>
          <button class="iconbtn" id="nextwk" aria-label="Next week">&#8250;</button>
        </div>
        <div class="filters" id="filters"></div>
      </section>
      <section class="panel">
        <h3>Start a plan</h3>
        <div class="newbtns">
          <button class="newbtn" data-new="classroom"><b>Classroom Curriculum Plan</b><span>Together as a team, weekly, with the curriculum web</span></button>
          <button class="newbtn" data-new="individual"><b>Individual Curriculum Plan</b><span>Your small group or an area of the classroom</span></button>
          <button class="newbtn" id="importbtn" style="border-style:dashed"><b>Upload a plan or photo</b><span>Transcribe a paper, PDF, or Word plan into the app</span></button>
        </div>
      </section>
      <section class="panel" id="fbpanel" hidden>
        <h3 style="color:var(--moss)" id="fbtitle">Feedback from the director</h3>
        <div class="due" id="fblist"></div>
      </section>
      <section class="panel" id="duepanel" hidden>
        <h3 style="color:var(--clay)">Final remarks due</h3>
        <div class="due" id="due"></div>
      </section>
      <section class="panel">
        <h3>This week's plans</h3>
        <div class="list" id="list"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">

<div id="gate" hidden>

    <svg width="34" height="34" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 28V15M15 15c-4-1-7-4-8-8M15 15c4-1 7-4 8-8M15 19c-3 0-5-2-6-4M15 19c3 0 5-2 6-4M15 11V3" fill="none" stroke="var(--moss)" stroke-width="1.8" stroke-linecap="round"/><path d="M7 28h16" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"/></svg>
    <div><div class="eyebrow">Fulton Community School &amp; Farm</div><h1>Planning Studio</h1></div>

<script>
"use strict";
/* Connects Planning Studio to its server on Render.
   Plans live in a private GitHub repository behind that server. */
(function(){
  const qs=new URLSearchParams(location.search);
  // only the school's own server, or a local test server when the page itself is opened locally
  const DEFAULT_SERVER="https://fulton-planning.onrender.com";
  const want=(qs.get("server")||"").replace(/\/+$/,"");
  const local=/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(want);
  const SERVER= local? want : DEFAULT_SERVER;
  const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
  const Auth={token:LS.get("fp-token"), name:LS.get("fp-name"), director:LS.get("fp-director")==="1"};
  const Store={data:{plans:{},threads:{},scans:{},settings:{},projects:{}}, rev:0, bootId:"", listeners:new Set(), ready:null, fileKey:"", wroteAt:{}};
  window.FP_HOSTED=true;
  window.FP_NAME=()=>Auth.name||"";
  window.FP_DIRECTOR=()=>!!Auth.director;

  function gateMsg(t,bad){ const m=document.getElementById("gate-msg"); if(m){ m.textContent=t||""; m.className="msg "+(bad?"bad":"muted"); } }
  function signOut(){ Auth.token=null; Auth.name=null; LS.set("fp-token",null); LS.set("fp-name",null); LS.set("fp-director",null); location.reload(); }
  window.FP_SIGN_OUT=signOut;

  async function api(path, body, signal){
    let r;
    const payload=JSON.stringify(body||{});
    // while the page is closing, let the last save finish in the background
    const keepalive=document.visibilityState==="hidden" && payload.length<60000;
    try{ r=await fetch(SERVER+path,{method:"POST",signal,keepalive,headers:{"Content-Type":"application/json",...(Auth.token?{Authorization:"Bearer "+Auth.token}:{})},body:payload}); }
    catch(e){ if(e&&e.name==="AbortError") throw {code:"cancelled"}; throw {code:"unavailable", message:"The Planning Studio server could not be reached. Check your internet connection and try again."}; }
    let j={}; try{ j=await r.json(); }catch(e){}
    if(r.status===401 && path!=="/login"){ signOut(); throw {code:"session_expired", message:j.error}; }
    if(r.status===429) throw {code:"rate_limited", message:j.error};
    if(r.status===403) throw {code:"not_allowed", status:403, message:j.error};
    if(r.status===413) throw {code:"too_big", status:413, message:j.error};
    if(!r.ok) throw {code:r.status>=500?"server_error":"bad_request", status:r.status, message:j.error||("The server answered "+r.status+".")};
    return j;
  }
  function notify(){ for(const l of [...Store.listeners]) try{ l(); }catch(e){ console.error(e); } }
  function saveBanner(msg, warn){ let b=document.getElementById("save-banner"); if(!msg){ if(b) b.remove(); return; } if(!b){ b=document.createElement("div"); b.id="save-banner"; b.setAttribute("role","alert"); b.style.cssText=(warn?"background:#8a5a00;":"background:var(--danger);")+"color:#fff;padding:10px 16px;font-weight:600;text-align:center"; document.body.prepend(b); } b.textContent=warn? msg : msg+" Plans can still be read, but nothing new is saved until this is fixed."; b.style.background=warn?"#8a5a00":"var(--danger)"; }
  async function loadAll(){ const j=await api("/api/data"); saveBanner(j.saveError||j.saveWarn, !j.saveError); if(j.fileKey) Store.fileKey=j.fileKey; Store.data={plans:{},threads:{},scans:{},settings:{},projects:{},...j.data}; Store.rev=j.rev; Store.bootId=j.bootId; if(typeof j.director==="boolean"){ Auth.director=j.director; LS.set("fp-director",j.director?"1":null); } notify(); }
  let polling=false;
  /* stop checking for changes after 10 quiet minutes, so a forgotten open tab lets the free server sleep */
  const IDLE_MS=10*60*1000; let lastActive=Date.now(), idle=false;
  function noteActive(){ lastActive=Date.now(); if(idle){ idle=false; poll(); } }
  ["pointerdown","keydown","input","wheel","touchstart"].forEach(ev=>window.addEventListener(ev,noteActive,{passive:true,capture:true}));
  async function poll(){
    if(Date.now()-lastActive>IDLE_MS){ idle=true; return; }
    if(document.hidden || !Auth.token || polling) return;
    polling=true; const sent=Date.now();
    try{
      const j=await api("/api/changes",{since:Store.rev, bootId:Store.bootId});
      if(j.reload){ await loadAll(); return; }
      let any=false;
      for(const [kind,docs] of Object.entries(j.changes||{})) for(const [id,doc] of Object.entries(docs)){
        if((Store.wroteAt[kind+"/"+id]||0)>=sent) continue;   // this browser saved it after the check left, so its copy is newer
        any=true; Store.data[kind]=Store.data[kind]||{}; if(doc) Store.data[kind][id]=doc; else delete Store.data[kind][id]; }
      if(j.rev>Store.rev) Store.rev=j.rev; if(j.fileKey) Store.fileKey=j.fileKey; saveBanner(j.saveError||j.saveWarn, !j.saveError); if(any) notify();
    }catch(e){} finally{ polling=false; }
  }

  /* wake the server, which sleeps after 15 quiet minutes on Render's free plan */
  async function wake(){
    const t0=Date.now(); let tries=0;
    while(Date.now()-t0<150000){
      try{ const r=await fetch(SERVER+"/health",{cache:"no-store"}); if(r.ok){ const j=await r.json(); if(j.ready) return true; if(j.error){ gateMsg(j.error,true); return false; } } }catch(e){}
      tries++; gateMsg(tries<2? "Connecting…" : "Waking the server. The first visit after a quiet stretch takes about a minute.");
      await new Promise(r=>setTimeout(r, tries<3?2000:4000));
    }
    gateMsg("The server did not wake up. Try again in a minute.",true); return false;
  }
  // used by the app to wake the server quietly before retrying a Claude request
  window.FP_WAKE=async function(){ const t0=Date.now(); while(Date.now()-t0<120000){ try{ const r=await fetch(SERVER+"/health",{cache:"no-store"}); if(r.ok){ const j=await r.json(); if(j.ready) return true; } }catch(e){} await new Promise(r=>setTimeout(r,4000)); } return false; };
  function showGate(){
    const g=document.getElementById("gate"); g.hidden=false;
    const f=document.getElementById("gate-form"), b=document.getElementById("gate-btn"), c=document.getElementById("gate-code");
    setTimeout(()=>c.focus(),50);
    return new Promise(resolve=>{
      f.onsubmit=async e=>{ e.preventDefault(); b.disabled=true; b.textContent="Signing in…";
        try{ if(!(await wake())) throw {message:""}; const j=await api("/login",{passcode:c.value}); Auth.token=j.token; Auth.name=j.name; Auth.director=!!j.director; LS.set("fp-token",j.token); LS.set("fp-name",j.name); LS.set("fp-director",j.director?"1":null); g.hidden=true; resolve(); }
        catch(err){ if(err.message) gateMsg(err.message,true); b.disabled=false; b.textContent="Sign in"; c.select(); } };
    });
  }
  async function start(){
    if(!Auth.token) await showGate();
    else { const g=document.getElementById("gate"); g.hidden=false; document.getElementById("gate-form").style.display="none"; const note=document.createElement("p"); note.className="muted"; note.id="gate-wait"; g.append(note);
      const t=setTimeout(()=>{ note.textContent="Waking the server. The first visit after a quiet stretch takes about a minute."; },2500);
      const ok=await wake(); clearTimeout(t); if(!ok){ note.textContent="The Planning Studio server could not be reached. Reload the page to try again."; note.style.color="var(--danger)"; throw new Error("down"); }
      g.hidden=true; document.getElementById("gate-form").style.display=""; note.remove(); }
    await loadAll();
    setInterval(poll, 15000);
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) noteActive(); });
    const top=document.querySelector(".who");
    if(top){ const w=document.createElement("div"); w.className="who-chip"; w.innerHTML=`<span></span><button class="btn small ghost" type="button">Sign out</button>`; w.firstChild.textContent=(Auth.name||"")+(Auth.director?", director":""); w.lastChild.onclick=signOut; top.append(w); }
  }
  Store.ready=start();

  function snap(id,d){ return {id, exists:!!d, data:()=>d?JSON.parse(JSON.stringify(d)):undefined, metadata:{fromCache:false,hasPendingWrites:false}}; }
  function query(kind){
    const q={ limit(){return q}, where(){return q}, orderBy(){return q},
      onSnapshot(next){ const fire=()=>{ const docs=Object.entries(Store.data[kind]||{}).map(([id,d])=>snap(id,d)); next({docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}}); }; Store.listeners.add(fire); setTimeout(fire,0); return ()=>Store.listeners.delete(fire); },
      async get(){ const docs=Object.entries(Store.data[kind]||{}).map(([id,d])=>snap(id,d)); return {docs,size:docs.length,empty:!docs.length}; },
      doc(id){ return docRef(kind+"/"+id); } };
    return q;
  }
  function docRef(path){
    const [kind,id]=path.split("/");
    const write=async(op,extra)=>{ const r=await api("/api/write",{op,kind,id,...extra}); Store.wroteAt[kind+"/"+id]=Date.now(); Store.data[kind]=Store.data[kind]||{}; if(r.doc) Store.data[kind][id]=r.doc; else delete Store.data[kind][id]; notify(); return r.doc; };
    return { id, path,
      async get(){ return snap(id, Store.data[kind]?.[id]); },
      onSnapshot(next){ const fire=()=>next(snap(id, Store.data[kind]?.[id])); Store.listeners.add(fire); setTimeout(fire,0); return ()=>Store.listeners.delete(fire); },
      set:(data)=>write("set",{data}), create:(data)=>write("create",{data}), update:(patch)=>write("update",{patch}), delete:()=>write("delete",{}) };
  }
  const db={ collection:query, doc:docRef };
  const user={ id:async()=>Auth.name, can:async()=>true, canEdit:()=>!!Auth.director, isOwner:()=>!!Auth.director, profiles:async(ids)=>Object.fromEntries((ids||[]).map(i=>[i,{name:i}])) };

  function blobToJpegB64(blob, max=1800){
    return new Promise(async(resolve,reject)=>{
      try{ const bmp=await createImageBitmap(blob); const s=Math.min(1,max/Math.max(bmp.width,bmp.height)); const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*s); cv.height=Math.round(bmp.height*s);
        const c=cv.getContext("2d"); c.fillStyle="#fff"; c.fillRect(0,0,cv.width,cv.height); c.drawImage(bmp,0,0,cv.width,cv.height);
        cv.toBlob(b=>{ const fr=new FileReader(); fr.onload=()=>resolve(String(fr.result).split(",")[1]); fr.onerror=reject; fr.readAsDataURL(b); },"image/jpeg",.85); }
      catch(e){ reject({code:"image_rejected"}); }
    });
  }
  function blobToB64(blob){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]); fr.onerror=rej; fr.readAsDataURL(blob); }); }
  function looseJson(t){ t=String(t||"").trim(); try{ return JSON.parse(t); }catch(e){} const f=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(f){ try{ return JSON.parse(f[1]); }catch(e){} } const a=t.indexOf("{"), b=t.lastIndexOf("}"); if(a>=0&&b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e){} } return undefined; }
  async function ask(input, opts={}){
    if(opts.signal?.aborted) throw {code:"cancelled"};
    const content=[]; const imgs=opts.images? (Array.isArray(opts.images)?opts.images:[...(opts.images.length!=null&&!(opts.images instanceof Blob)?opts.images:[opts.images])]) : [];
    for(const b of imgs) content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:await blobToJpegB64(b, opts.maxSide||1800)}});
    const text=typeof input==="string"? input : (input||[]).map(t=>t.content).join("\n\n");
    content.push({type:"text",text});
    const j=await api("/api/read",{content, careful:!!opts.careful||opts.modelTier==="complex", purpose:opts.purpose||""}, opts.signal);
    return j;
  }
  const sample=Object.assign(async(input,opts)=>{ const j=await ask(input,opts); return {text:j.text, truncated:!!j.truncated, modelTierApplied:"default"}; }, {
    limits:async()=>({maxPromptBytes:262144, images:{maxCount:5, maxInputBytes:20e6, mediaTypes:["image/jpeg","image/png","image/webp","image/gif"]}}),
    json:async(input,opts)=>{ const j=await ask(input,opts); const v=looseJson(j.text); if(v===undefined) throw {code:j.truncated?"truncated":"invalid_json", text:j.text}; return v; }
  });
  const downloads={ async save({filename,data}){ const blob=data instanceof Blob? data : new Blob([data]); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); return {status:"saved"}; } };
  const caps={db,user,sample,downloads};
  window.claude={ use:async(name)=>{ await Store.ready; return caps[name]||null; } };
  window.addEventListener("pagehide",()=>{ try{ if(Auth.token) navigator.sendBeacon && fetch(SERVER+"/api/save-now",{method:"POST",keepalive:true,headers:{"Content-Type":"application/json",Authorization:"Bearer "+Auth.token},body:"{}"}); }catch(e){} });
})();
</script>

function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return iso(x)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseIso(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parseIso(s);d.setDate(d.getDate()+n);return iso(d)}
function fmtDate(s){if(!s)return"";return parseIso(s).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}
function uid(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function me(){return $("#me").value.trim()}
function isDirector(){return window.FP_HOSTED?!!(window.FP_DIRECTOR&&window.FP_DIRECTOR()):true}
function blankWeb(){return{focus:"",branches:[{name:"",materials:""},{name:"",materials:""},{name:"",materials:""}],connections:[],languages:[],questions:"",environment:""}}

function newPlan(type,extra={}){
  const p={id:uid(),type,weekOf:week,classroom:roomFilter!=="All"?roomFilter:(LS.get("fps.myroom","")||""),educator:me(),group:"",setting:[],session:"Morning",languages:[],docplan:[],
    fields:{},status:"draft",feedback:"",prevId:"",createdAt:Date.now(),updatedAt:Date.now()};
  if(type==="classroom")p.web=blankWeb();
  if(type==="smallgroup"){const g=GROUPS.find(g=>(g.educator||"").toLowerCase()===me().toLowerCase());if(g){p.group=g.name;p.classroom=g.room}}
  if(type==="individual"){const g=me()&&GROUPS.find(g=>(g.educator||"").toLowerCase()===me().toLowerCase());p.focus=g?"smallgroup":"area";p.groups=g?[g.name]:[];p.where="";if(g&&!p.classroom)p.classroom=g.room}
  return Object.assign(p,extra);
}

async function boot(){

  PDEF=PROGRAM_DEFAULTS();
  {const pr=LS.get("fps.program",null);if(pr)applyProgram(pr)}

  for(const x of LS.get("fps.projects",[]))projects.set(x.id,x);
  renderAll();
  if(!window.claude||!window.claude.use){setConn("Saving on this device");return}
  const [d,s,dl]=await Promise.all([claude.use("db").catch(()=>null),claude.use("sample").catch(()=>null),claude.use("downloads").catch(()=>null)]);
  sample=s;downloads=dl;
  if(window.FP_HOSTED&&!$("#me").value&&window.FP_NAME){$("#me").value=window.FP_NAME();LS.set("fps.me",$("#me").value)}
  {const pb=document.querySelector('[data-view="settings"]');if(pb)pb.closest(".panel").hidden=!isDirector()}
  if(sample){try{const lim=await sample.limits();imgLimit=lim?.images?.maxCount||0}catch(e){imgLimit=0}}
  if(d){
    db=d;setConn(window.FP_HOSTED?"Saved to the school's records":"Shared with your team");
    plans=new Map();
    db.collection("plans").onSnapshot(snap=>{
      const next=new Map();serverIds=new Set(snap.docs.map(d=>d.id));
      snap.docs.forEach(doc=>{const v=doc.data();if(!v||deletedIds.has(doc.id))return;const loc=plans.get(doc.id);
        next.set(doc.id,(loc&&(pendingSaves.has(doc.id)||((loc.updatedAt||0)>=(v.updatedAt||0)&&Date.now()-(loc.updatedAt||0)<60000)))?loc:v)});
      for(const [id,loc] of plans)if(!next.has(id)&&!deletedIds.has(id)&&id!=="example"&&(id===currentId||pendingSaves.has(id)||Date.now()-(loc.updatedAt||0)<30000))next.set(id,loc);
      const before=currentId&&plans.get(currentId),after=currentId&&next.get(currentId);
      const remoteChangedCurrent=!!(before&&after&&after!==before&&(after.updatedAt||0)>(before.updatedAt||0));
      plans=next;renderList();if(view==="all"&&$("#alist"))refreshAll();
      if(!dupSweepDone&&snap.docs.length){dupSweepDone=true;setTimeout(sweepDuplicates,1500)}
      if(remoteChangedCurrent&&!document.activeElement?.closest?.("#main"))renderMain();
    },()=>setConn("Offline. Changes stay on this device"));
    db.doc("settings/program").onSnapshot(snap=>{const v=snap.exists?snap.data():null;if(v){applyProgram(v);LS.set("fps.program",v);if(view==="settings"&&!document.activeElement?.closest?.("#main"))renderSettings();else if(view!=="settings"&&!document.activeElement?.closest?.("#main"))renderMain()}},()=>{});
    db.doc("settings/educators").onSnapshot(snap=>{const v=snap.exists?snap.data():null;if(v&&Array.isArray(v.names)){roster=v.names.filter(r=>r&&r.name);renderRoster();fillEducatorList();if(view==="plans"&&!document.activeElement?.closest?.("#main"))renderMain()}},()=>{});
    db.collection("threads").onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>{const v=d.data();if(v)m.set(d.id,v)});threads=m;if((view==="threads"||view==="plans")&&!document.activeElement?.closest?.("#main"))renderMain()},()=>{});
    db.collection("projects").onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>{const v=d.data();if(v)m.set(d.id,v)});projects=m;if((view==="projects"||view==="threads"||view==="plans")&&!document.activeElement?.closest?.("#main"))renderMain()},()=>{});
    db.collection("scans").onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>{const v=d.data();if(v)m.set(d.id,v)});scans=m;if(((view==="threads"&&!scanBusy)||(view==="lens"&&!lensBusy))&&!document.activeElement?.closest?.("#main"))renderMain()},()=>{});
  }else setConn("Saving on this device");
  renderAll();
}
const pendingSaves=new Set(),deletedIds=new Set();let serverIds=new Set();
function isEmptyPlan(p){
  if(Object.values(p.fields||{}).some(v=>String(v||"").trim()))return false;
  const w=p.web;if(w&&(String(w.focus||"").trim()||(w.branches||[]).some(b=>(b.name||"").trim()||(b.materials||"").trim())||String(w.questions||"").trim()||String(w.environment||"").trim()))return false;
  if(String(p.feedback||"").trim()||String(p.familyUpdate||"").trim()||p.importedFrom)return false;
  return true;
}
function pruneEmpty(){for(const [id,p] of plans)if(id!==currentId&&id!=="example"&&isEmptyPlan(p)&&!serverIds.has(id)&&!pendingSaves.has(id))plans.delete(id)}
function persist(p){
  p.updatedAt=Math.max(Date.now(),(p.updatedAt||0)+1);plans.set(p.id,p);
  if(p.type==="individual")flowRemarks(p);
  if(isEmptyPlan(p)&&!serverIds.has(p.id)){setConn("Saves once you write something");return}
  pendingSaves.add(p.id);dirty=true;
  setConn("Saving");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flushSaves,700);
}
async function flushSaves(){
  saveTimer=null;const ids=[...pendingSaves];
  if(!db){LS.set("fps.local",[...plans.values()].filter(x=>x.id!=="example"&&!isEmptyPlan(x)));ids.forEach(id=>pendingSaves.delete(id));dirty=false;setConn("Saved on this device");return}
  let ok=true;
  for(const id of ids){const p=plans.get(id);if(!p){pendingSaves.delete(id);continue}const stamp=p.updatedAt;
    try{await db.doc("plans/"+id).set(JSON.parse(JSON.stringify(p)));if((plans.get(id)?.updatedAt||0)<=stamp)pendingSaves.delete(id)}catch(e){ok=false}}
  dirty=pendingSaves.size>0;
  if(!ok){setConn("Not saved. Check your connection");clearTimeout(saveTimer);saveTimer=setTimeout(flushSaves,5000)}
  else if(dirty){clearTimeout(saveTimer);saveTimer=setTimeout(flushSaves,300)}
  else setConn("Saved and shared");
}
async function removePlan(id){
  deletedIds.add(id);pendingSaves.delete(id);plans.delete(id);
  if(db){try{await db.doc("plans/"+id).delete()}catch(e){toast(e?.message||"Could not delete. Try again.")}}
  else LS.set("fps.local",[...plans.values()]);
  if(currentId===id)currentId=null;renderAll();
}

}
function askDelete2(wrap,id){

}

function planTitle(p){

function dueList(){const m=me().toLowerCase();const all=[...plans.values()].filter(needsRemarks);const mine=m?all.filter(p=>(p.educator||"").toLowerCase().includes(m)||[p.group,...(p.groups||[])].some(n=>(GROUPS.find(g=>g.name===n)?.educator||"").toLowerCase()===m)):[];return {list:(m&&mine.length?mine:all).sort((a,b)=>b.weekOf.localeCompare(a.weekOf)),mineOnly:!!(m&&mine.length),total:all.length}}

/* Individual and small group plans flow into the Classroom plan. Educators write their Individual plans on Monday, then the team writes the Classroom plan with them in view. */
const eduKey=x=>String(x||"").trim().toLowerCase();
function teamSources(p){
  if(!p.classroom)return [];
  return [...plans.values()].filter(x=>x.id!=="example"&&(x.type==="individual"||x.type==="smallgroup")&&x.weekOf===p.weekOf&&x.classroom===p.classroom&&!isEmptyPlan(x)&&!(x.dupOf&&plans.has(x.dupOf)))
    .sort((a,b)=>(a.educator||"").localeCompare(b.educator||""));
}
// who wrote an Individual plan in this classroom last week, so the team can see who is still to come; it never holds the Classroom plan back
function teamReadiness(p,src){
  const last=addDays(p.weekOf,-7);const names=new Map();
  for(const x of plans.values())if(x.id!=="example"&&(x.type==="individual"||x.type==="smallgroup")&&x.weekOf===last&&x.classroom===p.classroom&&eduKey(x.educator)&&!isEmptyPlan(x))names.set(eduKey(x.educator),x.educator.trim());
  const have=new Set(src.map(x=>eduKey(x.educator)).filter(Boolean));
  for(const x of src)if(eduKey(x.educator))names.set(eduKey(x.educator),x.educator.trim());
  const missing=[...names.keys()].filter(k=>!have.has(k)).map(k=>names.get(k));
  return {expected:names.size,written:[...names.keys()].filter(k=>have.has(k)).length,missing};
}
function teamSourceText(src){
  return src.map(x=>{const g=isGroupPlan(x)?(x.type==="smallgroup"?x.group:(x.groups||[]).join(" and ")):"";
    const f=x.fields||{};const parts=x.type==="smallgroup"?[["Thread",f.thread],["Intention",f.intention]]:[["Area exploration",f.area],["Observation rationale",f.observation],["Intent",f.intent],["Possible activities and materials",f.materials]];
    return `${x.educator||"An educator"}${g?", "+g+" group":x.where?", "+x.where:""}. `+parts.filter(([,v])=>String(v||"").trim()).map(([l,v])=>`${l}. ${String(v).trim().slice(0,700)}`).join(" ");}).join("\n");
}
function teamSourcesHtml(p){
  if(!p.classroom)return `<section class="ref"><b>This week's Individual plans</b><div class="muted">Choose the classroom above to see this week's Individual and small group plans here.</div></section>`;
  const src=teamSources(p);const r=teamReadiness(p,src);
  const line=r.expected?`${r.written} of ${r.expected} Individual plans for this week are written.${r.missing.length?` Still to come, ${r.missing.map(esc).join(", ")}. The team can plan without them and add their thinking later.`:""}`:`${src.length} Individual plan${src.length===1?"":"s"} written for this week.`;
  const cut=(t,n)=>{t=String(t||"").trim();return t.length>n?esc(t.slice(0,n))+"…":esc(t)};
  return `<details class="ref" ${src.length?"open":""}><summary style="cursor:pointer"><b>This week's Individual plans, ${esc(p.classroom)} classroom</b></summary>
    <div style="margin-top:6px">${line}</div>
    ${src.length?`<div style="display:grid;gap:8px;margin-top:8px">${src.map(x=>{const g=isGroupPlan(x)?(x.type==="smallgroup"?x.group:(x.groups||[]).join(" and "))+" group":(x.where||"");const f=x.fields||{};
      return `<div style="background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:3px;font-size:13.5px;min-width:0"><span><b style="font-weight:600">${esc(x.educator||"An educator")}</b>${g?` <span class="cnt">${esc(g)}</span>`:""} <button class="linkbtn" data-open="${x.id}">Open</button></span>
        ${(f.area||f.thread)?`<span><span class="muted">${x.type==="smallgroup"?"Thread":"Area exploration"}.</span> ${cut(f.area||f.thread,200)}</span>`:""}
        ${f.observation?`<span><span class="muted">Observation rationale.</span> ${cut(f.observation,260)}</span>`:""}
        ${(f.intent||f.intention)?`<span><span class="muted">Intent.</span> ${cut(f.intent||f.intention,180)}</span>`:""}</div>`}).join("")}</div>`:`<div class="muted" style="margin-top:4px">None written yet for this week.</div>`}
  </details>`;
}
async function draftInterests(p){
  const src=teamSources(p);if(!src.length){toast("No Individual plans are written for this classroom and week yet.");return}
  const f=FORMS.classroom.fields.find(x=>x.k==="interests");const key=p.id+"interests";
  suggest[key]={status:"working",text:"",from:"ind"};rerenderCard(p,"interests");
  const cur=String(p.fields.interests||"").trim();
  const prompt=`You are helping the classroom team at Fulton Community School & Farm, a Reggio-inspired, nature-based preschool, write the "${f.label}" section of their Classroom Curriculum Plan for the ${p.classroom} classroom, week of ${fmtDate(p.weekOf)}.
The program's standard for this section. ${f.hint}
Strong example. ${f.strong}
Write it from the educators' Individual and small group plans for this week below. Keep it short, 3 to 5 sentences and under 100 words in all. Give one sentence per thread naming the educator or group and what children are wondering, then one sentence on how the threads meet each other or the classroom community. Leave out individual children's names, quotes, and lists of materials, since those live in the Individual plans. Use only what the plans say. Never invent children, quotes, events, or materials. ${cur?"Keep everything the team already wrote and weave it in.":""} ${STYLE}
Return only the section text, with no preface.

${cur?"What the team already wrote.\n"+cur+"\n\n":""}This week's Individual and small group plans.
${teamSourceText(src)}`;
  try{const r=await sample(prompt,{modelTier:"complex",cache:false});const out=(r.text||"").trim().replace(/\u2014/g,", ");suggest[key]=out?{status:"ready",text:out,from:"ind"}:{status:"error",error:assistError("empty_completion","Your text is unchanged."),from:"ind"}}

function fieldCard(p,f){
  if(p.type==="individual"&&f.k==="area"&&p.focus!=="area")f={...f,hint:"The thread your group is following, a question or idea the children keep returning to. A full phrase, not a topic or theme.",strong:"Several children keep asking where the rabbit goes at night and have started drawing tunnels under the yard.",starters:["The children keep returning to ","They are wondering ","Across several sittings, "]};

  if(f.languages)chips+=`<div class="chiprow-label">Languages to keep open</div><div class="chips">${langList(p.languages).map(x=>`<button class="chip ${(p.languages||[]).includes(x)?"on":""}" data-toggle="languages" data-val="${esc(x)}">${esc(x)}</button>`).join("")}</div>${langAddRow("plan")}`;

function nudgeHtml(f,v){

const webSug={};

async function webAssist(p){
  const ctx=planContext(p);
  if(!ctx&&!teamSources(p).length){toast("Write some of the plan first, such as the observation or brainstorm.");return}
  webSug[p.id]={status:"working"};renderMain();
  const filled=webHasContent(p.web);
  const cur=filled?JSON.stringify({focus:p.web.focus,branches:p.web.branches.filter(b=>b.name).map(b=>({name:b.name,materials:b.materials}))}):"";
  const prev=p.prevId&&plans.get(p.prevId);
  const prompt=`You are helping the classroom team at Fulton Community School & Farm, a Reggio-inspired, nature-based preschool, build the curriculum web for their Classroom Curriculum Plan.
Base the web only on what this plan says below. Never invent observations, children, quotes, or events.
The central focus names the emerging thinking children are holding, as a short phrase, never a topic or theme. Give 3 to 6 branches, each a direction the investigation could take that grows from something in the plan. For each branch list specific, varied, open-ended materials. Use materials the plan names where it names them. Where it names none for a branch, suggest 2 to 4 natural or open-ended materials that fit. Add connections only where two branches truly share an idea. Choose languages of expression only from ${JSON.stringify(langList())}. Open questions come from the children or the observation. Environment notes say how the space may change.
${filled?`The team already has this web ${cur}. Suggest how it could evolve from what the plan now says. Keep branches the plan still supports, change or drop ones it no longer supports, and add new ones the plan points to.`:""}${prev&&webHasContent(prev.web)?` Last week's web had the focus "${prev.web.focus}".`:""}${teamSources(p).length?` The educators' Individual and small group plans for this week are below too. A group's investigation can become a branch or a connection where it meets the classroom's thinking.`:""}
${STYLE}
Return JSON {"focus": "", "branches": [{"name": "", "materials": ""}], "connections": [[branch index, branch index]], "languages": [], "questions": "", "environment": "", "why": one sentence naming which parts of the plan the web grew from}

${FORMS[p.type].name}, week of ${fmtDate(p.weekOf)}${p.classroom?", "+p.classroom+" classroom":""}.
${ctx}${teamSources(p).length?"\n\nThis week's Individual and small group plans.\n"+teamSourceText(teamSources(p)):""}`;
  try{
    const out=await sample.json(prompt,{modelTier:"complex",cache:false});
    const c=v=>String(v||"").replace(/\u2014/g,", ").trim();
    const br=(Array.isArray(out?.branches)?out.branches:[]).map(b=>({name:c(b?.name),materials:c(b?.materials)})).filter(b=>b.name).slice(0,6);
    if(!c(out?.focus)&&!br.length)throw {code:"empty_completion"};
    const conn=(Array.isArray(out?.connections)?out.connections:[]).filter(x=>Array.isArray(x)&&x.length===2).map(x=>[+x[0],+x[1]]).filter(([a,b])=>a!==b&&a>=0&&b>=0&&a<br.length&&b<br.length);
    webSug[p.id]={status:"ready",why:c(out?.why),web:{focus:c(out?.focus),branches:br,connections:conn,languages:langPick(out?.languages),questions:c(out?.questions),environment:c(out?.environment)}};
  }catch(err){webSug[p.id]={status:"error",error:assistError(err?.code||"unknown","Your web is unchanged.")}}
  if(currentId===p.id)renderMain();
}
function webLayout(n,cx,cy,rx,ry){const pts=[];for(let i=0;i<n;i++){const a=(-90+i*360/n)*Math.PI/180;pts.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)])}return pts}
function wrapWords(t,max){const words=String(t).split(/\s+/).filter(Boolean);const out=[];let line="";for(const w of words){if((line+" "+w).trim().length>max){if(line)out.push(line);line=w}else line=(line+" "+w).trim()}if(line)out.push(line);return out}
function webPreviewSvg(w){
  const W=560,H=380,cx=W/2,cy=H/2;
  const pts=webLayout(w.branches.length,cx,cy,195,130);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Curriculum web preview">`;
  pts.forEach(([x,y])=>s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--muted)" stroke-width="1.2"/>`);
  (w.connections||[]).forEach(([a,b])=>{if(pts[a]&&pts[b]){const [x1,y1]=pts[a],[x2,y2]=pts[b];const mx=(x1+x2)/2+(cx-(x1+x2)/2)*-0.35,my=(y1+y2)/2+(cy-(y1+y2)/2)*-0.35;s+=`<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" fill="none" stroke="var(--marigold)" stroke-width="1.6" stroke-dasharray="5 4"/>`}});
  const longW=String(w.focus||"").length>52;
  const fl=wrapWords(w.focus||"Central focus",longW?26:20).slice(0,longW?4:3);
  s+=`<ellipse cx="${cx}" cy="${cy}" rx="92" ry="44" fill="var(--moss-soft)" stroke="var(--moss)" stroke-width="1.5"/>`;
  fl.forEach((l,i)=>s+=`<text x="${cx}" y="${cy-(fl.length-1)*(longW?6.5:8)+i*(longW?13:16)+5}" text-anchor="middle" font-size="${longW?11:13.5}" font-weight="600" fill="var(--moss)" font-family="Figtree, sans-serif">${esc(l)}</text>`);
  w.branches.forEach((b,i)=>{const [x,y]=pts[i];const nl=wrapWords(b.name||"Branch "+(i+1),22).slice(0,2);const ml=wrapWords(b.materials,28).slice(0,3);const h=14+nl.length*15+ml.length*13;
    s+=`<rect x="${x-78}" y="${y-h/2}" width="156" height="${h}" rx="7" fill="var(--paper)" stroke="var(--line)"/>`;
    nl.forEach((l,j)=>s+=`<text x="${x}" y="${y-h/2+17+j*15}" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--ink)" font-family="Figtree, sans-serif">${esc(l)}</text>`);
    ml.forEach((l,j)=>s+=`<text x="${x}" y="${y-h/2+17+nl.length*15+j*13}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="Figtree, sans-serif">${esc(l)}</text>`);
  });
  return s+`</svg>`;
}
function drawWebPreview(p){$("#webprev").innerHTML=webPreviewSvg(p.web)}

/* ---------- The year's lens ----------
   A lens is a way of reading the year's plans. This year it is Graphic Languages, in the wider sense used outside Italy
   (drawing, marks, maps, paint, clay, wire, construction, arrangements), read with Reggio Emilia's values. The page gathers
   moments in educators' own words and reads them for the thinking they carry. It never rates how a product looks.
   The name, wording, languages, words, and questions live in Program settings, so another year can carry another lens. */
const LENS_DEFAULT={name:"Graphic Languages",
  description:"The many visible forms children give their thinking, such as drawing, marks, maps, paint, clay, wire, construction, and arrangements. We read each one for the thinking it carries, together with the words, tools, and materials that shaped it.",
  languages:["Drawing and mark-making","Mapping","Painting","Clay and sculpture","Building and construction","Loose parts arrangement","Emergent writing","Recording and comparing"],
  words:["draw","drew","drawn","sketch","mark","line","trace","map","paint","clay","wire","charcoal","chalk","pencil","pen","marker","crayon","ink","paper","collage","sculpt","sculpture","build","built","construct","construction","arrange","arrangement","symbol","sign","write","wrote","written","letter","print","stamp","represent","representation","diagram","blueprint","model"],
  questions:["What idea was the child giving form to?","With what tool, material, and surface?","What words, story, or gesture came with it?","Did the child return to it, or rework it in another language?","How did educators respond?"]};
function normLens(v){
  const d=LENS_DEFAULT,list=(a,f)=>Array.isArray(a)?a.map(x=>String(x||"").trim()).filter(Boolean):f.slice();
  return {name:String(v&&v.name||"").trim()||d.name,description:String(v&&v.description!=null?v.description:d.description),languages:list(v&&v.languages,d.languages),words:list(v&&v.words,d.words),questions:list(v&&v.questions,d.questions)};
}
let LENS=normLens(LENS_DEFAULT), lRoom=LS.get("fps.lroom","All"), lRange=LS.get("fps.lrange","year"), lLang="", lensBusy=false, lensShowAll=false;
function lensRangeStart(){const cur=mondayOf(new Date());if(lRange==="4")return addDays(cur,-21);if(lRange==="8")return addDays(cur,-49);if(lRange==="year")return schoolYearStart();return "0000-00-00"}
function lensPlans(){const s=lensRangeStart();return [...plans.values()].filter(p=>p.id!=="example"&&PLAN_TYPES.includes(p.type)&&p.weekOf>=s&&(lRoom==="All"||p.classroom===lRoom))}
// a lens word matches as a whole word, with the usual endings (maps, mapped, mapping, painted, writing)
function lensRegex(){
  const parts=LENS.words.map(w=>w.toLowerCase().replace(/[^a-z' -]/g,"")).filter(w=>w.length>1).map(w=>{const last=w.slice(-1),stem=w.endsWith("e")?w.slice(0,-1):w;
    return `${w}(?:s|es|d|ed|er|ers|ing|${last}ed|${last}ing)?`+(stem!==w?`|${stem}(?:ing|ed)`:"")});
  return parts.length?new RegExp("\\b(?:"+parts.join("|")+")\\b","gi"):null;
}
function lensMarked(p){const set=new Set(LENS.languages.map(x=>x.toLowerCase()));return [...new Set([...(p.languages||[]),...((p.web&&p.web.languages)||[])].filter(x=>set.has(String(x).toLowerCase())))]}
function lensPlanParts(p){
  const parts=FORMS[p.type].fields.map(f=>[f.label,String(p.fields?.[f.k]||"")]);
  if(p.web)parts.push(["Curriculum web",[p.web.focus,...(p.web.branches||[]).map(b=>[b.name,b.materials].filter(Boolean).join(", ")),p.web.questions,p.web.environment].filter(Boolean).join(". ")]);
  return parts.filter(([,t])=>t.trim());
}
// moments are sentences from the plans themselves, so everything shown is in the educator's own words
function lensMoments(ps){
  const re=lensRegex();const out=[];if(!re)return out;
  for(const p of ps){const seen=new Set();
    for(const [label,text] of lensPlanParts(p)){
      for(const raw of (text.match(/[^.!?\n]+[.!?]*/g)||[])){const sent=raw.trim();if(sent.length<12)continue;re.lastIndex=0;
        const hits=[...new Set((sent.match(re)||[]).map(x=>x.toLowerCase()))];if(!hits.length)continue;
        const key=sent.toLowerCase();if(seen.has(key))continue;seen.add(key);
        out.push({planId:p.id,week:p.weekOf,room:p.classroom||"",section:label,text:sent.length>300?sent.slice(0,297)+"...":sent,hits});
      }}}
  return out.sort((a,b)=>b.week.localeCompare(a.week)||(a.room||"").localeCompare(b.room||""));

}

function lensDigest(ps){

    const mk=lensMarked(p);if(mk.length)o.languages_marked=mk;return o}).filter(o=>Object.keys(o.text).length);

/* ---------- Pages for display: threads, projects, the lens, and stories ----------
   These pages are made to be printed, shared, discussed, and put on the wall. Each one carries a few things that matter,
   set large enough to read from a step away: the statement the page is about, a small number of moments in educators'
   own words, and what the team might do next. Counts, lists of plans, and working details stay on the screen.
   Every page is offered as a PDF and as a Word file, so the layout can be adjusted by hand. */
const RANGE_WORDS={"4":"Last 4 weeks","8":"Last 8 weeks",year:"This school year",all:"All saved plans"};
const safeFile=n=>String(n).replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim();
const shortWeek=w=>w?parseIso(w).toLocaleDateString("en-US",{month:"short",day:"numeric"}):"";
function weeksSpan(ws){const s=[...new Set(ws||[])].filter(Boolean).sort();return s.length?(s.length===1?`Week of ${fmtDate(s[0])}`:`${shortWeek(s[0])} to ${fmtDate(s[s.length-1])}`):""}
// who a moment comes from, kept short for the page
function byLine(p){
  if(!p)return"";
  const who=p.type==="classroom"?(p.classroom?p.classroom+" classroom team":"Classroom team"):[p.educator,p.type==="smallgroup"&&p.group?p.group+" group":(p.focus==="smallgroup"&&(p.groups||[]).length?p.groups.join(" and ")+" group"+(p.groups.length>1?"s":""):""),p.classroom].filter(Boolean).join(", ");
  return [who,"week of "+shortWeek(p.weekOf)].filter(Boolean).join(", ");
}
// a few quotes spread across the weeks, so the page shows the thread moving through time
function pickSpread(list,n){if(list.length<=n)return list;const out=[];for(let i=0;i<n;i++)out.push(list[Math.round(i*(list.length-1)/(n-1))]);return [...new Set(out)]}
const dLead=(label,text)=>({t:"lead",label,text});
const dText=(label,text)=>({t:"text",label,text});
const dQuote=(text,by)=>({t:"quote",text,by});
const dList=(label,items,numbered)=>({t:"list",label,items,numbered:!!numbered});
const dItem=(title,text,by)=>({t:"item",title,text,by});
const dSub=text=>({t:"sub",text});
const has=v=>String(v||"").trim().length>0;
function threadDoc(t){
  const ev=[...(t.evidence||[])].filter(e=>plans.get(e.planId)).sort((a,b)=>(a.week||"").localeCompare(b.week||""));
  const pr=projectOfThread(t.id);const blocks=[];
  if(has(t.question))blocks.push(dLead("The question we are following",t.question));
  const qs=pickSpread(ev,4);
  if(qs.length){blocks.push(dSub("In educators' words"));qs.forEach(e=>blocks.push(dQuote(e.text,byLine(plans.get(e.planId)))))}
  if((t.languages||[]).length)blocks.push(dText("Languages children are using",t.languages.join("  •  ")));
  if((t.next||[]).length)blocks.push(dList("What we might offer next",t.next.slice(0,4)));
  if(has(t.notes))blocks.push(dText("Team notes",t.notes));
  const meta=[["Classroom",t.classroom||"All classrooms"],["Seen",weeksSpan([...(t.weeks||[]),...threadLinkedPlans(t).map(p=>p.weekOf)])]];if(pr)meta.push(["Project",pr.name]);
  return {display:true,type:"report",acc:"smallgroup",title:t.name,meta,blocks};
}
function threadsOverviewDoc(tracked){
  const blocks=tracked.length?tracked.map(t=>{const pr=projectOfThread(t.id);return dItem(t.name,t.question||"",[t.classroom&&t.classroom+" classroom",weeksSpan(t.weeks),pr&&"part of the project "+pr.name].filter(Boolean).join("  •  "))}):[dText("","No threads are being followed in this view yet.")];
  return {display:true,type:"report",acc:"smallgroup",title:"Threads we are following",meta:[["Classrooms",tRoom==="All"?"All":tRoom],["Printed",shortDate(Date.now())]],blocks};
}
function threadsDocs(){
  const tracked=[...threads.values()].filter(t=>!t.unfollowed&&(tRoom==="All"||t.classroom===tRoom||!t.classroom)).sort((a,b)=>(a.status==="closed")-(b.status==="closed")||(b.lastWeek||"").localeCompare(a.lastWeek||""));
  return [threadsOverviewDoc(tracked),...tracked.map(threadDoc)];
}
function projectDoc(x){
  const ths=projThreads(x),rooms=projRooms(x),ws=projWeeks(x);const blocks=[];
  if(has(projUnder(x)))blocks.push(dLead("What may lie underneath",projUnder(x)));
  if(has(x.experience))blocks.push(dText("The experience it grew from",x.experience));
  if(has(projIntent(x)))blocks.push(dText("Our intent as educators",projIntent(x)));
  const earlier=projEarlier(x,"underneath").slice(0,2);
  if(earlier.length)blocks.push(dList("How our reading has changed",earlier.map(r=>`${shortDate(r.at)}. ${r.text}`)));
  if(x.status==="closed"&&has(x.closure))blocks.push(dText("Summary of closure",x.closure));
  if(projWeb(x).branches.length)blocks.push({t:"web",web:Object.assign(projWeb(x),{label:"Possible directions"})});
  if(ths.length){blocks.push(dSub("Threads in this project"));
    for(const {t} of ths){const c=(x.classrooms||[]).find(c=>c.room===t.classroom);
      const where=[t.classroom?t.classroom+" classroom":"",c&&t.classroom===x.home?"where the project began":"",c&&t.classroom!==x.home&&c.week?"joined "+shortWeek(c.week):"",c&&t.classroom!==x.home&&PJOIN[c.how]?"through "+PJOIN[c.how].toLowerCase():""].filter(Boolean).join(", ");
      blocks.push(dItem(t.name,t.question||"",where));
      const last=[...(t.evidence||[])].filter(e=>plans.get(e.planId)).sort((a,b)=>(b.week||"").localeCompare(a.week||""))[0];
      if(last)blocks.push(dQuote(last.text,byLine(plans.get(last.planId))))}}
  if((x.groups||[]).length)blocks.push(dText("Small groups carrying it",x.groups.join("  •  ")));
  if(has(x.returns))blocks.push(dText("How the work returns to the whole class",x.returns));
  if(has(x.people))blocks.push(dText("People beyond the classrooms",x.people));
  if(has(x.notes))blocks.push(dText("Team notes",x.notes));
  return {display:true,type:"report",acc:"classroom",title:x.name||"Project",meta:[["Classrooms",roomsText(x)],["Seen",weeksSpan(ws)||"Started "+shortDate(x.createdAt)]],blocks};
}
function storyDoc(title,fields,meta){
  return {display:true,type:"report",acc:"story",title,meta,blocks:STORY.filter(([k])=>has(fields&&fields[k])).map(([k,l])=>dText(l,fields[k]))};
}
function threadStoryDoc(th){return storyDoc("Project Story, "+th.name,th.story||{},[["Classroom",[th.classroom,(th.groups||[]).join(", ")].filter(Boolean).join(", ")||"All classrooms"],["Seen",weeksSpan(th.weeks)]])}
function projectStoryDoc(x,s){return storyDoc("Project Story, "+x.name,s.fields||{},[["Classrooms",roomsText(x)],["Seen",weeksSpan(projWeeks(x))||shortDate(s.at)]])}
function lensDocs(){
  const ps=lensPlans();let moments=lensMoments(ps);
  if(lLang){const want=lLang.toLowerCase();const okPlan=new Set(ps.filter(p=>lensMarked(p).some(l=>l.toLowerCase()===want)).map(p=>p.id));moments=moments.filter(m=>okPlan.has(m.planId))}
  const meta=[["Classrooms",lRoom==="All"?"All":lRoom],["Plans",RANGE_WORDS[lRange]||""]];
  const blocks=[dText("What it means here",LENS.description),dList("How we read a moment",LENS.questions,true),dText("","Read for the thinking. How a product looks is never rated.")];
  // a page shows a few moments from each week, most recent first. The rest stay on the Lens page.
  const shown=[];const perWeek={};
  for(const m of moments){perWeek[m.week]=(perWeek[m.week]||0)+1;if(perWeek[m.week]<=4&&shown.length<12)shown.push(m)}
  if(shown.length){blocks.push(dSub(`Moments in educators' words${lLang?", "+lLang:""}`));
    for(const m of shown){const p=plans.get(m.planId);const cs=p?planThreads(p):[];
      blocks.push(dQuote(m.text,[byLine(p),cs.length?"thread "+cs[0].t.name:""].filter(Boolean).join("  •  ")))}}
  else blocks.push(dText("","No moments have been described in these weeks yet."));
  const docs=[{display:true,type:"report",acc:"individual",title:LENS.name,meta,blocks}];
  // the closer reading is its own page set. A question the plans did not answer is simply left off.
  const scan=scans.get("lens-"+lRoom);
  if(scan&&(scan.moments||[]).length){const qs=scan.questionsAsked||LENS.questions;const b=[];
    if(has(scan.summary))b.push(dLead("Across these weeks",scan.summary));
    scan.moments.forEach(m=>{const p=plans.get(m.planId);
      b.push(dQuote(m.quote,[byLine(p),m.language].filter(Boolean).join("  •  ")));
      qs.forEach((q,k)=>{const a=(m.answers||[])[k];if(has(a))b.push({t:"qa",q,a})});
      b.push({t:"rule"})});
    if((scan.gaps||[]).length)b.push(dList("What we could notice next",scan.gaps));
    if((scan.teamQuestions||[]).length)b.push(dList("Questions for the team",scan.teamQuestions));
    docs.push({display:true,type:"report",acc:"individual",title:`${scan.lensName||LENS.name}, a closer reading`,meta:[["Classrooms",lRoom==="All"?"All":lRoom],["Plans",RANGE_WORDS[scan.range]||""]],blocks:b})}
  return docs;
}

/* --- drawing a display page as PDF --- */
const DP={lead:{fs:17,lh:23},body:{fs:11.5,lh:16.5},quote:{fs:13,lh:18.5},small:{fs:8.6,lh:12},label:{fs:7.6,h:15},title:{fs:13.5,lh:18}};
function displayAtoms(doc,p,A){
  const atoms=[];const W=CW,ink=[28,42,34],muted=[96,110,101];
  const lines=(text,fs,w,style)=>{doc.setFont("helvetica",style||"normal");doc.setFontSize(fs);return clean(text).trim().split(/\n+/).flatMap(par=>par.trim()?doc.splitTextToSize(par.trim(),w):[])};
  const gap=h=>atoms.push({h,gap:true,draw(){}});
  const label=text=>{if(!has(text))return;atoms.push({h:DP.label.h,keep:true,draw(y){doc.setFont("helvetica","bold");doc.setFontSize(DP.label.fs);doc.setTextColor(...A.c);doc.setCharSpace(.9);doc.text(clean(text).toUpperCase(),M,y+9);doc.setCharSpace(0)}})};
  const textLines=(ls,spec,x,color,style,bar)=>ls.forEach(l=>atoms.push({h:spec.lh,draw(y){if(bar){doc.setFillColor(...bar);doc.rect(M,y-1,3,spec.lh+.5,"F")}doc.setFont("helvetica",style||"normal");doc.setFontSize(spec.fs);doc.setTextColor(...color);doc.text(l,x,y+spec.fs*.86)}}));
  for(const b of p.blocks||[]){
    if(b.t==="lead"){label(b.label);textLines(lines(b.text,DP.lead.fs,W-16,"bold"),DP.lead,M+14,ink,"bold",A.c);gap(16)}
    else if(b.t==="text"){label(b.label);textLines(lines(b.text,DP.body.fs,W),DP.body,M,ink);gap(13)}
    else if(b.t==="quote"){const ls=lines('"'+String(b.text||"").trim()+'"',DP.quote.fs,W-16);ls.forEach((l,i)=>{atoms.push({h:DP.quote.lh,keep:i<ls.length-1||has(b.by),draw(y){doc.setFillColor(...A.t);doc.rect(M,y-1,3,DP.quote.lh+.5,"F");doc.setFont("helvetica","normal");doc.setFontSize(DP.quote.fs);doc.setTextColor(...ink);doc.text(l,M+14,y+DP.quote.fs*.86)}})});
      if(has(b.by))atoms.push({h:DP.small.lh+2,draw(y){doc.setFillColor(...A.t);doc.rect(M,y-1,3,DP.small.lh+2.5,"F");doc.setFont("helvetica","normal");doc.setFontSize(DP.small.fs);doc.setTextColor(...muted);doc.text(doc.splitTextToSize(clean(b.by),W-16)[0],M+14,y+DP.small.fs*.9)}});gap(12)}
    else if(b.t==="item"){const tl=lines(b.title,DP.title.fs,W,"bold");tl.forEach(l=>atoms.push({h:DP.title.lh,keep:true,draw(y){doc.setFont("helvetica","bold");doc.setFontSize(DP.title.fs);doc.setTextColor(...ink);doc.text(l,M,y+DP.title.fs*.86)}}));
      const i0=atoms.length;
      if(has(b.text))textLines(lines(b.text,DP.body.fs,W),DP.body,M,ink);
      if(has(b.by))atoms.push({h:DP.small.lh+2,draw(y){doc.setFont("helvetica","normal");doc.setFontSize(DP.small.fs);doc.setTextColor(...muted);doc.text(doc.splitTextToSize(clean(b.by),W)[0],M,y+DP.small.fs*.9+1)}});
      // a short entry stays whole on one page
      if(atoms.length-i0<=6)for(let k=i0;k<atoms.length-1;k++)atoms[k].keep=true;
      gap(13)}
    else if(b.t==="list"){label(b.label);(b.items||[]).filter(has).forEach((it,i)=>{const ls=lines(it,DP.body.fs,W-18);ls.forEach((l,k)=>atoms.push({h:DP.body.lh,keep:k<ls.length-1,draw(y){doc.setFont("helvetica","normal");doc.setFontSize(DP.body.fs);doc.setTextColor(...ink);if(k===0)doc.text(b.numbered?`${i+1}.`:"•",M+2,y+DP.body.fs*.86);doc.text(l,M+18,y+DP.body.fs*.86)}}));gap(3)});gap(10)}
    else if(b.t==="qa"){atoms.push({h:13,keep:true,draw(y){doc.setFont("helvetica","bold");doc.setFontSize(8.8);doc.setTextColor(...muted);doc.text(doc.splitTextToSize(clean(b.q),W-14)[0],M+14,y+8.5)}});textLines(lines(b.a,DP.body.fs,W-14),DP.body,M+14,ink);gap(6)}
    else if(b.t==="sub"){gap(4);atoms.push({h:26,keep:true,draw(y){doc.setFont("helvetica","bold");doc.setFontSize(12.5);doc.setTextColor(...ink);doc.text(clean(b.text),M,y+12);doc.setDrawColor(...A.c);doc.setLineWidth(1.2);doc.line(M,y+17,M+28,y+17)}})}
    else if(b.t==="rule"){atoms.push({h:14,gap:true,draw(y){doc.setDrawColor(214,222,216);doc.setLineWidth(.6);doc.line(M,y+3,M+W,y+3)}})}
    else if(b.t==="web"){atoms.push({h:300,draw(y){webBox(doc,M,y,W,300,b.web,false,A)}});gap(14)}
  }
  return atoms;
}
function drawDisplay(doc,p,pageAcc){
  const A=ACC[p.acc||p.type]||ACC.classroom;const atoms=displayAtoms(doc,p,A);
  const pages=[[]];let y=PG.top1+4;const top=()=>pages.length===1?PG.top1+4:PG.topN+4;
  for(let i=0;i<atoms.length;i++){const a=atoms[i];
    // a label, a heading, or the first lines of a quote never sit alone at the foot of a page
    let need=a.h;for(let k=i;atoms[k]&&atoms[k].keep&&atoms[k+1];k++)need+=atoms[k+1].h;
    if(y+need>PG.bottom&&pages[pages.length-1].length){pages.push([]);y=top();if(a.gap)continue}
    if(a.gap&&!pages[pages.length-1].length)continue;
    pages[pages.length-1].push({a,y});y+=a.h;
  }
  pages.forEach((pg,pi)=>{
    if(pi>0)doc.addPage();
    pageAcc[doc.getNumberOfPages()]=A;pageInfo[doc.getNumberOfPages()]={i:pi+1,n:pages.length};
    if(pi===0)headerFull(doc,p,A);else headerCont(doc,p,A);
    pg.forEach(({a,y})=>a.draw(y));
  });
}
function drawAny(doc,p,pageAcc){(p.display?drawDisplay:drawPlan)(doc,p,pageAcc)}

/* --- the same page as a Word file --- */

  const bar=color=>({left:{style:BorderStyle.SINGLE,size:18,color,space:10}});
  const paras=text=>clean(text||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
  ch.push(new Paragraph({spacing:{after:40},children:[run("FULTON COMMUNITY SCHOOL & FARM",{bold:true,size:15,color:ac,characterSpacing:30})]}));

    else if(b.t==="text"){label(b.label);paras(b.text).forEach(t=>ch.push(new Paragraph({spacing:{after:160,line:290},children:[run(t)]})))}
    else if(b.t==="quote"){ch.push(new Paragraph({keepNext:has(b.by),spacing:{after:has(b.by)?20:160,line:300},indent:{left:200},border:bar(tn),children:[run('"'+String(b.text||"").trim()+'"',{size:26})]}));
      if(has(b.by))ch.push(new Paragraph({spacing:{after:180},indent:{left:200},border:bar(tn),children:[run(b.by,{size:17,color:"606E65"})]}))}
    else if(b.t==="item"){ch.push(new Paragraph({keepNext:true,spacing:{before:60,after:30},children:[run(b.title,{bold:true,size:27})]}));
      if(has(b.text))ch.push(new Paragraph({keepNext:has(b.by),spacing:{after:30,line:290},children:[run(b.text)]}));
      ch.push(new Paragraph({spacing:{after:200},children:[run(b.by||"",{size:17,color:"606E65"})]}))}
    else if(b.t==="list"){label(b.label);(b.items||[]).filter(has).forEach((it,i)=>ch.push(new Paragraph({spacing:{after:70,line:290},indent:{left:360,hanging:360},children:[run((b.numbered?`${i+1}.`:"•")+"\t"+String(it).trim())]})));ch.push(new Paragraph({spacing:{after:100},children:[]}))}
    else if(b.t==="qa"){ch.push(new Paragraph({keepNext:true,spacing:{after:20},indent:{left:200},children:[run(b.q,{bold:true,size:18,color:"606E65"})]}));paras(b.a).forEach(t=>ch.push(new Paragraph({spacing:{after:110,line:290},indent:{left:200},children:[run(t)]})))}
    else if(b.t==="sub"){ch.push(new Paragraph({keepNext:true,spacing:{before:200,after:120},children:[run(b.text,{bold:true,size:26})]}))}
    else if(b.t==="rule"){ch.push(new Paragraph({spacing:{after:160},border:{bottom:{style:BorderStyle.SINGLE,size:4,color:"D6DED8",space:4}},children:[]}))}

function printsClick(t){
  const word=t.dataset.word==="1";const out=(docs,name)=>{if(!docs.length)return;if(word)makeDocx(docs,safeFile(name+".docx"));else makePdf(docs,safeFile(name+".pdf"))};
  if(t.dataset.print==="threads"){out(threadsDocs(),`Fulton threads ${tRoom==="All"?"all classrooms":tRoom} ${mondayOf(new Date())}`);return true}
  if(t.dataset.print==="thread"){const th=threads.get(t.dataset.id);if(th)out([threadDoc(th)],`Thread ${th.name}`);return true}
  if(t.dataset.print==="tstory"){const th=threads.get(t.dataset.id);if(th&&th.story)out([threadStoryDoc(th)],`Project story ${th.name}`);return true}
  if(t.dataset.print==="projects"){const all=[...projects.values()].sort((a,b)=>(a.status==="closed")-(b.status==="closed")||(b.updatedAt||0)-(a.updatedAt||0));if(!all.length){toast("There are no projects to print yet.");return true}out(all.map(projectDoc),`Fulton projects ${mondayOf(new Date())}`);return true}
  if(t.dataset.print==="project"){const x=projects.get(t.dataset.id);if(x)out([projectDoc(x)],`Project ${x.name}`);return true}
  if(t.dataset.print==="pstory"){const x=projId&&projects.get(projId);const s=x&&(x.stories||[]).find(s=>s.id===t.dataset.id);if(s)out([projectStoryDoc(x,s)],`Project story ${x.name}${s.label?" "+s.label:""}`);return true}
  if(t.dataset.print==="lens"){out(lensDocs(),`Fulton lens ${LENS.name} ${lRoom==="All"?"all classrooms":lRoom} ${mondayOf(new Date())}`);return true}
  return false;
}
